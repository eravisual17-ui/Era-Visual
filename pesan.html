<title>Pesan Layanan — Era Visual</title>
<style>
/* ==========================================================================
   Era Visual — Design System
   Electrical + creative service brand. Blueprint precision meets craft.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  /* Color */
  --blue-600:#2F6FED;
  --blue-500:#4C86FF;
  --blue-100:#EAF1FF;
  --blue-50:#F6F9FF;
  --ink:#16202E;
  --slate:#5B6472;
  --slate-light:#8A93A1;
  --line:#E2E8F1;
  --white:#FFFFFF;
  --amber:#E8A33D;
  --green:#2E9E64;
  --red:#D9503F;

  /* Type */
  --font-display:'Sora', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;

  /* Layout */
  --max-w:1120px;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --shadow-card: 0 1px 2px rgba(22,32,46,0.04), 0 8px 24px rgba(22,32,46,0.06);
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--white);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  margin:0 0 .5em 0;
  line-height:1.2;
  letter-spacing:-0.01em;
}
h1{font-size:clamp(2rem,5vw,2.9rem); font-weight:700;}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem); font-weight:700;}
h3{font-size:1.15rem; font-weight:600;}
p{margin:0 0 1em 0; color:var(--slate);}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
ul{margin:0; padding:0;}
button{font-family:inherit;}

.container{
  max-width:var(--max-w);
  margin:0 auto;
  padding:0 20px;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 22px;
  border-radius:var(--radius-s);
  font-weight:600;
  font-size:.95rem;
  cursor:pointer;
  border:1.5px solid transparent;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--blue-600); color:var(--white);}
.btn-primary:hover{background:#255cd1;}
.btn-outline{background:var(--white); color:var(--blue-600); border-color:var(--blue-600);}
.btn-outline:hover{background:var(--blue-50);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--slate-light);}
.btn-whatsapp{background:#25D366; color:#04361b;}
.btn-whatsapp:hover{background:#1fbd5a;}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px; font-size:.85rem;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- Navbar ---------- */
.navbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.navbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px;
  max-width:var(--max-w);
  margin:0 auto;
}
.nav-brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.05rem;}
.nav-brand .mark{width:34px; height:34px; object-fit:contain;}
.nav-links{display:flex; align-items:center; gap:28px;}
.nav-links a{font-size:.92rem; font-weight:500; color:var(--slate); padding:6px 0; border-bottom:2px solid transparent;}
.nav-links a.active, .nav-links a:hover{color:var(--ink); border-color:var(--blue-600);}
.nav-links-head{display:none;}
.nav-cta{display:flex; align-items:center; gap:12px;}
.nav-toggle{display:none; background:none; border:none; cursor:pointer; padding:10px 9px;}
.nav-toggle span{display:block; width:25px; height:2.5px; border-radius:2px; background:var(--ink); margin:6px 0; transition:.2s;}

@media (max-width:860px){
  .nav-overlay{
    position:fixed; inset:0;
    background:rgba(16,22,32,0.55);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:150;
  }
  .nav-overlay.open{ opacity:1; pointer-events:auto; }

  .nav-links{
    position:fixed; top:0; right:0; bottom:0;
    width:82%; max-width:320px;
    background:var(--white);
    flex-direction:column; align-items:stretch;
    padding:22px 22px 40px;
    gap:2px;
    transform:translateX(100%);
    transition:transform .28s ease;
    overflow-y:auto;
    z-index:200;
    box-shadow:-8px 0 32px rgba(22,32,46,0.18);
  }
  .nav-links-head{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:16px; margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .nav-links-head span{font-family:var(--font-display); font-weight:700; font-size:1.05rem;}
  .nav-close{
    background:var(--blue-50); border:none; border-radius:10px;
    width:36px; height:36px; font-size:1.2rem; line-height:1;
    color:var(--ink); cursor:pointer;
  }
  .nav-links a{
    width:100%; padding:16px 8px;
    font-size:1.05rem; font-weight:600;
    border-bottom:1px solid var(--line); border-radius:0;
  }
  .nav-links.open{transform:translateX(0);}
  .nav-toggle{display:block;}
  .nav-cta .btn-outline{display:none;}
  body.nav-open{overflow:hidden;}
}

/* ---------- Hero ---------- */
.hero{
  padding:64px 0 56px;
  border-bottom:1px solid var(--line);
  background:
    linear-gradient(180deg, var(--blue-50) 0%, rgba(255,255,255,0) 60%);
}
.hero-inner{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:18px;
  max-width:640px;
  margin:0 auto;
}
.hero-logo{width:92px; height:92px; margin-bottom:6px; object-fit:contain; display:block;}
.hero-logo-frame{
  width:120px; height:120px;
  display:flex; align-items:center; justify-content:center;
  background:var(--white);
  border-radius:24px;
  border:1px solid var(--blue-100);
  box-shadow:0 6px 20px rgba(47,111,237,0.14), 0 2px 6px rgba(22,32,46,0.06);
  margin:0 auto 4px;
}
.hero-logo-frame .hero-logo{margin-bottom:0;}
.hero-tag{
  color:var(--blue-600); font-weight:600; font-size:.95rem;
}
.hero p.lead{font-size:1.05rem; max-width:520px;}
.hero-actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:8px;}

/* ---------- Section ---------- */
.section{padding:56px 0;}
.section-head{max-width:620px; margin:0 0 32px 0;}
.section-head.center{margin:0 auto 36px; text-align:center;}

/* ---------- Cards ---------- */
.grid{display:grid; gap:20px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:860px){ .grid-3,.grid-2{grid-template-columns:1fr;} }

.card{
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  padding:24px;
  background:var(--white);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.card:hover{box-shadow:var(--shadow-card); border-color:#D3DEEE;}

.service-card .icon{
  width:44px; height:44px;
  border-radius:10px;
  background:var(--blue-100);
  display:flex; align-items:center; justify-content:center;
  font-size:1.35rem;
  margin-bottom:14px;
}
.badge{
  display:inline-block;
  font-size:.72rem;
  font-weight:600;
  padding:4px 10px;
  border-radius:100px;
  background:var(--blue-100); color:var(--blue-600);
}
.badge.soon{background:#FCEFDC; color:#9A6A1B;}
.badge.dev{background:#EDEAFB; color:#5B4BB8;}
.badge.inactive{background:#F1F3F6; color:var(--slate-light);}
.badge.status-Menunggu{background:#FCEFDC;color:#9A6A1B;}
.badge.status-Dikonfirmasi{background:var(--blue-100);color:var(--blue-600);}
.badge.status-Diproses{background:#EDEAFB;color:#5B4BB8;}
.badge.status-Selesai{background:#E4F6EC;color:var(--green);}
.badge.status-Dibatalkan{background:#FBEAE7;color:var(--red);}

.branch-card{position:relative;}
.branch-card .badge{position:absolute; top:20px; right:20px;}

.employee-card{display:flex; flex-direction:column; align-items:center; text-align:center;}
.avatar{
  width:76px; height:76px; border-radius:50%;
  background:var(--blue-100); color:var(--blue-600);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:1.3rem;
  margin-bottom:12px; overflow:hidden;
}
.avatar img{width:100%; height:100%; object-fit:cover;}

/* ---------- Steps ---------- */
.stepper{display:flex; gap:8px; margin-bottom:36px; flex-wrap:wrap;}
.step-pill{
  flex:1; min-width:110px;
  text-align:center;
  padding:10px 6px;
  font-size:.78rem; font-weight:600;
  color:var(--slate-light);
  border-bottom:3px solid var(--line);
}
.step-pill.active{color:var(--blue-600); border-color:var(--blue-600);}
.step-pill.done{color:var(--ink); border-color:var(--green);}

.option-list{display:grid; gap:12px;}
.option-item{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px;
  border:1.5px solid var(--line);
  border-radius:var(--radius-m);
  padding:18px 20px;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
  background:var(--white);
}
.option-item:hover{border-color:var(--blue-500);}
.option-item.selected{border-color:var(--blue-600); background:var(--blue-50);}
.option-item.disabled{cursor:not-allowed; opacity:.55;}
.option-item .opt-title{font-weight:600; margin-bottom:2px;}
.option-item .opt-sub{font-size:.85rem; color:var(--slate-light);}

/* ---------- Forms ---------- */
.form-field{margin-bottom:18px;}
.form-field label{display:block; font-size:.86rem; font-weight:600; margin-bottom:6px;}
.form-field .hint{font-size:.78rem; color:var(--slate-light); margin-top:4px;}
.form-field input,
.form-field textarea,
.form-field select{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:var(--radius-s);
  font-size:.95rem;
  font-family:inherit;
  background:var(--white);
  color:var(--ink);
}
.form-field input:focus,
.form-field textarea:focus,
.form-field select:focus{outline:2px solid var(--blue-500); outline-offset:1px; border-color:var(--blue-500);}
.form-field.error input,
.form-field.error textarea,
.form-field.error select{border-color:var(--red);}
.form-field .err-msg{color:var(--red); font-size:.78rem; margin-top:4px; display:none;}
.form-field.error .err-msg{display:block;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:640px){ .form-row{grid-template-columns:1fr;} }

/* ---------- Summary box ---------- */
.summary-box{
  background:var(--blue-50);
  border:1px solid var(--blue-100);
  border-radius:var(--radius-m);
  padding:20px;
  margin-bottom:24px;
}
.summary-row{display:flex; justify-content:space-between; gap:12px; padding:7px 0; font-size:.92rem; border-bottom:1px solid rgba(47,111,237,0.1);}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--slate);}
.summary-row .v{font-weight:600; text-align:right;}

/* ---------- Confirmation ---------- */
.confirm-icon{
  width:64px; height:64px; border-radius:50%;
  background:#E4F6EC; color:var(--green);
  display:flex; align-items:center; justify-content:center;
  font-size:2rem; margin:0 auto 18px;
}

/* ---------- Footer ---------- */
.footer{background:var(--ink); color:#C7CEDA; padding:44px 0 26px; margin-top:60px;}
.footer .container{display:flex; flex-direction:column; gap:22px;}
.footer-top{display:flex; flex-wrap:wrap; justify-content:space-between; gap:24px;}
.footer h4{color:var(--white); font-size:.95rem; margin-bottom:10px;}
.footer a{color:#C7CEDA;}
.footer a:hover{color:var(--white);}
.footer .services-line{font-size:.88rem; color:#8E97A6;}
.footer-bottom{border-top:1px solid #2A3444; padding-top:18px; font-size:.8rem; color:#8E97A6; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

/* ---------- Misc ---------- */
.divider{height:1px; background:var(--line); margin:36px 0;}
.eyebrow{color:var(--blue-600); font-weight:600; font-size:.9rem; margin-bottom:6px;}
.text-center{text-align:center;}
.empty-state{text-align:center; padding:48px 20px; color:var(--slate-light);}
.timeline{display:grid; gap:18px;}
.timeline-item{display:flex; gap:16px;}
.timeline-num{
  width:32px; height:32px; border-radius:50%;
  background:var(--blue-100); color:var(--blue-600);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:.9rem; flex-shrink:0;
}
.timeline-item h3{margin-bottom:4px;}

.mono-note{font-size:.8rem; color:var(--slate-light); background:var(--blue-50); border-radius:var(--radius-s); padding:10px 14px;}

/* ---------- News / Berita cards ---------- */
.news-grid{display:grid; gap:26px; grid-template-columns:repeat(2,1fr);}
@media (max-width:760px){ .news-grid{grid-template-columns:1fr;} }
.news-card{
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  overflow:hidden;
  background:var(--white);
  transition:box-shadow .15s ease, border-color .15s ease;
  display:flex; flex-direction:column;
}
.news-card:hover{box-shadow:var(--shadow-card); border-color:#D3DEEE;}
.news-card .news-img{
  width:100%;
  height:auto;
  display:block;
  background:var(--blue-50);
}
.news-card .news-body{padding:20px 22px 22px;}
.news-card .news-date{font-size:.78rem; color:var(--blue-600); font-weight:600; margin-bottom:6px;}
.news-card h3{margin-bottom:8px;}
.news-card .news-excerpt{margin-bottom:10px;}
.news-card .news-full{display:none; margin-top:6px;}
.news-card.expanded .news-full{display:block;}
.news-toggle{background:none; border:none; color:var(--blue-600); font-weight:600; font-size:.88rem; cursor:pointer; padding:0;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--white);
  padding:12px 20px; border-radius:var(--radius-s);
  font-size:.88rem; opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:200;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; scroll-behavior:auto !important;}
}

</style>
</head>

<div id="ev-navbar" class="navbar"></div>

<section class="section">
  <div class="container" style="max-width:720px;">
    <div class="section-head">
      <div class="eyebrow">Pesan Layanan</div>
      <h1 id="wizard-title">Pesan Layanan Era Visual</h1>
    </div>

    <div class="stepper" id="stepper"></div>
    <div id="step-container"></div>
  </div>
</section>

<div id="ev-footer" class="footer"></div>

<script>
/* ==========================================================================
   Era Visual — Data Store
   Simulasi backend memakai localStorage (khusus MVP / GitHub Pages), dengan
   opsi tambahan menyambung ke Google Sheets lewat SheetDB.io supaya ORDER
   bisa terpusat dari semua perangkat. Lihat README bagian "Order Terpusat
   dengan Google Sheets (SheetDB)" untuk cara mengaktifkannya.
   Semua fungsi CRUD untuk cabang, layanan, karyawan, order & kontak ada di sini.
   ========================================================================== */

const EV_DB_KEY = 'era_visual_db_v1';

// Ganti dengan URL API dari SheetDB.io (format: https://sheetdb.io/api/v1/xxxxxxxxxxxxx)
// supaya ORDER tersimpan terpusat (bisa dilihat dari HP mana saja), bukan
// cuma di localStorage perangkat masing-masing. Biarkan seperti ini
// (placeholder) untuk tetap pakai mode localStorage biasa.
const ERA_BACKEND_URL = 'https://sheetdb.io/api/v1/a03ovjkr3edll';

function evBackendConfigured(){
  return typeof ERA_BACKEND_URL === 'string' && !ERA_BACKEND_URL.startsWith('GANTI_') && ERA_BACKEND_URL.length > 0;
}

// Kirim order baru ke SheetDB (fire-and-forget, tidak memblokir tampilan).
function evBackendSend(payload){
  if(!evBackendConfigured()) return Promise.resolve(null);

  if(payload.action === 'create'){
    return fetch(ERA_BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: [payload.order] })
    }).catch(err => { console.error('Gagal kirim ke SheetDB:', err); return null; });
  }

  if(payload.action === 'updateStatus'){
    // SheetDB: PATCH ke /id/<id> untuk update baris yang cocok di kolom "id"
    return fetch(ERA_BACKEND_URL + '/id/' + encodeURIComponent(payload.id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: { status: payload.status } })
    }).catch(err => { console.error('Gagal update status di SheetDB:', err); return null; });
  }

  return Promise.resolve(null);
}

function evBackendList(){
  if(!evBackendConfigured()) return Promise.resolve(null);
  return fetch(ERA_BACKEND_URL)
    .then(r => r.json())
    .then(rows => Array.isArray(rows) ? rows : null)
    .catch(err => { console.error('Gagal ambil data dari SheetDB:', err); return null; });
}

// ---- Karyawan terpusat (SheetDB terpisah, sheet berbeda dari Order) ----
// Ganti dengan URL API SheetDB khusus untuk data Karyawan.
// Foto TIDAK ikut disinkron (tetap tersimpan lokal per HP saja).
const ERA_EMPLOYEES_BACKEND_URL = 'https://sheetdb.io/api/v1/y6x046dtx26y9';

function evEmployeesBackendConfigured(){
  return typeof ERA_EMPLOYEES_BACKEND_URL === 'string' && !ERA_EMPLOYEES_BACKEND_URL.startsWith('GANTI_') && ERA_EMPLOYEES_BACKEND_URL.length > 0;
}

function evEmployeesBackendSend(payload){
  if(!evEmployeesBackendConfigured()) return Promise.resolve(null);

  if(payload.action === 'create'){

function evLoadDB(){
  let raw = localStorage.getItem(EV_DB_KEY);

    localStorage.setItem(EV_DB_KEY, JSON.stringify(EV_SEED));
    return JSON.parse(JSON.stringify(EV_SEED));
  }

  }catch(e){
    localStorage.setItem(EV_DB_KEY, JSON.stringify(EV_SEED));
    return JSON.parse(JSON.stringify(EV_SEED));
  }
}

function evSaveDB(db){
  localStorage.setItem(EV_DB_KEY, JSON.stringify(db));
}

const EraDB = {
  reset(){ localStorage.setItem(EV_DB_KEY, JSON.stringify(EV_SEED)); },

    const i = db.services.findIndex(s => s.id === service.id);
    if(i >= 0) db.services[i] = service; else db.services.push(service);
    evSaveDB(db);
  },
  deleteService(id){
    const db = evLoadDB();
    db.services = db.services.filter(s => s.id !== id);
    evSaveDB(db);
  },

  // ---------- Employees ----------
  getEmployees(){ return evLoadDB().employees; },
  getEmployee(id){ return evLoadDB().employees.find(e => e.id === id); },
  getEmployeesFor(branchId, serviceId){
    return evLoadDB().employees.filter(e =>
      e.active && e.branchId === branchId && e.serviceIds.includes(serviceId)
    );
  },
  saveEmployee(emp){
    const db = evLoadDB();
    const i = db.employees.findIndex(e => e.id === emp.id);
    const isNew = i < 0;
    if(i >= 0) db.employees[i] = emp; else db.employees.push(emp);
    evSaveDB(db);
    // Kirim ke SheetDB (foto sengaja TIDAK ikut dikirim — tetap lokal per HP)
    evEmployeesBackendSend({
      action: isNew ? 'create' : 'update',
      employee: {
        id: emp.id,
        name: emp.name,
        role: emp.role,
        branchId: emp.branchId,
        serviceIds: (emp.serviceIds || []).join(','),
        whatsapp: emp.whatsapp || '',
        description: emp.description || '',
        active: emp.active ? 'true' : 'false'
      }
    });
  },
  deleteEmployee(id){
    const db = evLoadDB();
    db.employees = db.employees.filter(e => e.id !== id);
    evSaveDB(db);
    evEmployeesBackendSend({ action: 'delete', id });
  },
  // Ambil data karyawan terbaru dari SheetDB dan perbarui cache lokal.
  // Foto lokal yang sudah ada tetap dipertahankan (tidak ikut disinkron).
  syncEmployeesFromRemote(){
    if(!evEmployeesBackendConfigured()) return Promise.resolve(false);
    return evEmployeesBackendList().then(remote => {
      // Kalau sheet masih kosong, jangan timpa data lokal (supaya karyawan
      // yang sudah ada tidak hilang sebelum sempat dikirim ke Sheets).
      if(!remote || remote.length === 0) return false;
      const db = evLoadDB();
      const localPhotoById = {};
      db.employees.forEach(e => { if(e.photo) localPhotoById[e.id] = e.photo; });
      db.employees = remote.map(r => ({
        id: r.id,
        name: r.name || '',
        role: r.role || '',
        branchId: r.branchId || '',
        serviceIds: (r.serviceIds || '').split(',').map(s => s.trim()).filter(Boolean),
        whatsapp: r.whatsapp || '',
        photo: localPhotoById[r.id] || '',
        description: r.description || '',
        active: (r.active === 'true' || r.active === true)
      }));
      evSaveDB(db);
      return true;
    });
  },
  // Kirim SEMUA karyawan yang ada di HP ini ke Google Sheets sekaligus.
  // Dipakai sekali di awal supaya karyawan bawaan/lama ikut masuk ke sheet
  // (karena mereka dibuat sebelum sheet-nya disambungkan).
  pushAllEmployeesToRemote(){
    if(!evEmployeesBackendConfigured()) return Promise.resolve(false);
    const employees = evLoadDB().employees;
    if(employees.length === 0) return Promise.resolve(true);
    const rows = employees.map(e => ({
      id: e.id,
      name: e.name,
      role: e.role,
      branchId: e.branchId,
      serviceIds: (e.serviceIds || []).join(','),
      whatsapp: e.whatsapp || '',
      description: e.description || '',
      active: e.active ? 'true' : 'false'
    }));
    return fetch(ERA_EMPLOYEES_BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: rows })
    }).then(r => r.ok).catch(err => { console.error('Gagal kirim semua karyawan:', err); return false;
    });
  },

  // ---------- Orders ----------
  getOrders(){ return evLoadDB().orders.slice().reverse(); },
  getOrder(id){ return evLoadDB().orders.find(o => o.id === id); },
  getOrdersRemote(){
    return evBackendList().then(remote => {
      if(!remote) return null;
      return remote.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    });
  },
  createOrder(order){
    const db = evLoadDB();
    const now = new Date();
    const orderNumber = 'EV-' + now.getFullYear().toString().slice(-2) +
      String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') +
      '-' + Math.floor(1000 + Math.random()*9000);
    const full = Object.assign({
      id: 'ord-' + Date.now(),
      orderNumber: orderNumber,
      status: 'Menunggu',
      createdAt: now.toISOString()
    }, order);
    db.orders.push(full);
    evSaveDB(db);
    evBackendSend({ action: 'create', order: full }); // kirim ke Google Sheets kalau sudah dikonfigurasi
    return full;
  },
  updateOrderStatus(id, status){
    const db = evLoadDB();
    const o = db.orders.find(o => o.id === id);
    if(o){ o.status = status; evSaveDB(db); }
    evBackendSend({ action: 'updateStatus', id, status });
  },

  // ---------- Posts (Berita / Info / Iklan) ----------
  getPosts(){
    return evLoadDB().posts.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  },
  getPost(id){ return evLoadDB().posts.find(p => p.id === id); },
  savePost(post){
    const db = evLoadDB();
    const i = db.posts.findIndex(p => p.id === post.id);
    if(i >= 0) db.posts[i] = post; else db.posts.push(post);
    evSaveDB(db);
  },
  deletePost(id){
    const db = evLoadDB();
    db.posts = db.posts.filter(p => p.id !== id);
    evSaveDB(db);
  }
};

function evNavLink(href, label){
  const current = window.location.pathname.split('/').pop() || 'index.html';
  const isActive = current === href;
  return `<a href="${href}"${isActive ? ' class="active"' : ''}>${label}</a>`;
}

function evRenderNavbar(){
  const el = document.getElementById('ev-navbar');
  if(!el) return;
  el.innerHTML = `
    <div class="navbar-inner">
      <a href="index.html" class="nav-brand"><img class="mark" src="${EV_LOGO_IMG}" alt="Logo Era Visual"><span>Era Visual</span></a>
      <div class="nav-cta">
        <a href="pesan.html" class="btn btn-primary btn-sm">Pesan Sekarang</a>
        <button class="nav-toggle" id="ev-nav-toggle" aria-label="Buka menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  `;

  // Panel menu & overlay-nya sengaja ditaruh langsung di <body> (bukan di
  // dalam .navbar) karena .navbar punya backdrop-filter — elemen dengan
  // position:fixed di dalam ancestor ber-backdrop-filter jadi "fixed" relatif
  // ke ancestor itu, bukan ke layar, sehingga ikut bergeser saat halaman
  // discroll. Menaruhnya di body menghindari masalah itu.
  let drawer = document.getElementById('ev-nav-drawer-root');
  if(!drawer){
    drawer = document.createElement('div');
    drawer.id = 'ev-nav-drawer-root';
    drawer.innerHTML = `
      <div class="nav-overlay" id="ev-nav-overlay"></div>
      <nav class="nav-links" id="ev-nav-links">
        <div class="nav-links-head">
          <span>Menu</span>
          <button class="nav-close" id="ev-nav-close" aria-label="Tutup menu">&times;</button>
        </div>
        ${evNavLink('index.html','Home')}
        ${evNavLink('layanan.html','Layanan')}
        ${evNavLink('cabang.html','Cabang')}
        ${evNavLink('berita.html','Berita')}
        ${evNavLink('cara-order.html','Cara Order')}
        ${evNavLink('tentang.html','Tentang Kami')}
        ${evNavLink('kontak.html','Kontak')}
      </nav>
    `;
    document.body.appendChild(drawer);
  }

  const toggle = document.getElementById('ev-nav-toggle');
  const closeBtn = document.getElementById('ev-nav-close');
  const overlay = document.getElementById('ev-nav-overlay');
  const links = document.getElementById('ev-nav-links');

  function openMenu(){
    links.classList.add('open');
    overlay.classList.add('open');
    document.body.classList.add('nav-open');
  }
  function closeMenu(){
    links.classList.remove('open');
    overlay.classList.remove('open');
    document.body.classList.remove('nav-open');
  }

  toggle.addEventListener('click', () => {
    links.classList.contains('open') ? closeMenu() : openMenu();
  });
  closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', closeMenu);
  links.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
}

function evRenderFooter(){
  const el = document.getElementById('ev-footer');
  if(!el) return;
  const c = EraDB.getContact();
  el.innerHTML = `
    <div class="container">
      <div class="footer-top">
        <div>
          <h4>Era Visual</h4>
          <p class="services-line">Electrical Engineering &bull; Editor &bull; Mechanical &bull; Sewing</p>
        </div>
        <div>
          <h4>Kontak</h4>
          <p class="services-line">📧 <a href="mailto:${c.email}">${c.email}</a></p>
          <p class="services-line">📱 <a href="https://wa.me/${c.whatsapp}" target="_blank" rel="noopener">${c.whatsapp_display}</a></p>
          <p class="services-line">📸 <a href="https://instagram.com/${c.instagram.replace('@','')}" target="_blank" rel="noopener">${c.instagram}</a></p>
        </div>
        <div>
          <h4>Cabang</h4>
          <p class="services-line">Cabang Ende</p>
        </div>
      </div>
      <div class="footer-bottom">
        <span>&copy; 2023 Era Visual</span>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  `;
}

function evShowToast(msg){
  let t = document.getElementById('ev-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'ev-toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function evWaLink(phone, message){
  return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
}

function evEscape(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

document.addEventListener('DOMContentLoaded', () => {
  evRenderNavbar();
  evRenderFooter();
});

</script>
<script>
/* ==========================================================================
   Era Visual — Wizard Pesan Layanan
   Langkah 1 Cabang -> 2 Layanan -> 3 Karyawan -> 4 Form -> 5 Konfirmasi
   ========================================================================== */

const EvOrder = {
  step: 1,
  branchId: null,
  serviceId: null,
  employeeId: null,
  createdOrder: null
};

const STEP_LABELS = ['Cabang', 'Layanan', 'Karyawan', 'Detail', 'Selesai'];

function evGetParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function evRenderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = STEP_LABELS.map((label, i) => {
    const n = i + 1;
    let cls = '';
    if(n < EvOrder.step) cls = 'done';
    if(n === EvOrder.step) cls = 'active';
    return `<div class="step-pill ${cls}">${n}. ${label}</div>`;
  }).join('');
}

function evGoStep(n){
  EvOrder.step = n;
  evRenderStepper();
  const renderers = { 1: evRenderStep1, 2: evRenderStep2, 3: evRenderStep3, 4: evRenderStep4, 5: evRenderStep5 };
  renderers[n]();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- Step 1: Pilih Cabang ---------- */
function evRenderStep1(){
  const branches = EraDB.getBranches();
  const el = document.getElementById('step-container');
  el.innerHTML = `
    <h2 style="font-size:1.15rem;">Pilih Cabang</h2>
    <div class="option-list" id="branch-options"></div>
  `;
  const wrap = document.getElementById('branch-options');
  wrap.innerHTML = branches.map(b => {
    const disabled = b.status !== 'active';
    return `
      <div class="option-item ${disabled ? 'disabled' : ''} ${EvOrder.branchId === b.id ? 'selected' : ''}" data-id="${b.id}">
        <div>
          <div class="opt-title">${evEscape(b.name)}</div>
          <div class="opt-sub">${disabled ? 'Belum aktif' : 'Aktif — siap menerima pesanan'}</div>
        </div>
        ${evBranchStatusBadge(b.status)}
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.option-item:not(.disabled)').forEach(node => {
    node.addEventListener('click', () => {
      EvOrder.branchId = node.dataset.id;
      EvOrder.serviceId = null;
      EvOrder.employeeId = null;
      evGoStep(2);
    });
  });
}

/* ---------- Step 2: Pilih Layanan ---------- */
function evRenderStep2(){
  const services = EraDB.getServices();
  const el = document.getElementById('step-container');
  const branch = EraDB.getBranch(EvOrder.branchId);
  el.innerHTML = `
    <h2 style="font-size:1.15rem;">Pilih Layanan <span style="color:var(--slate-light); font-weight:500; font-size:.9rem;">— ${evEscape(branch ? branch.name : '')}</span></h2>
    <div class="option-list" id="service-options"></div>
    <div style="margin-top:20px;">
      <button class="btn btn-ghost btn-sm" id="back-1">&larr; Kembali</button>
    </div>
  `;
  document.getElementById('back-1').addEventListener('click', () => evGoStep(1));

  const wrap = document.getElementById('service-options');
  wrap.innerHTML = services.map(s => {
    const disabled = s.status !== 'active';
    return `
      <div class="option-item ${disabled ? 'disabled' : ''} ${EvOrder.serviceId === s.id ? 'selected' : ''}" data-id="${s.id}">
        <div>
          <div class="opt-title">${s.icon} ${evEscape(s.name)}</div>
          <div class="opt-sub">${evEscape(s.short)}</div>
        </div>
        ${evServiceStatusBadge(s.status)}
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.option-item:not(.disabled)').forEach(node => {
    node.addEventListener('click', () => {
      EvOrder.serviceId = node.dataset.id;
      EvOrder.employeeId = null;
      evGoStep(3);
    });
  });
}

/* ---------- Step 3: Pilih Karyawan ---------- */
function evRenderStep3(){
  const branch = EraDB.getBranch(EvOrder.branchId);
  const service = EraDB.getService(EvOrder.serviceId);
  const employees = EraDB.getEmployeesFor(EvOrder.branchId, EvOrder.serviceId);
  const el = document.getElementById('step-container');

  el.innerHTML = `
    <h2 style="font-size:1.15rem;">Pilih Karyawan / Penanggung Jawab</h2>
    <p class="opt-sub" style="margin-bottom:16px;">${evEscape(branch.name)} — ${evEscape(service.name)}</p>
    <div id="employee-options"></div>
    <div style="margin-top:20px;">
      <button class="btn btn-ghost btn-sm" id="back-2">&larr; Kembali</button>
    </div>
  `;
  document.getElementById('back-2').addEventListener('click', () => evGoStep(2));

  const wrap = document.getElementById('employee-options');
  if(employees.length === 0){
    wrap.innerHTML = `<div class="empty-state">Belum ada karyawan aktif untuk kombinasi cabang &amp; layanan ini. Silakan pilih layanan lain atau hubungi kami langsung lewat WhatsApp.</div>`;
    return;
  }
  wrap.className = 'option-list';
  wrap.innerHTML = employees.map(e => `
    <div class="option-item ${EvOrder.employeeId === e.id ? 'selected' : ''}" data-id="${e.id}">
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="avatar" style="width:44px; height:44px; font-size:.9rem;">${evEscape(e.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
        <div>
          <div class="opt-title">${evEscape(e.name)}</div>
          <div class="opt-sub">${evEscape(e.role)}</div>
        </div>
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('.option-item').forEach(node => {
    node.addEventListener('click', () => {
      EvOrder.employeeId = node.dataset.id;
      evGoStep(4);
    });
  });
}

/* ---------- Step 4: Form Detail Order ---------- */
function evRenderStep4(){
  const branch = EraDB.getBranch(EvOrder.branchId);
  const service = EraDB.getService(EvOrder.serviceId);
  const employee = EraDB.getEmployee(EvOrder.employeeId);
  const el = document.getElementById('step-container');

  el.innerHTML = `
    <h2 style="font-size:1.15rem;">Isi Detail Pesanan</h2>
    <div class="summary-box">
      <div class="summary-row"><span class="k">Cabang</span><span class="v">${evEscape(branch.name)}</span></div>
      <div class="summary-row"><span class="k">Layanan</span><span class="v">${evEscape(service.name)}</span></div>
      <div class="summary-row"><span class="k">Penanggung Jawab</span><span class="v">${evEscape(employee.name)}</span></div>
    </div>

    <form id="order-form" novalidate>
      <div class="form-field" data-field="customerName">
        <label>Nama Pelanggan *</label>
        <input type="text" name="customerName" placeholder="Nama lengkap">
        <div class="err-msg">Nama wajib diisi.</div>
      </div>
      <div class="form-row">
        <div class="form-field" data-field="customerWhatsapp">
          <label>Nomor WhatsApp *</label>
          <input type="tel" name="customerWhatsapp" placeholder="08xxxxxxxxxx">
          <div class="err-msg">Nomor WhatsApp wajib diisi.</div>
        </div>
        <div class="form-field" data-field="customerEmail">
          <label>Email <span style="font-weight:400; color:var(--slate-light);">(opsional)</span></label>
          <input type="email" name="customerEmail" placeholder="nama@email.com">
        </div>
      </div>
      ${service.isLocal ? `
      <div class="form-field" data-field="location">
        <label>Lokasi Pekerjaan *</label>
        <input type="text" name="location" placeholder="Alamat / titik lokasi pekerjaan">
        <div class="err-msg">Lokasi wajib diisi untuk layanan ini.</div>
      </div>` : ''}
      <div class="form-field" data-field="description">
        <label>Deskripsi Kebutuhan *</label>
        <textarea name="description" rows="4" placeholder="Jelaskan kebutuhan pekerjaan kamu"></textarea>
        <div class="err-msg">Deskripsi kebutuhan wajib diisi.</div>
      </div>
      <div class="form-field">
        <label>Upload Foto / Dokumen <span style="font-weight:400; color:var(--slate-light);">(opsional)</span></label>
        <input type="file" name="attachment">
        <div class="hint">Nama file akan dicatat di ringkasan pesanan; kirim filenya langsung lewat WhatsApp setelah order terkirim.</div>
      </div>
      <div class="form-field">
        <label>Catatan Tambahan <span style="font-weight:400; color:var(--slate-light);">(opsional)</span></label>
        <textarea name="notes" rows="2" placeholder="Catatan lain, jika ada"></textarea>
      </div>

      <div style="display:flex; gap:12px; margin-top:8px; flex-wrap:wrap;">
        <button type="button" class="btn btn-ghost" id="back-3">&larr; Kembali</button>
        <button type="submit" class="btn btn-primary">Kirim Pesanan</button>
      </div>
    </form>
  `;

  document.getElementById('back-3').addEventListener('click', () => evGoStep(3));

  document.getElementById('order-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);
    const isLocal = service.isLocal;

    const fields = {
      customerName: (data.get('customerName') || '').trim(),
      customerWhatsapp: (data.get('customerWhatsapp') || '').trim(),
      customerEmail: (data.get('customerEmail') || '').trim(),
      location: (data.get('location') || '').trim(),
      description: (data.get('description') || '').trim(),
      notes: (data.get('notes') || '').trim()
    };
    const attachmentFile = form.attachment.files[0];

    let valid = true;
    function checkField(name, condition){
      const wrapEl = form.querySelector(`[data-field="${name}"]`);
      if(!wrapEl) return;
      if(!condition){ wrapEl.classList.add('error'); valid = false; }
      else { wrapEl.classList.remove('error'); }
    }
    checkField('customerName', fields.customerName.length > 0);
    checkField('customerWhatsapp', fields.customerWhatsapp.length >= 8);
    if(isLocal) checkField('location', fields.location.length > 0);
    checkField('description', fields.description.length > 0);

    if(!valid){
      evShowToast('Mohon lengkapi data yang wajib diisi.');
      return;
    }

    const order = EraDB.createOrder({
      branchId: branch.id,
      branchName: branch.name,
      serviceId: service.id,
      serviceName: service.name,
      employeeId: employee.id,
      employeeName: employee.name,
      employeeWhatsapp: employee.whatsapp,
      customerName: fields.customerName,
      customerWhatsapp: fields.customerWhatsapp,
      customerEmail: fields.customerEmail,
      location: fields.location,
      description: fields.description,
      attachmentName: attachmentFile ? attachmentFile.name : '',
      notes: fields.notes
    });

    EvOrder.createdOrder = order;
    evGoStep(5);
  });
}

/* ---------- Step 5: Konfirmasi ---------- */
function evRenderStep5(){
  const o = EvOrder.createdOrder;
  const el = document.getElementById('step-container');
  document.getElementById('wizard-title').textContent = 'Pesanan Berhasil Dikirim';

  if(!o){
    el.innerHTML = `<div class="empty-state">Belum ada pesanan yang dibuat pada sesi ini.</div>`;
    return;
  }

  const waMessage = [
    'ORDER BARU — ERA VISUAL',
    '',
    `Nomor Order: ${o.orderNumber}`,
    `Cabang: ${o.branchName}`,
    `Layanan: ${o.serviceName}`,
    `Penanggung Jawab: ${o.employeeName}`,
    `Nama Pelanggan: ${o.customerName}`,
    `WhatsApp: ${o.customerWhatsapp}`,
    o.location ? `Lokasi: ${o.location}` : null,
    `Detail Kebutuhan: ${o.description}`,
    '',
    `Status: ${EV_STATUS_LABEL[o.status]}`
  ].filter(Boolean).join('\n');

  const targetWhatsapp = o.employeeWhatsapp || EraDB.getContact().whatsapp;

  el.innerHTML = `
    <div class="confirm-icon">✓</div>
    <div class="text-center" style="margin-bottom:24px;">
      <h2>Pesanan berhasil dikirim</h2>
      <p>Simpan nomor order ini sebagai referensi.</p>
    </div>
    <div class="summary-box">
      <div class="summary-row"><span class="k">Nomor Order</span><span class="v">${evEscape(o.orderNumber)}</span></div>
      <div class="summary-row"><span class="k">Nama Pelanggan</span><span class="v">${evEscape(o.customerName)}</span></div>
      <div class="summary-row"><span class="k">Cabang</span><span class="v">${evEscape(o.branchName)}</span></div>
      <div class="summary-row"><span class="k">Layanan</span><span class="v">${evEscape(o.serviceName)}</span></div>
      <div class="summary-row"><span class="k">Penanggung Jawab</span><span class="v">${evEscape(o.employeeName)}</span></div>
      <div class="summary-row"><span class="k">Deskripsi</span><span class="v">${evEscape(o.description)}</span></div>
      <div class="summary-row"><span class="k">Waktu Order</span><span class="v">${new Date(o.createdAt).toLocaleString('id-ID')}</span></div>
      <div class="summary-row"><span class="k">Status</span><span class="v"><span class="badge status-${o.status}">${EV_STATUS_LABEL[o.status]}</span></span></div>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <a href="${evWaLink(targetWhatsapp, waMessage)}" target="_blank" rel="noopener" class="btn btn-whatsapp">💬 Kirim Detail ke WhatsApp</a>
      <a href="pesan.html" class="btn btn-ghost">Pesan Lagi</a>
      <a href="index.html" class="btn btn-ghost">Kembali ke Home</a>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', () => {
  const presetService = evGetParam('service');
  const presetBranch = evGetParam('branch');

  if(presetBranch && EraDB.getBranch(presetBranch) && EraDB.getBranch(presetBranch).status === 'active'){
    EvOrder.branchId = presetBranch;
  }
  if(presetService && EraDB.getService(presetService) && EraDB.getService(presetService).status === 'active'){
    EvOrder.serviceId = presetService;
  }

  if(EvOrder.branchId && EvOrder.serviceId) evGoStep(3);
  else if(EvOrder.branchId) evGoStep(2);
  else evGoStep(1);

  // Perbarui daftar karyawan dari Google Sheets (kalau sudah disambungkan).
  // Kalau pelanggan sudah di langkah 3 (Pilih Karyawan) waktu sinkron selesai,
  // tampilkan ulang supaya datanya paling baru.
  EraDB.syncEmployeesFromRemote().then(changed => {
    if(changed && EvOrder.step === 3) evRenderStep3();
  });
});

</script>
