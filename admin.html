<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Era Visual</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui}</style></head><body class="bg-[#0f0f0f] text-white">
<div id="login" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4"><div class="bg-[#1a1a1a] border border-yellow-600/30 p-8 rounded-2xl w-full max-w-sm text-center"><h1 class="text-2xl font-bold mb-1"><span class="text-yellow-500">ERA</span> VISUAL</h1><p class="text-zinc-500 text-sm mb-6">Admin Dashboard</p><input id="keyInput" type="password" placeholder="Masukkan Key" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl outline-none mb-4 text-center"><button id="btnMasuk" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Masuk</button><p id="err" class="text-red-500 text-sm mt-3 hidden">Key salah!</p></div></div>
<div id="main" class="hidden">
<div class="p-4 border-b border-zinc-800 flex justify-between items-center sticky top-0 bg-[#0f0f0f] z-10"><h1 class="font-bold text-sm"><span class="text-yellow-500">ERA</span> VISUAL</h1><div class="flex gap-2"><button onclick="showTab('dashboard')" id="btnTabDash" class="bg-yellow-500 text-black px-4 py-1.5 rounded-full text-[11px] font-bold">DASHBOARD</button><button onclick="showTab('berita')" id="btnTabBerita" class="bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full text-[11px] font-bold">BERITA</button></div></div>

<div id="viewDashboard" class="p-4">
<h1 class="font-bold text-xl mb-2"><span class="text-yellow-500">ERA</span> VISUAL - DASHBOARD</h1>
<div class="grid grid-cols-3 gap-3 mb-4"><div class="bg-zinc-900 p-3 rounded-xl"><p class="text-[10px] text-zinc-500">Total</p><p id="totalOrder" class="text-xl font-bold">0</p></div><div class="bg-yellow-900/30 p-3 rounded-xl"><p class="text-[10px] text-yellow-500">Menunggu</p><p id="countMenunggu" class="text-xl font-bold text-yellow-500">0</p></div><div class="bg-green-900/30 p-3 rounded-xl"><p class="text-[10px] text-green-400">Selesai</p><p id="countSelesai" class="text-xl font-bold text-green-400">0</p></div></div>
<div class="flex gap-2 overflow-x-auto pb-3 mb-3">
<button onclick="filterStatus('semua')" id="fSemua" class="bg-yellow-500 text-black px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap">SEMUA</button>
<button onclick="filterStatus('Menunggu Konfirmasi')" id="fMenunggu" class="bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap">MENUNGGU</button>
<button onclick="filterStatus('Dikonfirmasi')" id="fKonfirmasi" class="bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap">KONFIRMASI</button>
<button onclick="filterStatus('Selesai')" id="fSelesai" class="bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap">SELESAI</button>
<button onclick="filterStatus('Dibatalkan')" id="fBatal" class="bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap">BATAL</button>
</div>
<div class="bg-zinc-900 p-4 rounded-2xl"><div class="flex justify-between mb-3"><h3 class="text-sm">Order Terbaru</h3><button onclick="loadData()" class="text-xs bg-zinc-800 px-2 py-1 rounded">Refresh</button></div><div id="orderBody" class="text-sm space-y-2"></div></div>
</div>

<div id="viewBerita" class="hidden p-4">
<h1 class="font-bold text-xl mb-2">Upload Berita</h1>
<div class="bg-zinc-900 p-5 rounded-2xl border border-yellow-500/20">
<p id="editInfo" class="text-[11px] text-yellow-500 mb-3 hidden">✏️ Mode Edit: <span id="editIdText"></span> <button onclick="batalEdit()" class="text-zinc-400 underline ml-2">Batal Edit</button></p>
<input id="bJudul" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-3 outline-none text-sm" placeholder="Judul">
<textarea id="bIsi" rows="6" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-3 outline-none text-sm" placeholder="Tesk Berita / Isi Berita..."></textarea>
<input id="bFoto" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-4 outline-none text-sm" placeholder="Link Foto https://...">
<button onclick="simpanBerita()" id="btnSimpan" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Simpan Berita</button>
<p id="statusBerita" class="text-xs text-center mt-3 text-zinc-500"></p>
</div>
<div class="bg-zinc-900 p-4 rounded-2xl mt-6"><h3 class="font-bold mb-3 text-sm">Berita Terakhir (Klik untuk Edit)</h3><div id="listBerita" class="text-sm space-y-2">Loading...</div></div>
</div>
</div>

<script>
const ADMIN_KEY='eravisual2023';const SHEET_ID='1pHNzeZAtq_tWVayftkTsd0aS-Ol_mOytKdAQW5vQB6s';const WEB_APP_URL='https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3uG3A/exec';
const loginDiv=document.getElementById('login');const mainDiv=document.getElementById('main');
let allOrders=[];let currentFilter='semua';let editModeId=null;let beritaCache=[];
function doLogin(){const val=document.getElementById('keyInput').value;if(val===ADMIN_KEY){loginDiv.style.display='none';mainDiv.classList.remove('hidden');loadData();}else{document.getElementById('err').classList.remove('hidden');}}
document.getElementById('btnMasuk').addEventListener('click',doLogin);document.getElementById('keyInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function showTab(tab){document.getElementById('viewDashboard').classList.toggle('hidden',tab!=='dashboard');document.getElementById('viewBerita').classList.toggle('hidden',tab!=='berita');document.getElementById('btnTabDash').className=tab==='dashboard'?'bg-yellow-500 text-black px-4 py-1.5 rounded-full text-[11px] font-bold':'bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full text-[11px] font-bold';document.getElementById('btnTabBerita').className=tab==='berita'?'bg-yellow-500 text-black px-4 py-1.5 rounded-full text-[11px] font-bold':'bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full text-[11px] font-bold';if(tab==='berita')loadBeritaList();}
function filterStatus(s){currentFilter=s;document.querySelectorAll('[id^=f]').forEach(b=>b.className='bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap');const map={'semua':'fSemua','Menunggu Konfirmasi':'fMenunggu','Dikonfirmasi':'fKonfirmasi','Selesai':'fSelesai','Dibatalkan':'fBatal'};if(map[s])document.getElementById(map[s]).className='bg-yellow-500 text-black px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap';renderOrders();}
function getStatusColor(s){s=(s||'Menunggu Konfirmasi').toLowerCase();if(s.includes('selesai'))return'bg-green-600 text-white';if(s.includes('dikonfirmasi'))return'bg-blue-600 text-white';if(s.includes('batal'))return'bg-red-600 text-white';return'bg-yellow-600 text-black';}
async function loadData(){try{const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=order`;const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];allOrders=rows.map(r=>({no:r.c[1]?.v||'',nama:r.c[11]?.v||'',cabang:r.c[5]?.v||'',wa:r.c[12]?.v||'',status:r.c[8]?.v||'Menunggu Konfirmasi'})).filter(d=>d.no);document.getElementById('totalOrder').innerText=allOrders.length;document.getElementById('countMenunggu').innerText=allOrders.filter(o=>(o.status||'').toLowerCase().includes('menunggu')).length;document.getElementById('countSelesai').innerText=allOrders.filter(o=>(o.status||'').toLowerCase().includes('selesai')).length;renderOrders();}catch(e){document.getElementById('orderBody').innerText='Gagal load';}}
function renderOrders(){let f=allOrders;if(currentFilter!=='semua')f=allOrders.filter(o=>o.status===currentFilter);document.getElementById('orderBody').innerHTML=f.slice(-30).reverse().map(d=>`<div class="bg-black/40 p-3 rounded-xl"><div class="flex justify-between items-center"><span class="text-yellow-500 font-bold text-xs">${d.no}</span><span class="${getStatusColor(d.status)} px-2 py-0.5 rounded-full text-[9px] font-bold">${d.status}</span></div><div class="flex justify-between items-center mt-2"><div><p class="text-white text-xs font-bold">${d.nama}</p><p class="text-[10px] text-zinc-500">${d.cabang}</p></div><div class="flex gap-1"><select onchange="updateStatus('${d.no}',this.value)" class="bg-zinc-800 text-[10px] px-2 py-1 rounded"><option value="">Ubah Status</option><option value="Menunggu Konfirmasi">Menunggu</option><option value="Dikonfirmasi">Dikonfirmasi</option><option value="Selesai">Selesai</option><option value="Dibatalkan">Dibatalkan</option></select><a href="https://wa.me/${String(d.wa).replace(/[^0-9]/g,'')}" target="_blank" class="bg-green-600 px-2 py-1 rounded text-[10px]">WA</a></div></div></div>`).join('')||'<p class="text-zinc-500 text-xs">Tidak ada data</p>';}
async function updateStatus(no,newStatus){if(!newStatus)return;if(!confirm(`Ubah ${no} jadi ${newStatus}?`))return;await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateStatus',no:no,status:newStatus})});setTimeout(loadData,3000);}
async function loadBeritaList(){try{const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Berita`;const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];beritaCache=rows.map(r=>({id:r.c[0]?.v||'',tgl:r.c[1]?.v||'',judul:r.c[2]?.v||'',teks:r.c[3]?.v||'',foto:r.c[4]?.v||''})).filter(b=>b.id);document.getElementById('listBerita').innerHTML=beritaCache.slice(-10).reverse().map(b=>`<div class="bg-black/60 p-3 rounded-xl flex justify-between items-center"><div onclick="mulaiEdit('${b.id}')" class="flex-1 cursor-pointer"><p class="font-bold text-xs">${b.judul}</p><p class="text-[10px] text-zinc-500 truncate w-48">${b.teks.substring(0,60)}</p><p class="text-[9px] text-zinc-600">${b.tgl}</p></div><div class="flex flex-col gap-1 ml-2"><button onclick="mulaiEdit('${b.id}')" class="bg-yellow-600 text-black text-[9px] px-2 py-1 rounded font-bold">EDIT</button><button onclick="hapusBerita('${b.id}')" class="bg-red-600 text-white text-[9px] px-2 py-1 rounded">HAPUS</button></div></div>`).join('')||'Belum ada berita';}catch(e){document.getElementById('listBerita').innerText='Gagal load';}}
function mulaiEdit(id){const b=beritaCache.find(x=>String(x.id)===String(id));if(!b)return;editModeId=id;document.getElementById('bJudul').value=b.judul;document.getElementById('bIsi').value=b.teks;document.getElementById('bFoto').value=b.foto;document.getElementById('editInfo').classList.remove('hidden');document.getElementById('editIdText').innerText=id;document.getElementById('btnSimpan').innerText='Simpan Ulang Perubahan';document.getElementById('btnSimpan').className='w-full bg-green-500 text-black font-bold p-3 rounded-xl';window.scrollTo(0,0);}
function batalEdit(){editModeId=null;document.getElementById('editInfo').classList.add('hidden');document.getElementById('bJudul').value='';document.getElementById('bIsi').value='';document.getElementById('bFoto').value='';document.getElementById('btnSimpan').innerText='Simpan Berita';document.getElementById('btnSimpan').className='w-full bg-yellow-500 text-black font-bold p-3 rounded-xl';}
async function simpanBerita(){const j=document.getElementById('bJudul').value.trim(),isi=document.getElementById('bIsi').value.trim(),f=document.getElementById('bFoto').value.trim();if(!j||!isi)return alert('Judul & Tesk wajib!');document.getElementById('btnSimpan').innerText='Menyimpan...';if(editModeId){await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'editBerita',id:editModeId,judul:j,teks:isi,foto:f})});}else{await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'tambahBerita',id:'B'+Date.now(),tanggal:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),judul:j,teks:isi,foto:f})});}document.getElementById('statusBerita').innerText='✅ Berhasil!';setTimeout(()=>{batalEdit();loadBeritaList();document.getElementById('statusBerita').innerText='';},2500);}
async function hapusBerita(id){if(!confirm('Hapus berita ini?'))return;await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'hapusBerita',id:id})});setTimeout(loadBeritaList,2000);}
</script></body></html>
