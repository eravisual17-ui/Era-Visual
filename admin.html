<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Era Visual</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0f0f0f] text-white">
<div id="login" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4"><div class="bg-[#1a1a1a] border border-yellow-600/30 p-8 rounded-2xl w-full max-w-sm text-center"><h1 class="text-2xl font-bold"><span class="text-yellow-500">ERA</span> VISUAL</h1><input id="keyInput" type="password" placeholder="Key" class="w-full bg-zinc-800 p-3 rounded-xl mt-6 text-center"><button id="btnMasuk" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl mt-3">Masuk</button></div></div>
<div id="main" class="hidden"><div class="p-4 border-b border-zinc-800 flex justify-between sticky top-0 bg-[#0f0f0f] z-10"><h1 class="font-bold text-sm"><span class="text-yellow-500">ERA</span> VISUAL</h1><div class="flex gap-2"><button onclick="showTab('dashboard')" id="btnTabDash" class="bg-yellow-500 text-black px-4 py-1.5 rounded-full text-[11px] font-bold">DASHBOARD</button><button onclick="showTab('berita')" id="btnTabBerita" class="bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full text-[11px] font-bold">BERITA</button></div></div>
<div id="viewDashboard" class="p-4"><div class="grid grid-cols-3 gap-3 mb-4"><div class="bg-zinc-900 p-3 rounded-xl"><p class="text-[10px] text-zinc-500">Total</p><p id="totalOrder" class="text-xl font-bold">0</p></div><div class="bg-yellow-900/30 p-3 rounded-xl"><p class="text-[10px] text-yellow-500">Menunggu</p><p id="countMenunggu" class="text-xl font-bold text-yellow-500">0</p></div><div class="bg-green-900/30 p-3 rounded-xl"><p class="text-[10px] text-green-400">Selesai</p><p id="countSelesai" class="text-xl font-bold text-green-400">0</p></div></div><div class="flex gap-2 overflow-x-auto pb-3 mb-3"><button onclick="filterStatus('semua')" id="fSemua" class="bg-yellow-500 text-black px-3 py-1 rounded-full text-[10px] font-bold">SEMUA</button><button onclick="filterStatus('Menunggu Konfirmasi')" id="fMenunggu" class="bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold">MENUNGGU</button><button onclick="filterStatus('Dikonfirmasi')" id="fKonfirmasi" class="bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold">KONFIRMASI</button><button onclick="filterStatus('Selesai')" id="fSelesai" class="bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold">SELESAI</button><button onclick="filterStatus('Dibatalkan')" id="fBatal" class="bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full text-[10px] font-bold">BATAL</button></div><div class="bg-zinc-900 p-4 rounded-2xl"><div class="flex justify-between mb-3"><h3 class="text-sm">Order Terbaru</h3><button onclick="loadData()" class="text-xs bg-zinc-800 px-2 py-1 rounded">Refresh</button></div><div id="orderBody" class="space-y-2"></div></div></div>
<div id="viewBerita" class="hidden p-4"><div class="bg-zinc-900 p-5 rounded-2xl border border-yellow-500/20"><p id="editInfo" class="text-[11px] text-yellow-500 mb-3 hidden">✏️ Mode Edit: <span id="editIdText"></span> <button onclick="batalEdit()" class="text-zinc-400 underline ml-2">Batal</button></p><input id="bJudul" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-3 text-sm" placeholder="Judul"><textarea id="bIsi" rows="6" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-3 text-sm" placeholder="Tesk Berita..."></textarea><input id="bFoto" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-4 text-sm" placeholder="Link Foto https://..."><button onclick="simpanBerita()" id="btnSimpan" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Simpan Berita</button></div><div class="bg-zinc-900 p-4 rounded-2xl mt-6"><h3 class="font-bold mb-3 text-sm">Berita Terakhir</h3><div id="listBerita" class="space-y-2">Loading...</div></div></div></div>
<script>
const ADMIN_KEY='eravisual2023';const SHEET_ID='1pHNzeZAtq_tWVayftkTsd0aS-Ol_mOytKdAQW5vQB6s';const WEB_APP_URL='https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3uG3A/exec';
let allOrders=[];let currentFilter='semua';let editModeId=null;let beritaCache=[];let isDeleting=false;
function doLogin(){if(document.getElementById('keyInput').value===ADMIN_KEY){document.getElementById('login').style.display='none';document.getElementById('main').classList.remove('hidden');loadData();loadBeritaList();}}
document.getElementById('btnMasuk').addEventListener('click',doLogin);
function showTab(tab){document.getElementById('viewDashboard').classList.toggle('hidden',tab!=='dashboard');document.getElementById('viewBerita').classList.toggle('hidden',tab!=='berita');if(tab==='berita')loadBeritaList();}
function filterStatus(s){currentFilter=s;renderOrders();}
function getStatusColor(s){s=(s||'').toLowerCase();if(s.includes('selesai'))return'bg-green-600 text-white';if(s.includes('dikonfirmasi'))return'bg-blue-600 text-white';if(s.includes('batal'))return'bg-red-600 text-white';return'bg-yellow-600 text-black';}
async function loadData(){const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=order&t=${Date.now()}`;const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];allOrders=rows.map(r=>({no:r.c[1]?.v||'',nama:r.c[11]?.v||'',cabang:r.c[5]?.v||'',wa:r.c[12]?.v||'',status:r.c[8]?.v||'Menunggu Konfirmasi'})).filter(d=>d.no);document.getElementById('totalOrder').innerText=allOrders.length;document.getElementById('countMenunggu').innerText=allOrders.filter(o=>o.status.includes('Menunggu')).length;document.getElementById('countSelesai').innerText=allOrders.filter(o=>o.status.includes('Selesai')).length;renderOrders();}
function renderOrders(){let f=allOrders;if(currentFilter!=='semua')f=allOrders.filter(o=>o.status===currentFilter);document.getElementById('orderBody').innerHTML=f.slice(-30).reverse().map(d=>`<div class="bg-black/40 p-3 rounded-xl"><div class="flex justify-between"><span class="text-yellow-500 font-bold text-xs">${d.no}</span><span class="${getStatusColor(d.status)} px-2 py-0.5 rounded-full text-[9px] font-bold">${d.status}</span></div><div class="flex justify-between items-center mt-2"><div><p class="text-xs font-bold">${d.nama}</p><p class="text-[10px] text-zinc-500">${d.cabang}</p></div><div class="flex gap-1"><select onchange="updateStatus('${d.no}',this.value)" class="bg-zinc-800 text-[10px] px-2 py-1 rounded"><option>Ubah</option><option value="Menunggu Konfirmasi">Menunggu</option><option value="Dikonfirmasi">Konfirmasi</option><option value="Selesai">Selesai</option><option value="Dibatalkan">Batal</option></select><a href="https://wa.me/${String(d.wa).replace(/[^0-9]/g,'')}" target="_blank" class="bg-green-600 px-2 py-1 rounded text-[10px]">WA</a></div></div></div>`).join('');}
async function updateStatus(no,st){if(!st||st==='Ubah')return;fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateStatus',no:no,status:st})});}
async function loadBeritaList(){try{const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Berita&t=${Date.now()}`;const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];beritaCache=rows.map(r=>({id:String(r.c[0]?.v||''),tgl:String(r.c[1]?.f||r.c[1]?.v||''),judul:String(r.c[2]?.v||''),teks:String(r.c[3]?.v||''),foto:String(r.c[4]?.v||'')})).filter(b=>b.id);document.getElementById('listBerita').innerHTML=beritaCache.slice(-10).reverse().map(b=>`<div id="row-${b.id}" class="bg-black/60 p-3 rounded-xl flex justify-between items-center"><div onclick="mulaiEdit('${b.id}')" class="flex-1 cursor-pointer"><p class="font-bold text-xs">${b.judul}</p><p class="text-[10px] text-zinc-500 truncate">${b.teks.substring(0,50)}</p></div><div class="flex gap-1 ml-2"><button onclick="mulaiEdit('${b.id}')" class="bg-yellow-600 text-black text-[10px] px-3 py-1.5 rounded font-bold">EDIT</button><button onclick="hapusBerita('${b.id}')" class="bg-red-600 text-white text-[10px] px-3 py-1.5 rounded font-bold">HAPUS</button></div></div>`).join('')||'Belum ada berita';}catch(e){document.getElementById('listBerita').innerText='Gagal load';}}
function mulaiEdit(id){const b=beritaCache.find(x=>x.id===id);if(!b)return;editModeId=id;document.getElementById('bJudul').value=b.judul;document.getElementById('bIsi').value=b.teks;document.getElementById('bFoto').value=b.foto;document.getElementById('editInfo').classList.remove('hidden');document.getElementById('editIdText').innerText=id;document.getElementById('btnSimpan').innerText='Simpan Ulang';document.getElementById('btnSimpan').className='w-full bg-green-500 text-black font-bold p-3 rounded-xl';}
function batalEdit(){editModeId=null;document.getElementById('editInfo').classList.add('hidden');document.getElementById('bJudul').value='';document.getElementById('bIsi').value='';document.getElementById('bFoto').value='';document.getElementById('btnSimpan').innerText='Simpan Berita';document.getElementById('btnSimpan').className='w-full bg-yellow-500 text-black font-bold p-3 rounded-xl';}
async function simpanBerita(){const j=document.getElementById('bJudul').value.trim(),isi=document.getElementById('bIsi').value.trim(),f=document.getElementById('bFoto').value.trim();if(!j||!isi)return alert('Wajib isi!');document.getElementById('btnSimpan').innerText='Menyimpan...';if(editModeId){fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'editBerita',id:editModeId,judul:j,teks:isi,foto:f})});}else{fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'tambahBerita',id:'B'+Date.now(),tanggal:new Date().toLocaleDateString('id-ID'),judul:j,teks:isi,foto:f})});}setTimeout(()=>{batalEdit();loadBeritaList();},1000);}
async function hapusBerita(id){
if(isDeleting) return alert('Tunggu hapus sebelumnya selesai dulu bro!');
if(!confirm('Yakin hapus berita ini?')) return;
isDeleting=true;
const el=document.getElementById('row-'+id);
if(el) el.innerHTML='<p class="text-xs text-red-400 p-2">Menghapus '+id+'...</p>';
beritaCache=beritaCache.filter(x=>x.id!==id);
try{await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'hapusBerita',id:id})});}catch(e){}
setTimeout(()=>{isDeleting=false; loadBeritaList();},2000);
}
</script></body></html>
