<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Era Visual</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-white">
<div id="login" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4">
<div class="bg-[#1a1a1a] border border-yellow-600/30 p-8 rounded-2xl w-full max-w-sm text-center">
<h1 class="text-2xl font-bold"><span class="text-yellow-500">ERA</span> VISUAL</h1>
<input id="keyInput" type="password" placeholder="Key" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl mt-6 text-center outline-none">
<button id="btnMasuk" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl mt-3">Masuk</button>
</div>
</div>
<div id="main" class="hidden">
<div class="p-4 border-b border-zinc-800 flex justify-between sticky top-0 bg-[#0f0f0f] z-10">
<h1 class="font-bold text-sm"><span class="text-yellow-500">ERA</span> VISUAL</h1>
<div class="flex gap-2">
<button onclick="showTab('dashboard')" id="btnTabDash" class="bg-yellow-500 text-black px-4 py-1.5 rounded-full text-[11px] font-bold">DASHBOARD</button>
<button onclick="showTab('berita')" id="btnTabBerita" class="bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full text-[11px] font-bold">BERITA</button>
</div>
</div>
<div id="viewDashboard" class="p-4">
<div class="grid grid-cols-3 gap-2 mb-4">
<div class="bg-zinc-900 p-3 rounded-xl"><p class="text-[10px] text-zinc-500">TOTAL</p><p id="totalOrder" class="font-bold">0</p></div>
<div class="bg-zinc-900 p-3 rounded-xl"><p class="text-[10px] text-yellow-500">MENUNGGU</p><p id="countMenunggu" class="font-bold text-yellow-500">0</p></div>
<div class="bg-zinc-900 p-3 rounded-xl"><p class="text-[10px] text-green-400">SELESAI</p><p id="countSelesai" class="font-bold text-green-400">0</p></div>
</div>
<div class="flex gap-2 overflow-x-auto pb-3">
<button onclick="filterStatus('semua')" class="bg-yellow-500 text-black px-3 py-1 rounded-full text-[10px] font-bold">SEMUA</button>
<button onclick="filterStatus('Menunggu Konfirmasi')" class="bg-zinc-800 px-3 py-1 rounded-full text-[10px]">MENUNGGU</button>
<button onclick="filterStatus('Dikonfirmasi')" class="bg-zinc-800 px-3 py-1 rounded-full text-[10px]">KONFIRMASI</button>
<button onclick="filterStatus('Selesai')" class="bg-zinc-800 px-3 py-1 rounded-full text-[10px]">SELESAI</button>
<button onclick="filterStatus('Dibatalkan')" class="bg-zinc-800 px-3 py-1 rounded-full text-[10px]">BATAL</button>
</div>
<div class="bg-zinc-900 p-4 rounded-2xl mt-2"><div id="orderBody" class="space-y-2"></div></div>
</div>
<div id="viewBerita" class="hidden p-4">
<h1 class="font-bold mb-4">Upload Berita</h1>
<div class="bg-zinc-900 p-4 rounded-2xl border border-yellow-500/20">
<input id="bJudul" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-3 text-sm outline-none" placeholder="Judul">
<textarea id="bIsi" rows="6" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-3 text-sm outline-none" placeholder="Tesk Berita / Isi Berita..."></textarea>
<input id="bFoto" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-4 text-sm outline-none" placeholder="Link Foto https://...">
<button onclick="simpanBerita()" id="btnSimpan" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Simpan Berita</button>
<p id="statusBerita" class="text-xs text-center mt-2 text-zinc-500"></p>
</div>
<div class="bg-zinc-900 p-4 rounded-2xl mt-4"><h3 class="text-sm font-bold mb-2">Berita Terakhir</h3><div id="listBerita" class="text-sm"></div></div>
</div>
</div>
<script>
const ADMIN_KEY='eravisual2023';const SHEET_ID='1pHNzeZAtq_tWVayftkTsd0aS-Ol_mOytKdAQW5vQB6s';const WEB_APP_URL='https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3uG3A/exec';
let allOrders=[];let currentFilter='semua';
function doLogin(){if(document.getElementById('keyInput').value===ADMIN_KEY){document.getElementById('login').style.display='none';document.getElementById('main').classList.remove('hidden');loadData();}}
document.getElementById('btnMasuk').addEventListener('click',doLogin);
document.getElementById('keyInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function showTab(t){document.getElementById('viewDashboard').classList.toggle('hidden',t!=='dashboard');document.getElementById('viewBerita').classList.toggle('hidden',t!=='berita');if(t==='berita')loadBeritaList();}
function filterStatus(s){currentFilter=s;renderOrders();}
function getColor(s){s=(s||'').toLowerCase();if(s.includes('selesai'))return'bg-green-600 text-white';if(s.includes('dikonfirmasi'))return'bg-blue-600 text-white';if(s.includes('batal'))return'bg-red-600 text-white';return'bg-yellow-600 text-black';}
async function loadData(){const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=order`;const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];allOrders=rows.map(r=>({no:r.c[1]?.v||'',nama:r.c[11]?.v||'',cabang:r.c[5]?.v||'',wa:r.c[12]?.v||'',status:r.c[8]?.v||'Menunggu Konfirmasi'})).filter(d=>d.no);document.getElementById('totalOrder').innerText=allOrders.length;document.getElementById('countMenunggu').innerText=allOrders.filter(o=>o.status.includes('Menunggu')).length;document.getElementById('countSelesai').innerText=allOrders.filter(o=>o.status.includes('Selesai')).length;renderOrders();}
function renderOrders(){let f=allOrders;if(currentFilter!=='semua')f=allOrders.filter(o=>o.status===currentFilter);document.getElementById('orderBody').innerHTML=f.slice(-30).reverse().map(d=>`<div class="bg-black/40 p-3 rounded-xl"><div class="flex justify-between"><span class="text-yellow-500 text-xs font-bold">${d.no}</span><span class="${getColor(d.status)} text-[9px] px-2 py-0.5 rounded-full font-bold">${d.status}</span></div><div class="flex justify-between items-center mt-2"><div><p class="text-xs font-bold">${d.nama}</p><p class="text-[10px] text-zinc-500">${d.cabang}</p></div><div class="flex gap-1"><select onchange="updateStatus('${d.no}',this.value)" class="bg-zinc-800 text-[10px] px-2 py-1 rounded"><option>Ubah</option><option value="Menunggu Konfirmasi">Menunggu</option><option value="Dikonfirmasi">Konfirmasi</option><option value="Selesai">Selesai</option><option value="Dibatalkan">Batal</option></select><a href="https://wa.me/${String(d.wa).replace(/[^0-9]/g,'')}" target="_blank" class="bg-green-600 px-2 py-1 rounded text-[10px]">WA</a></div></div></div>`).join('');}
async function updateStatus(no,st){if(!st||st==='Ubah')return;if(!confirm('Ubah '+no+' jadi '+st+'?'))return;await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateStatus',no:no,status:st})});setTimeout(loadData,3000);}
async function loadBeritaList(){try{const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Berita`;const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];document.getElementById('listBerita').innerHTML=rows.slice(-10).reverse().map(r=>`<div class="bg-black/40 p-2 rounded text-xs mb-2"><b>${r.c[2]?.v||''}</b><p class="text-[10px] text-zinc-400 line-clamp-2">${r.c[3]?.v||''}</p></div>`).join('');}catch(e){document.getElementById('listBerita').innerText='Belum ada';}}
async function simpanBerita(){
const j=document.getElementById('bJudul').value.trim();
const isi=document.getElementById('bIsi').value.trim();
const f=document.getElementById('bFoto').value.trim();
if(!j||!isi){alert('Judul & Tesk wajib!');return;}
document.getElementById('btnSimpan').innerText='Menyimpan...';
await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'tambahBerita',id:'B'+Date.now(),tanggal:new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),judul:j,teks:isi,foto:f})});
document.getElementById('bJudul').value='';document.getElementById('bIsi').value='';document.getElementById('bFoto').value='';
document.getElementById('btnSimpan').innerText='Simpan Berita';
document.getElementById('statusBerita').innerText='✅ Berhasil! Cek Sheet Berita';
setTimeout(loadBeritaList,2500);
}
</script>
</body>
  </html>
