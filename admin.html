<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Era Visual</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:Poppins}</style></head><body class="bg-[#eef6ff]">
<div id="login" class="fixed inset-0 bg-[#0a192f]/80 backdrop-blur z-50 flex items-center justify-center p-4"><div class="bg-white p-8 rounded-[24px] w-full max-w-sm text-center shadow-2xl"><div class="w-16 h-16 border rounded-2xl p-1 mx-auto"><img src="logo.jpg" class="w-full h-full object-contain"></div><h1 class="text-xl font-bold mt-3 text-[#0a7bf2]">ERA VISUAL ADMIN</h1><input id="keyInput" type="password" placeholder="Key: eravisual2023" class="w-full bg-[#f6faff] border p-3.5 rounded-xl mt-6 text-center text-sm"><button id="btnMasuk" class="w-full bg-[#0a7bf2] text-white font-bold p-3.5 rounded-xl mt-3">Masuk</button></div></div>

<div id="main" class="hidden">
<div class="bg-white border-b sticky top-0 z-20"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center"><p class="font-bold text-sm">Era Visual • Admin Omzet</p><button onclick="loadData()" class="bg-[#eef6ff] text-[#0a7bf2] px-4 py-2 rounded-full text-[11px] font-bold">🔄 Refresh</button></div></div>

<div class="max-w-6xl mx-auto p-4">
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
<div class="bg-white p-4 rounded-2xl border"><p class="text-[10px] text-gray-400 font-bold">TOTAL ORDER</p><p id="totalOrder" class="text-xl font-bold">0</p></div>
<div class="bg-white p-4 rounded-2xl border"><p class="text-[10px] text-gray-400 font-bold">MENUNGGU</p><p id="countMenunggu" class="text-xl font-bold text-yellow-600">0</p></div>
<div class="bg-[#0a7bf2] p-4 rounded-2xl text-white"><p class="text-[10px] text-blue-100 font-bold">OMZET SELESAI</p><p id="omzetTotal" class="text-xl font-bold">Rp 0</p><p id="omzetCount" class="text-[10px]">0 order</p></div>
<div class="bg-[#12223d] p-4 rounded-2xl text-white"><p class="text-[10px] text-blue-200 font-bold">TOTAL TIP</p><p id="tipTotal" class="text-xl font-bold">Rp 0</p></div>
</div>

<div class="flex gap-2 overflow-x-auto pb-2 mb-3">
<button onclick="filterStatus('semua')" id="fSemua" class="bg-[#0a7bf2] text-white px-4 py-2 rounded-full text-[10px] font-bold">SEMUA</button>
<button onclick="filterStatus('Menunggu')" id="fMenunggu" class="bg-white border px-4 py-2 rounded-full text-[10px] font-bold">MENUNGGU</button>
<button onclick="filterStatus('Selesai')" id="fSelesai" class="bg-white border px-4 py-2 rounded-full text-[10px] font-bold">SELESAI</button>
</div>

<div id="orderBody" class="space-y-3">Loading...</div>
</div>
</div>

<script>
const ADMIN_KEY='eravisual2023';
const SHEET_ID='1pHNzeZAtq_tWVayftkTsd0aS-Ol_mOytKdAQW5vQB6s';
// GANTI NAMA SHEET JIKA BEDA, lihat di bawah sheet di Google Sheet lu
const SHEET_NAME=''; // kosong = sheet pertama (yang di screenshot)
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3u3G3A/exec';
let allOrders=[];let currentFilter='semua';
function doLogin(){if(document.getElementById('keyInput').value===ADMIN_KEY){document.getElementById('login').style.display='none';document.getElementById('main').classList.remove('hidden');loadData();}else alert('Key salah');}
document.getElementById('btnMasuk').addEventListener('click',doLogin);
function formatRp(n){return 'Rp '+(Number(n||0)).toLocaleString('id-ID');}
function filterStatus(s){currentFilter=s;renderOrders();}

async function loadData(){
let url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&t=${Date.now()}`;
if(SHEET_NAME) url+=`&sheet=${SHEET_NAME}`;
const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];
// Sesuai screenshot: C=2 Nama, D=3 Layanan, E=4 Cabang, F=5 Detail, G=6 WA, H=7 Timestamp, I=8 Status, J=9 harga, K=10 tip, L=11 omzet
allOrders=rows.slice(1).map((r,idx)=>({
  rowNumber: idx+3, // baris asli di sheet (karena ada 2 header)
  nama: r.c[2]?.v||'',
  layanan: r.c[3]?.v||'',
  cabang: r.c[4]?.v||'',
  detail: r.c[5]?.v||'',
  wa: r.c[6]?.v||'',
  timestamp: r.c[7]?.v||'',
  status: r.c[8]?.v||'Menunggu',
  harga: Number(r.c[9]?.v||0),
  tip: Number(r.c[10]?.v||0),
  omzet: Number(r.c[11]?.v||0),
})).filter(d=>d.nama);

document.getElementById('totalOrder').innerText=allOrders.length;
document.getElementById('countMenunggu').innerText=allOrders.filter(o=>String(o.status).toLowerCase().includes('menunggu')).length;
let selesai=allOrders.filter(o=>String(o.status).toLowerCase().includes('selesai'));
let sumOmzet=selesai.reduce((a,b)=>a+(b.omzet||b.harga+b.tip),0);
let sumTip=selesai.reduce((a,b)=>a+(b.tip||0),0);
document.getElementById('omzetTotal').innerText=formatRp(sumOmzet);
document.getElementById('omzetCount').innerText=selesai.length+' order selesai';
document.getElementById('tipTotal').innerText=formatRp(sumTip);
renderOrders();
}

function renderOrders(){
let f=allOrders;if(currentFilter!=='semua')f=allOrders.filter(o=>String(o.status).toLowerCase().includes(currentFilter.toLowerCase()));
document.getElementById('orderBody').innerHTML=f.slice(-50).reverse().map(d=>`
<div class="bg-white p-4 rounded-2xl border">
<div class="flex justify-between"><p class="font-bold text-[13px]">${d.nama} <span class="text-[11px] text-gray-400 font-normal">• ${d.layanan}</span></p><span class="text-[10px] bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full font-bold">${d.status||'-'}</span></div>
<p class="text-[11px] text-gray-500 mt-1">${d.cabang} • ${d.detail} • WA: ${d.wa}</p>
<div class="grid grid-cols-3 gap-2 mt-3 bg-[#f6faff] p-3 rounded-xl border">
<div><label class="text-[9px] font-bold text-gray-400">J HARGA</label><input id="harga-${d.rowNumber}" type="number" value="${d.harga||''}" placeholder="0" class="w-full bg-white border rounded-lg p-2 text-[12px] mt-1"></div>
<div><label class="text-[9px] font-bold text-gray-400">K TIP</label><input id="tip-${d.rowNumber}" type="number" value="${d.tip||''}" placeholder="0" class="w-full bg-white border rounded-lg p-2 text-[12px] mt-1"></div>
<div><label class="text-[9px] font-bold text-gray-400">L OMZET</label><div class="bg-[#0a7bf2] text-white rounded-lg p-2 text-[12px] mt-1 font-bold text-center">${formatRp(d.omzet||d.harga+d.tip)}</div></div>
</div>
<div class="flex gap-2 mt-3">
<select onchange="updateStatus(${d.rowNumber},this.value)" class="flex-1 bg-white border text-[11px] p-2.5 rounded-full font-bold"><option>Ubah Status</option><option value="Menunggu">Menunggu</option><option value="Selesai">Selesai</option><option value="Batal">Batal</option></select>
<button onclick="simpanOmzet(${d.rowNumber})" class="flex-1 bg-[#12223d] text-white text-[11px] p-2.5 rounded-full font-bold">💾 Simpan JKL</button>
<a href="https://wa.me/${String(d.wa).replace(/[^0-9]/g,'')}" target="_blank" class="bg-[#25D366] text-white px-4 py-2.5 rounded-full text-[11px] font-bold">WA</a>
</div>
</div>`).join('');
}

function updateStatus(row,status){if(status.includes('Ubah'))return;fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateStatus',row:row,status:status})}); setTimeout(loadData,1000);}
function simpanOmzet(row){
let h=Number(document.getElementById('harga-'+row).value||0);
let t=Number(document.getElementById('tip-'+row).value||0);
let tot=h+t;
if(h==0){alert('Isi harga J dulu ka!');return;}
fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateOmzet',row:row,harga:h,tip:t,omzet:tot})});
alert('Disimpan: Harga '+formatRp(h)+' + Tip '+formatRp(t)+' = '+formatRp(tot));
setTimeout(loadData,1000);
}
</script></body></html>
