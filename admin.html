<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Era Visual</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0f0f0f] text-white">
<div id="login" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4"><div class="bg-[#1a1a1a] p-8 rounded-2xl w-full max-w-sm text-center"><h1 class="text-2xl font-bold"><span class="text-yellow-500">ERA</span> VISUAL</h1><input id="keyInput" type="password" placeholder="Key" class="w-full bg-zinc-800 p-3 rounded-xl mt-6 text-center"><button id="btnMasuk" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl mt-3">Masuk</button></div></div>
<div id="main" class="hidden"><div class="p-4 border-b border-zinc-800 flex justify-between sticky top-0 bg-[#0f0f0f]"><h1 class="font-bold text-sm">ERA VISUAL</h1><div class="flex gap-2"><button onclick="showTab('dashboard')" class="bg-yellow-500 text-black px-3 py-1.5 rounded-full text-[11px] font-bold">DASHBOARD</button><button onclick="showTab('berita')" class="bg-zinc-800 px-3 py-1.5 rounded-full text-[11px]">BERITA</button></div></div>
<div id="viewDashboard" class="p-4"><div id="orderBody" class="space-y-2"></div></div>
<div id="viewBerita" class="hidden p-4">
<div class="bg-zinc-900 p-4 rounded-2xl border border-yellow-500/20">
<p id="editInfo" class="text-[11px] text-yellow-500 mb-2 hidden">✏️ Mode Edit: <span id="editId"></span> <button onclick="batalEdit()" class="text-zinc-400 underline ml-2">Batal</button></p>
<input id="bJudul" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-3 text-sm" placeholder="Judul">
<textarea id="bIsi" rows="6" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-3 text-sm" placeholder="Tesk Berita / Isi Berita..."></textarea>
<input id="bFoto" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mb-4 text-sm" placeholder="Link Foto https://...">
<button onclick="simpanBerita()" id="btnSimpan" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Simpan Berita</button>
<p id="statusBerita" class="text-xs text-center mt-2"></p>
</div>
<div class="bg-zinc-900 p-4 rounded-2xl mt-4"><h3 class="font-bold text-sm mb-2">Berita Terakhir (Klik untuk Edit)</h3><div id="listBerita"></div></div>
</div></div>
<script>
const ADMIN_KEY='eravisual2023';const SHEET_ID='1pHNzeZAtq_tWVayftkTsd0aS-Ol_mOytKdAQW5vQB6s';const WEB_APP_URL='https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3uG3A/exec';
let allOrders=[];let editModeId=null;let beritaCache=[];
function doLogin(){if(document.getElementById('keyInput').value===ADMIN_KEY){document.getElementById('login').style.display='none';document.getElementById('main').classList.remove('hidden');loadData();loadBeritaList();}}
document.getElementById('btnMasuk').addEventListener('click',doLogin);
function showTab(t){document.getElementById('viewDashboard').classList.toggle('hidden',t!=='dashboard');document.getElementById('viewBerita').classList.toggle('hidden',t!=='berita');}
async function loadData(){const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=order`;const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];allOrders=rows.map(r=>({no:r.c[1]?.v||'',nama:r.c[11]?.v||'',cabang:r.c[5]?.v||'',wa:r.c[12]?.v||'',status:r.c[8]?.v||'Menunggu Konfirmasi'})).filter(d=>d.no);document.getElementById('orderBody').innerHTML=allOrders.slice(-20).reverse().map(d=>`<div class="bg-black/40 p-3 rounded-xl flex justify-between"><span>${d.no} - ${d.nama}</span><span class="text-[10px]">${d.status}</span></div>`).join('');}
async function loadBeritaList(){
const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Berita`;const res=await fetch(url);const txt=await res.text();const json=JSON.parse(txt.substr(47).slice(0,-2));const rows=json.table.rows||[];
beritaCache=rows.map(r=>({id:r.c[0]?.v||'',tgl:r.c[1]?.v||'',judul:r.c[2]?.v||'',teks:r.c[3]?.v||'',foto:r.c[4]?.v||''})).filter(b=>b.id);
document.getElementById('listBerita').innerHTML=beritaCache.slice(-10).reverse().map(b=>`<div onclick="mulaiEdit('${b.id}')" class="bg-black/60 p-3 rounded-xl mb-2 flex justify-between items-center cursor-pointer hover:bg-zinc-800"><div><p class="font-bold text-xs">${b.judul}</p><p class="text-[10px] text-zinc-500 truncate w-48">${b.teks.substring(0,60)}</p><p class="text-[9px] text-zinc-600">${b.tgl}</p></div><div class="flex flex-col gap-1"><span class="bg-yellow-600 text-black text-[9px] px-2 py-1 rounded">EDIT</span><button onclick="event.stopPropagation();hapusBerita('${b.id}')" class="bg-red-600 text-white text-[9px] px-2 py-1 rounded">HAPUS</button></div></div>`).join('');
}
function mulaiEdit(id){
const b=beritaCache.find(x=>String(x.id)===String(id)); if(!b)return;
editModeId=id; document.getElementById('bJudul').value=b.judul; document.getElementById('bIsi').value=b.teks; document.getElementById('bFoto').value=b.foto;
document.getElementById('editInfo').classList.remove('hidden'); document.getElementById('editId').innerText=id;
document.getElementById('btnSimpan').innerText='Simpan Ulang Perubahan'; document.getElementById('btnSimpan').className='w-full bg-green-500 text-black font-bold p-3 rounded-xl';
window.scrollTo(0,0);
}
function batalEdit(){editModeId=null;document.getElementById('editInfo').classList.add('hidden');document.getElementById('bJudul').value='';document.getElementById('bIsi').value='';document.getElementById('bFoto').value='';document.getElementById('btnSimpan').innerText='Simpan Berita';document.getElementById('btnSimpan').className='w-full bg-yellow-500 text-black font-bold p-3 rounded-xl';}
async function simpanBerita(){
const j=document.getElementById('bJudul').value.trim(), isi=document.getElementById('bIsi').value.trim(), f=document.getElementById('bFoto').value.trim();
if(!j||!isi)return alert('Lengkapi Judul & Tesk!');
document.getElementById('btnSimpan').innerText='Menyimpan...';
if(editModeId){
await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'editBerita',id:editModeId,judul:j,teks:isi,foto:f})});
}else{
await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'tambahBerita',id:'B'+Date.now(),tanggal:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),judul:j,teks:isi,foto:f})});
}
document.getElementById('statusBerita').innerText='✅ Berhasil disimpan!';
setTimeout(()=>{batalEdit();loadBeritaList();document.getElementById('statusBerita').innerText='';},2500);
}
async function hapusBerita(id){if(!confirm('Hapus berita ini?'))return;await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'hapusBerita',id:id})}); setTimeout(loadBeritaList,2000);}
</script></body></html>
