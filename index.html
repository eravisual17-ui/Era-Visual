<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Era Visual - Ende</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet"><style>body{font-family:Poppins}.clock-font{font-family:'JetBrains Mono',monospace;letter-spacing:1px;font-variant-numeric:tabular-nums;font-weight:700;} .sidebar{width:260px;transition:0.28s ease;} .sidebar.collapsed{width:72px;} .collapsed .hide-collapsed{display:none!important;} .tooltip{position:absolute;left:78px;background:#0a7bf2;color:white;padding:6px 12px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:0.2s;}.collapsed .nav-item:hover .tooltip{opacity:1;} @media(max-width:768px){#mainContent{margin-left:0!important;width:100%!important;} #sidebar{position:fixed!important;left:0;top:0;height:100vh;transform:translateX(-100%);z-index:50;} #sidebar.mobile-open{transform:translateX(0);} }</style></head><body class="bg-[#eef6ff]">

<div id="overlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-transparent z-40"></div>

<div id="sidebar" class="sidebar bg-white border-r border-blue-100 h-screen flex flex-col justify-between fixed left-0 top-0 z-50">
<div>
<div class="p-3 flex items-center justify-between">
<div class="flex items-center gap-2"><div class="w-8 h-8 bg-white border rounded-lg p-1 overflow-hidden"><img src="logo.jpg" class="w-full h-full object-contain"></div><div class="hide-collapsed"><p class="font-bold text-[14px] leading-none">Era Visual</p><p class="text-[10px] text-gray-400">Ende</p></div></div>
<button onclick="toggleSidebar()" id="btnToggle" class="bg-[#0a7bf2] w-10 h-10 rounded-xl flex items-center justify-center text-white text-[18px] font-bold shadow-md">«</button>
</div>

<div class="px-3 py-2"><div class="hide-collapsed bg-[#0a7bf2] rounded-full flex items-center gap-2 px-3 py-2 text-white"><span>🔍</span><input placeholder="Search..." class="bg-transparent outline-none text-[12px] placeholder-blue-200 w-full"></div></div>

<div class="px-2 mt-2 space-y-2">
<p class="hide-collapsed text-[10px] text-gray-400 px-3 mb-1">MAIN</p>
<a href="index.html" class="nav-item relative flex items-center gap-3 px-3 py-3 rounded-xl bg-[#0a7bf2] text-white text-sm shadow"><span>🏠</span><span class="hide-collapsed font-bold">Home</span><span class="tooltip">Home</span></a>
<a href="admin.html" class="nav-item relative flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-blue-50 text-gray-600 text-sm"><span>👑</span><span class="hide-collapsed font-semibold">Admin</span><span class="tooltip">Admin</span></a>
</div>
</div>
<div class="p-3 border-t flex items-center gap-2"><div class="w-8 h-8 bg-black rounded-full flex items-center justify-center text-white font-bold text-xs">EV</div><div class="hide-collapsed"><p class="text-[12px] font-bold leading-none">Ewaldus Sangga</p><p class="text-[10px] text-gray-400">Owner</p></div></div>
</div>

<div id="mainContent" class="flex-1 ml-[260px] w-[calc(100%-260px)] transition-all">
<button onclick="toggleSidebar()" id="mobileOpenBtn" class="md:hidden fixed top-3 left-3 z-30 bg-[#0a7bf2] w-10 h-10 rounded-xl flex items-center justify-center text-white text-[18px] font-bold shadow-lg">»</button>
<div class="max-w-2xl mx-auto p-6 pt-14 md:pt-6 text-center">
<div class="flex justify-center mb-4"><div class="w-28 h-28 bg-white p-2 rounded-3xl shadow border border-blue-100 flex items-center justify-center overflow-hidden"><img src="logo.jpg" class="w-full h-full object-contain"></div></div>
<h1 class="text-4xl font-bold text-[#0a7bf2] tracking-widest">ERA VISUAL</h1>
<p class="text-[#5b7aa5] mt-2 text-sm font-semibold">Cabang Ende - Owner Ewaldus Sangga</p>
<p class="text-[#334b6e] mt-6 text-sm leading-6 bg-white p-4 rounded-2xl border border-blue-100 shadow-sm">Jasa <span class="font-bold text-[#0a7bf2]">Electrical, Editor, Mechanical</span></p>
<div class="mt-7"><p class="text-[#0a7bf2] font-bold text-[11px] tracking-[0.25em] mb-3">JAM LIVE OPERASIONAL</p>
<div class="grid grid-cols-3 gap-2"><div class="bg-[#12223d] rounded-[16px] p-3"><p class="text-[9px] text-[#6ea8ff] font-bold">WIB</p><p id="clock-wib" class="clock-font text-white text-[14px] mt-1">00:00:00</p></div><div class="bg-[#0a7bf2] rounded-[16px] p-3 scale-[1.05] shadow"><p class="text-[9px] text-white font-bold">WITA • ENDE</p><p id="clock-wita" class="clock-font text-white text-[15px] mt-1">00:00:00</p></div><div class="bg-[#12223d] rounded-[16px] p-3"><p class="text-[9px] text-[#6ea8ff] font-bold">WIT</p><p id="clock-wit" class="clock-font text-white text-[14px] mt-1">00:00:00</p></div></div></div>
<div class="bg-white p-6 rounded-[24px] mt-6 border shadow"><a href="pesan.html" class="block w-full bg-[#0a7bf2] text-white p-4 rounded-xl font-bold text-center">Pesan Sekarang</a></div>
</div>
</div>
</div>

<script>
let collapsed=false;
function toggleSidebar(){
const sb=document.getElementById('sidebar');const main=document.getElementById('mainContent');const btn=document.getElementById('btnToggle');const overlay=document.getElementById('overlay');const mBtn=document.getElementById('mobileOpenBtn');const isMobile=window.innerWidth<=768;
if(isMobile){sb.classList.toggle('mobile-open');const open=sb.classList.contains('mobile-open');overlay.classList.toggle('hidden',!open);mBtn.style.display=open?'none':'flex';return;}
collapsed=!collapsed;sb.classList.toggle('collapsed');if(collapsed){main.style.marginLeft='72px';main.style.width='calc(100% - 72px)';btn.textContent='»';}else{main.style.marginLeft='260px';main.style.width='calc(100% - 260px)';btn.textContent='«';}
}
function updateClock(){let n=new Date();function g(o){let u=n.getTime()+(n.getTimezoneOffset()*60000);let d=new Date(u+(3600000*o));return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');} document.getElementById('clock-wib').textContent=g(7);document.getElementById('clock-wita').textContent=g(8);document.getElementById('clock-wit').textContent=g(9);} setInterval(updateClock,1000);updateClock();
</script></body></html>
