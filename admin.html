<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Era Visual - Fix Final</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:Poppins;background:#eef6ff}</style></head><body>
<div id="login" class="fixed inset-0 bg-[#0a192f] z-50 flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm p-8 rounded-[28px] text-center"><div class="w-12 h-12 bg-[#0a7bf2] rounded-2xl mx-auto flex items-center justify-center text-white font-bold">EV</div><h1 class="font-bold mt-3">FIX FINAL</h1><p class="text-[11px] text-gray-400">ord- & EV- support</p><input id="keyInput" type="password" placeholder="eravisual2023 / admin" class="w-full bg-[#f6faff] border p-3 rounded-xl mt-5 text-center"><button onclick="doLogin()" class="w-full bg-[#0a7bf2] text-white font-bold p-3 rounded-xl mt-3">Masuk</button></div></div>
<div id="app" class="hidden"><div class="bg-white border-b sticky top-0 z-10"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between"><p class="font-bold text-sm">Era Visual - Fix Final</p><button onclick="loadData()" class="bg-[#eef6ff] text-[#0a7bf2] px-4 py-2 rounded-full text-[11px] font-bold">🔄 Refresh</button></div></div>
<div class="max-w-6xl mx-auto p-4">
<div class="grid grid-cols-3 gap-3 mb-4"><div class="bg-white p-4 rounded-2xl border"><p class="text-[10px] text-gray-400 font-bold">TOTAL</p><p id="total" class="text-2xl font-bold">0</p></div><div class="bg-white p-4 rounded-2xl border"><p class="text-[10px] text-gray-400 font-bold">MENUNGGU</p><p id="menunggu" class="text-2xl font-bold text-yellow-600">0</p></div><div class="bg-white p-4 rounded-2xl border"><p class="text-[10px] text-gray-400 font-bold">SELESAI</p><p id="selesai" class="text-2xl font-bold text-green-600">0</p></div></div>
<div id="list" class="space-y-3">Loading...</div>
</div></div>
<script>
const SHEET_ID='1pHNzeZAtq_tWVayftkTsd0aS-Ol_mOytKdAQW5vQB6s';
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3u3G3A/exec';
let allData=[];
function doLogin(){let v=document.getElementById('keyInput').value.trim().toLowerCase(); if(v==='eravisual2023'||v==='admin'||v==='123'){document.getElementById('login').style.display='none';document.getElementById('app').classList.remove('hidden');loadData();}}
document.getElementById('keyInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function loadData(){
  document.getElementById('list').innerHTML='Loading...';
  let url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0&t=${Date.now()}`;
  let res=await fetch(url); let txt=await res.text(); let json=JSON.parse(txt.substr(47).slice(0,-2));
  let rows=json.table.rows;
  // FORMAT BARU: cek header
  // Row foto kamu: c0=ord-id, c1=2026-10-..., c2=Selesai/Dikonfirmasi, c3=ende, c4=Cabang Ende, c5=editor, c6=detail?, c7=wa?
  allData=rows.map((r,i)=>{let c=r.c; if(!c) return null;
    let no=c[0]?.v||''; if(String(no).toLowerCase().includes('ordernumber')) return null;
    // Deteksi format baru ord-
    if(String(no).startsWith('ord-')){
      return {row:i+2, no:no, tgl:c[1]?.v||'', status:c[2]?.v||'Menunggu', nama:c[3]?.v||'', cabang:c[4]?.v||'', layanan:c[5]?.v||'', detail:c[6]?.v||'', wa:c[7]?.v||''};
    } else if(String(no).startsWith('EV-')){
      return {row:i+2, no:no, tgl:c[1]?.v||'', status:c[8]?.v||'Menunggu', nama:c[2]?.v||'', cabang:c[4]?.v||'', layanan:c[3]?.v||'', detail:c[5]?.v||'', wa:c[6]?.v||''};
    } else return null;
  }).filter(x=>x);

  document.getElementById('total').innerText=allData.length;
  document.getElementById('menunggu').innerText=allData.filter(x=>x.status.toLowerCase().includes('menunggu')).length;
  document.getElementById('selesai').innerText=allData.filter(x=>x.status.toLowerCase().includes('selesai')).length;

  document.getElementById('list').innerHTML=allData.reverse().map(d=>`
    <div class="bg-white p-4 rounded-[20px] border shadow-sm">
      <div class="flex justify-between"><div><p class="font-bold text-[13px]">${d.no}</p><p class="text-[11px] text-gray-400 mt-1">${d.tgl? new Date(d.tgl).toLocaleDateString('id-ID') : d.tgl} • ${d.status}</p><p class="font-bold text-[14px] mt-2">${d.nama} <span class="text-[11px] font-normal text-gray-500">• ${d.cabang}</span></p><p class="text-[11px] text-gray-500 mt-1">${d.layanan} ${d.detail? '• '+d.detail : ''}</p><p class="text-[11px] text-[#0a7bf2] font-bold mt-2">📱 ${d.wa || 'WA kosong di sheet'}</p></div><span class="text-[10px] font-bold px-3 py-1 rounded-full h-fit ${d.status.toLowerCase().includes('selesai')?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-700'}">${d.status}</span></div>
      <div class="flex gap-2 mt-4"><select onchange="ubahStatus(${d.row}, this.value)" class="flex-1 bg-[#f6faff] border text-[11px] p-3 rounded-full font-bold"><option>Ubah Status</option><option value="Menunggu">Menunggu</option><option value="Dikonfirmasi">Dikonfirmasi</option><option value="Selesai">Selesai</option></select><a href="https://wa.me/${String(d.wa).replace(/[^0-9]/g,'')}" target="_blank" class="bg-[#25D366] text-white px-6 py-3 rounded-full text-[11px] font-bold">WA</a></div>
    </div>
  `).join('');
}
function ubahStatus(row, status){if(status.includes('Ubah')) return; fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateStatus',row:row,status:status})}); setTimeout(loadData,1000);}
</script></body></html>
