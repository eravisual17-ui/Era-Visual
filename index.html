<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Era Visual - Ende</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Poppins}</style>
</head>
<body class="bg-[#0f0f0f] text-white">
<div class="max-w-2xl mx-auto min-h-screen flex flex-col justify-center p-6 text-center">
  <h1 class="text-5xl font-bold text-[#e8c07a]">ERA VISUAL</h1>
  <p class="text-gray-400 mt-2">Cabang Ende - Owner Ewaldus Sangga</p>
  <p class="text-gray-300 mt-6 text-sm leading-6">Jasa Electrical, Editor, Mechanical.<br>Booking cepat, nomor order otomatis lanjut.</p>
  <div class="bg-[#1c1c1c] p-6 rounded-2xl mt-8 border border-gray-800">
    <p class="text-sm text-gray-400">Mulai pesan sekarang</p>
    <a href="pesan.html" class="block w-full mt-4 bg-[#e8c07a] text-black p-4 rounded-xl font-bold text-center">Pesan Sekarang</a>
    <button onclick="bukaAI()" class="block w-full mt-3 bg-black border border-[#e8c07a] text-[#e8c07a] p-4 rounded-xl font-bold text-center">💬 Mari Bertanya</button>
  </div>
  <p class="text-xs text-gray-500 mt-8">© 2025 Era Visual Indonesia</p>
</div>

<div id="aiBox" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-[#1c1c1c] w-full sm:max-w-md h-[85vh] sm:h-[600px] rounded-t-[28px] sm:rounded-[28px] border border-gray-700 flex flex-col overflow-hidden">
    <div class="bg-[#e8c07a] p-4 flex justify-between items-center">
      <div class="flex items-center gap-3"><div class="w-10 h-10 bg-black rounded-full flex items-center justify-center font-bold text-[#e8c07a]">CS</div><div><p class="text-black font-bold">Customer Service EV</p><p class="text-black/70 text-[11px]">Online</p></div></div>
      <button onclick="tutupAI()" class="text-black text-3xl font-bold px-2">×</button>
    </div>
    <div id="chatList" class="flex-1 overflow-y-auto p-4 space-y-3">
      <div class="bg-[#2a2a2a] p-3 rounded-2xl text-sm max-w-[85%]">Halo kak! Aku CS Era Visual Ende. Tanya harga, jasa, atau booking ya!</div>
    </div>
    <div class="p-3 bg-[#121212] border-t border-gray-800 flex gap-2">
      <input id="chatInput" placeholder="Tanya sesuatu..." class="flex-1 bg-black border border-gray-600 rounded-full px-4 py-3 text-sm outline-none">
      <button onclick="kirimChat()" class="bg-[#e8c07a] text-black w-12 h-12 rounded-full font-bold">➤</button>
    </div>
  </div>
</div>

<script>
function bukaAI(){document.getElementById('aiBox').classList.remove('hidden')}
function tutupAI(){document.getElementById('aiBox').classList.add('hidden')}

function kirimChat(){
  var input = document.getElementById('chatInput');
  var t = input.value.trim();
  if(!t) return;
  var list = document.getElementById('chatList');
  var div1 = document.createElement('div');
  div1.className = "bg-[#e8c07a] text-black p-3 rounded-2xl text-sm max-w-[85%] ml-auto";
  div1.innerText = t;
  list.appendChild(div1);
  input.value = "";
  list.scrollTop = list.scrollHeight;
  setTimeout(function(){
    var q = t.toLowerCase();
    var jawab = "";
    if(q.indexOf("harga")>=0 || q.indexOf("biaya")>=0){jawab="Harga tergantung jasa kaa. Editor CV 25k, Desain 50k+, Electrical cek 50k+. Klik Booking Sekarang ya!";}
    else if(q.indexOf("booking")>=0 || q.indexOf("pesan")>=0){jawab="Klik Booking Sekarang, isi Nama WA Tanggal, nomor order lanjut otomatis EV-261012-5334 dst.";}
    else if(q.indexOf("lokasi")>=0 || q.indexOf("ende")>=0){jawab="Kami Cabang Ende, Owner Ewaldus Sangga. Bisa panggilan area Ende kota.";}
    else if(q.indexOf("electrical")>=0){jawab="Electrical bisa kaa, kipas, lampu, instalasi. Jelaskan detail di form booking ya.";}
    else if(q.indexOf("editor")>=0 || q.indexOf("cv")>=0){jawab="Editor siap, CV, foto, poster. Nanti kirim file setelah booking.";}
    else {jawab="Oke kaa! Ketik: harga, booking, lokasi, electrical, editor. Atau langsung Booking Sekarang.";}
    var div2 = document.createElement('div');
    div2.className = "bg-[#2a2a2a] p-3 rounded-2xl text-sm max-w-[85%]";
    div2.innerHTML = jawab;
    list.appendChild(div2);
    list.scrollTop = list.scrollHeight;
  },500);
}
document.getElementById('chatInput').addEventListener('keydown', function(e){if(e.key==='Enter'){kirimChat()}});
</script>
</body>
</html>
