<style>
/* ==========================================================================
   Era Visual — Design System
   Electrical + creative service brand. Blueprint precision meets craft.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  /* Color */
  --blue-600:#2F6FED;
  --blue-500:#4C86FF;
  --blue-100:#EAF1FF;
  --blue-50:#F6F9FF;
  --ink:#16202E;
  --slate:#5B6472;
  --slate-light:#8A93A1;
  --line:#E2E8F1;
  --white:#FFFFFF;
  --amber:#E8A33D;
  --green:#2E9E64;
  --red:#D9503F;

  /* Type */
  --font-display:'Sora', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;

  /* Layout */
  --max-w:1120px;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --shadow-card: 0 1px 2px rgba(22,32,46,0.04), 0 8px 24px rgba(22,32,46,0.06);
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--white);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  margin:0 0 .5em 0;
  line-height:1.2;
  letter-spacing:-0.01em;
}
h1{font-size:clamp(2rem,5vw,2.9rem); font-weight:700;}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem); font-weight:700;}
h3{font-size:1.15rem; font-weight:600;}
p{margin:0 0 1em 0; color:var(--slate);}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
ul{margin:0; padding:0;}
button{font-family:inherit;}

.container{
  max-width:var(--max-w);
  margin:0 auto;
  padding:0 20px;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 22px;
  border-radius:var(--radius-s);
  font-weight:600;
  font-size:.95rem;
  cursor:pointer;
  border:1.5px solid transparent;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--blue-600); color:var(--white);}
.btn-primary:hover{background:#255cd1;}
.btn-outline{background:var(--white); color:var(--blue-600); border-color:var(--blue-600);}
.btn-outline:hover{background:var(--blue-50);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--slate-light);}
.btn-whatsapp{background:#25D366; color:#04361b;}
.btn-whatsapp:hover{background:#1fbd5a;}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px; font-size:.85rem;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- Navbar ---------- */
.navbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.navbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px;
  max-width:var(--max-w);
  margin:0 auto;
}
.nav-brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.05rem;}
.nav-brand .mark{width:34px; height:34px; object-fit:contain;}
.nav-links{display:flex; align-items:center; gap:28px;}
.nav-links a{font-size:.92rem; font-weight:500; color:var(--slate); padding:6px 0; border-bottom:2px solid transparent;}
.nav-links a.active, .nav-links a:hover{color:var(--ink); border-color:var(--blue-600);}
.nav-links-head{display:none;}
.nav-cta{display:flex; align-items:center; gap:12px;}
.nav-toggle{display:none; background:none; border:none; cursor:pointer; padding:10px 9px;}
.nav-toggle span{display:block; width:25px; height:2.5px; border-radius:2px; background:var(--ink); margin:6px 0; transition:.2s;}

@media (max-width:860px){
  .nav-overlay{
    position:fixed; inset:0;
    background:rgba(16,22,32,0.55);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:150;
  }
  .nav-overlay.open{ opacity:1; pointer-events:auto; }

  .nav-links{
    position:fixed; top:0; right:0; bottom:0;
    width:82%; max-width:320px;
    background:var(--white);
    flex-direction:column; align-items:stretch;
    padding:22px 22px 40px;
    gap:2px;
    transform:translateX(100%);
    transition:transform .28s ease, visibility 0s linear .28s;
    visibility:hidden;
    overflow-y:auto;
    z-index:200;
    box-shadow:none;
  }
  .nav-links-head{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:16px; margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .nav-links-head span{font-family:var(--font-display); font-weight:700; font-size:1.05rem;}
  .nav-close{
    background:var(--blue-50); border:none; border-radius:10px;
    width:36px; height:36px; font-size:1.2rem; line-height:1;
    color:var(--ink); cursor:pointer;
  }
  .nav-links a{
    width:100%; padding:16px 8px;
    font-size:1.05rem; font-weight:600;
    border-bottom:1px solid var(--line); border-radius:0;
  }
  .nav-links.open{transform:translateX(0); visibility:visible; transition:transform .28s ease, visibility 0s; box-shadow:-8px 0 32px rgba(22,32,46,0.18);}
  .nav-toggle{display:block;}
  .nav-cta .btn-outline{display:none;}
  body.nav-open{overflow:hidden;}
}

/* ---------- Hero ---------- */
.hero{
  padding:64px 0 56px;
  border-bottom:1px solid var(--line);
  background:
    linear-gradient(180deg, var(--blue-50) 0%, rgba(255,255,255,0) 60%);
}
.hero-inner{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:18px;
  max-width:640px;
  margin:0 auto;
}
.hero-logo{width:92px; height:92px; margin-bottom:6px; object-fit:contain; display:block;}
.hero-logo-frame{
  width:120px; height:120px;
  display:flex; align-items:center; justify-content:center;
  background:var(--white);
  border-radius:24px;
  border:1px solid var(--blue-100);
  box-shadow:0 6px 20px rgba(47,111,237,0.14), 0 2px 6px rgba(22,32,46,0.06);
  margin:0 auto 4px;
}
.hero-logo-frame .hero-logo{margin-bottom:0;}
.hero-tag{
  color:var(--blue-600); font-weight:600; font-size:.95rem;
}
.hero p.lead{font-size:1.05rem; max-width:520px;}
.hero-actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:8px;}

/* ---------- Section ---------- */
.section{padding:56px 0;}
.section-head{max-width:620px; margin:0 0 32px 0;}
.section-head.center{margin:0 auto 36px; text-align:center;}

/* ---------- Cards ---------- */
.grid{display:grid; gap:20px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:860px){ .grid-3,.grid-2{grid-template-columns:1fr;} }

.card{
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  padding:24px;
  background:var(--white);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.card:hover{box-shadow:var(--shadow-card); border-color:#D3DEEE;}

.service-card .icon{
  width:44px; height:44px;
  border-radius:10px;
  background:var(--blue-100);
  display:flex; align-items:center; justify-content:center;
  font-size:1.35rem;
  margin-bottom:14px;
}
.badge{
  display:inline-block;
  font-size:.72rem;
  font-weight:600;
  padding:4px 10px;
  border-radius:100px;
  background:var(--blue-100); color:var(--blue-600);
}
.badge.soon{background:#FCEFDC; color:#9A6A1B;}
.badge.dev{background:#EDEAFB; color:#5B4BB8;}
.badge.inactive{background:#F1F3F6; color:var(--slate-light);}
.badge.status-Menunggu{background:#FCEFDC;color:#9A6A1B;}
.badge.status-Dikonfirmasi{background:var(--blue-100);color:var(--blue-600);}
.badge.status-Diproses{background:#EDEAFB;color:#5B4BB8;}
.badge.status-Selesai{background:#E4F6EC;color:var(--green);}
.badge.status-Dibatalkan{background:#FBEAE7;color:var(--red);}

.branch-card{position:relative;}
.branch-card .badge{position:absolute; top:20px; right:20px;}

.employee-card{display:flex; flex-direction:column; align-items:center; text-align:center;}
.avatar{
  width:76px; height:76px; border-radius:50%;
  background:var(--blue-100); color:var(--blue-600);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:1.3rem;
  margin-bottom:12px; overflow:hidden;
}
.avatar img{width:100%; height:100%; object-fit:cover;}

/* ---------- Steps ---------- */
.stepper{display:flex; gap:8px; margin-bottom:36px; flex-wrap:wrap;}
.step-pill{
  flex:1; min-width:110px;
  text-align:center;
  padding:10px 6px;
  font-size:.78rem; font-weight:600;
  color:var(--slate-light);
  border-bottom:3px solid var(--line);
}
.step-pill.active{color:var(--blue-600); border-color:var(--blue-600);}
.step-pill.done{color:var(--ink); border-color:var(--green);}

.option-list{display:grid; gap:12px;}
.option-item{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px;
  border:1.5px solid var(--line);
  border-radius:var(--radius-m);
  padding:18px 20px;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
  background:var(--white);
}
.option-item:hover{border-color:var(--blue-500);}
.option-item.selected{border-color:var(--blue-600); background:var(--blue-50);}
.option-item.disabled{cursor:not-allowed; opacity:.55;}
.option-item .opt-title{font-weight:600; margin-bottom:2px;}
.option-item .opt-sub{font-size:.85rem; color:var(--slate-light);}

/* ---------- Forms ---------- */
.form-field{margin-bottom:18px;}
.form-field label{display:block; font-size:.86rem; font-weight:600; margin-bottom:6px;}
.form-field .hint{font-size:.78rem; color:var(--slate-light); margin-top:4px;}
.form-field input,
.form-field textarea,
.form-field select{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:var(--radius-s);
  font-size:.95rem;
  font-family:inherit;
  background:var(--white);
  color:var(--ink);
}
.form-field input:focus,
.form-field textarea:focus,
.form-field select:focus{outline:2px solid var(--blue-500); outline-offset:1px; border-color:var(--blue-500);}
.form-field.error input,
.form-field.error textarea,
.form-field.error select{border-color:var(--red);}
.form-field .err-msg{color:var(--red); font-size:.78rem; margin-top:4px; display:none;}
.form-field.error .err-msg{display:block;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:640px){ .form-row{grid-template-columns:1fr;} }

/* ---------- Summary box ---------- */
.summary-box{
  background:var(--blue-50);
  border:1px solid var(--blue-100);
  border-radius:var(--radius-m);
  padding:20px;
  margin-bottom:24px;
}
.summary-row{display:flex; justify-content:space-between; gap:12px; padding:7px 0; font-size:.92rem; border-bottom:1px solid rgba(47,111,237,0.1);}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--slate);}
.summary-row .v{font-weight:600; text-align:right;}

/* ---------- Confirmation ---------- */
.confirm-icon{
  width:64px; height:64px; border-radius:50%;
  background:#E4F6EC; color:var(--green);
  display:flex; align-items:center; justify-content:center;
  font-size:2rem; margin:0 auto 18px;
}

/* ---------- Footer ---------- */
.footer{background:var(--ink); color:#C7CEDA; padding:44px 0 26px; margin-top:60px;}
.footer .container{display:flex; flex-direction:column; gap:22px;}
.footer-top{display:flex; flex-wrap:wrap; justify-content:space-between; gap:24px;}
.footer h4{color:var(--white); font-size:.95rem; margin-bottom:10px;}
.footer a{color:#C7CEDA;}
.footer a:hover{color:var(--white);}
.footer .services-line{font-size:.88rem; color:#8E97A6;}
.footer-bottom{border-top:1px solid #2A3444; padding-top:18px; font-size:.8rem; color:#8E97A6; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

/* ---------- Misc ---------- */
.divider{height:1px; background:var(--line); margin:36px 0;}
.eyebrow{color:var(--blue-600); font-weight:600; font-size:.9rem; margin-bottom:6px;}
.text-center{text-align:center;}
.empty-state{text-align:center; padding:48px 20px; color:var(--slate-light);}
.timeline{display:grid; gap:18px;}
.timeline-item{display:flex; gap:16px;}
.timeline-num{
  width:32px; height:32px; border-radius:50%;
  background:var(--blue-100); color:var(--blue-600);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:.9rem; flex-shrink:0;
}
.timeline-item h3{margin-bottom:4px;}

.mono-note{font-size:.8rem; color:var(--slate-light); background:var(--blue-50); border-radius:var(--radius-s); padding:10px 14px;}

/* ---------- News / Berita cards ---------- */
.news-grid{display:grid; gap:26px; grid-template-columns:repeat(2,1fr);}
@media (max-width:760px){ .news-grid{grid-template-columns:1fr;} }
.news-card{
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  overflow:hidden;
  background:var(--white);
  transition:box-shadow .15s ease, border-color .15s ease;
  display:flex; flex-direction:column;
}
.news-card:hover{box-shadow:var(--shadow-card); border-color:#D3DEEE;}
.news-card .news-img{
  width:100%;
  height:auto;
  display:block;
  background:var(--blue-50);
}
.news-card .news-body{padding:20px 22px 22px;}
.news-card .news-date{font-size:.78rem; color:var(--blue-600); font-weight:600; margin-bottom:6px;}
.news-card h3{margin-bottom:8px;}
.news-card .news-excerpt{margin-bottom:10px;}
.news-card .news-full{display:none; margin-top:6px;}
.news-card.expanded .news-full{display:block;}
.news-toggle{background:none; border:none; color:var(--blue-600); font-weight:600; font-size:.88rem; cursor:pointer; padding:0;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--white);
  padding:12px 20px; border-radius:var(--radius-s);
  font-size:.88rem; opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:200;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; scroll-behavior:auto !important;}
}

</style>
<style>
  body{background:var(--blue-50);}
  .admin-shell{display:flex; min-height:100vh;}
  .admin-side{
    width:220px; background:var(--ink); color:#C7CEDA; flex-shrink:0;
    padding:22px 14px; position:sticky; top:0; height:100vh;
  }
  .admin-side .brand{color:var(--white); font-family:var(--font-display); font-weight:700; padding:0 8px 20px;}
  .admin-side a{
    display:block; padding:11px 12px; border-radius:8px; font-size:.9rem; margin-bottom:2px; color:#C7CEDA;
  }
  .admin-side a.active, .admin-side a:hover{background:rgba(255,255,255,.08); color:var(--white);}
  .admin-main{flex:1; padding:28px 32px; max-width:1000px;}
  .admin-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  table{width:100%; border-collapse:collapse; background:var(--white); border-radius:var(--radius-m); overflow:hidden;}
  th,td{padding:12px 14px; text-align:left; font-size:.88rem; border-bottom:1px solid var(--line);}
  th{background:var(--blue-50); font-weight:600; color:var(--slate);}
  tr:last-child td{border-bottom:none;}
  .table-wrap{background:var(--white); border:1px solid var(--line); border-radius:var(--radius-m); overflow-x:auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .inline-form{background:var(--white); border:1px solid var(--line); border-radius:var(--radius-m); padding:20px; margin-bottom:20px;}
  .actions-cell{display:flex; gap:8px;}

<body>

<div class="gate" id="admin-gate">
  <div class="gate-box">
    <h3>Masuk Dashboard Admin</h3>
    <p style="font-size:.85rem;">Masuk dengan akun Google yang terdaftar sebagai admin.</p>
    <div id="g_id_signin"></div>
    <p class="hint" id="google-error" style="color:var(--red); display:none; text-align:center;">Akun ini belum terdaftar sebagai admin.</p>

    <div class="gate-divider">atau pakai PIN</div>
    <div class="form-field">
      <input type="password" id="gate-pin" placeholder="Masukkan PIN">
    </div>
    <button class="btn btn-outline btn-block" id="gate-submit">Masuk dengan PIN</button>
    <p class="hint" id="gate-error" style="color:var(--red); display:none;">PIN salah.</p>
  </div>
</div>

<div class="admin-shell" id="admin-shell" style="display:none;">
  <aside class="admin-side">
    <div class="brand">Era Visual<br><span style="font-weight:400; font-size:.75rem; color:#8E97A6;">Dashboard Admin</span></div>
    <div class="admin-user" id="admin-user-label"></div>

    <a href="#" data-panel="branches">📍 Cabang</a>

<script>
/* ==========================================================================
   Era Visual — Data Store
   Simulasi backend memakai localStorage (khusus MVP / GitHub Pages), dengan
   opsi tambahan menyambung ke Google Sheets lewat SheetDB.io supaya ORDER
   bisa terpusat dari semua perangkat. Lihat README bagian "Order Terpusat
   dengan Google Sheets (SheetDB)" untuk cara mengaktifkannya.
   Semua fungsi CRUD untuk cabang, layanan, karyawan, order & kontak ada di sini.
   ========================================================================== */

const EV_DB_KEY = 'era_visual_db_v1';

// Ganti dengan URL API dari SheetDB.io (format: https://sheetdb.io/api/v1/xxxxxxxxxxxxx)
// supaya ORDER tersimpan terpusat (bisa dilihat dari HP mana saja), bukan
// cuma di localStorage perangkat masing-masing. Biarkan seperti ini
// (placeholder) untuk tetap pakai mode localStorage biasa.
const ERA_BACKEND_URL = 'https://sheetdb.io/api/v1/a03ovjkr3edll';

function evBackendConfigured(){
  return typeof ERA_BACKEND_URL === 'string' && !ERA_BACKEND_URL.startsWith('GANTI_') && ERA_BACKEND_URL.length > 0;
}

// Kirim order baru ke SheetDB (fire-and-forget, tidak memblokir tampilan).
function evBackendSend(payload){
  if(!evBackendConfigured()) return Promise.resolve(null);

  if(payload.action === 'create'){
    return fetch(ERA_BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: [payload.order] })
    }).catch(err => { console.error('Gagal kirim ke SheetDB:', err); return null; });
  }

  if(payload.action === 'updateStatus'){
    // SheetDB: PATCH ke /id/<id> untuk update baris yang cocok di kolom "id"
    return fetch(ERA_BACKEND_URL + '/id/' + encodeURIComponent(payload.id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: { status: payload.status } })
    }).catch(err => { console.error('Gagal update status di SheetDB:', err); return null; });
  }

  return Promise.resolve(null);
}

function evBackendList(){
  if(!evBackendConfigured()) return Promise.resolve(null);
  return fetch(ERA_BACKEND_URL)
    .then(r => r.json())
    .then(rows => Array.isArray(rows) ? rows : null)
    .catch(err => { console.error('Gagal ambil data dari SheetDB:', err); return null; });
}

// ---- Karyawan terpusat (SheetDB terpisah, sheet berbeda dari Order) ----
// Ganti dengan URL API SheetDB khusus untuk data Karyawan.
// Foto TIDAK ikut disinkron (tetap tersimpan lokal per HP saja).
const ERA_EMPLOYEES_BACKEND_URL = 'https://sheetdb.io/api/v1/y6x046dtx26y9';

// Google Sheets bisa mengubah teks "true" menjadi boolean TRUE (dikembalikan "TRUE").
// Fungsi ini menerima semua bentuknya supaya status aktif tidak salah baca.
function evIsTrue(v){
  if(v === true) return true;
  const s = String(v == null ? '' : v).trim().toLowerCase();
  return s === 'true' || s === '1' || s === 'yes' || s === 'ya' || s === 'aktif';
}

// ---- Berita terpusat (tab "Berita" di spreadsheet yang sama dengan Karyawan) ----
// Satu API SheetDB bisa dipakai untuk beberapa tab lewat parameter ?sheet=NamaTab.
const EV_POSTS_TAB = 'Berita';

function evPostsUrl(path){
  return ERA_EMPLOYEES_BACKEND_URL + (path || '') + '?sheet=' + encodeURIComponent(EV_POSTS_TAB);
}

// ---- Foto berita beresolusi tinggi lewat ImgBB (opsional) ----
// Isi dengan API key dari api.imgbb.com. Selama masih "GANTI_...", foto berita
// dikecilkan otomatis supaya muat di satu sel Google Sheets (kualitas lebih rendah).
const ERA_IMGBB_KEY = '77bc28c7915292eb75af9632723df301';

function evImgbbConfigured(){
  return typeof ERA_IMGBB_KEY === 'string' && !ERA_IMGBB_KEY.startsWith('GANTI_') && ERA_IMGBB_KEY.length > 0;
}

function evUploadImage(blob){
  if(!evImgbbConfigured()) return Promise.resolve(null);
  const fd = new FormData();
  fd.append('image', blob, 'berita.jpg');
  return fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent(ERA_IMGBB_KEY), {
    method: 'POST', body: fd
  })
    .then(r => r.json())
    .then(res => (res && res.success && res.data && res.data.url) ? res.data.url : null)
    .catch(err => { console.error('Gagal upload foto ke ImgBB:', err); return null; });
}

function evPostToRow(p){
  return {
    id: p.id,
    title: p.title || '',
    excerpt: p.excerpt || '',
    body: p.body || '',
    date: (p.date || '').slice(0, 10),
    image: p.image || ''
  };
}

function evPostsBackendList(){
  if(!evEmployeesBackendConfigured()) return Promise.resolve(null);
  return fetch(evPostsUrl(''), { cache: 'no-store' })
    .then(r => r.json())
    .then(rows => Array.isArray(rows) ? rows : null)
    .catch(err => { console.error('Gagal ambil berita dari SheetDB:', err); return null; });
}

function evPostsBackendSend(payload){
  if(!evEmployeesBackendConfigured()) return Promise.resolve(null);
  const jsonHead = { 'Content-Type': 'application/json' };

  if(payload.action === 'create'){
    return fetch(evPostsUrl(''), {
      method: 'POST', headers: jsonHead,
      body: JSON.stringify({ data: [evPostToRow(payload.post)] })
    }).catch(err => { console.error('Gagal kirim berita:', err); return null; });
  }
  if(payload.action === 'update'){
    return fetch(evPostsUrl('/id/' + encodeURIComponent(payload.post.id)), {
      method: 'PATCH', headers: jsonHead,
      body: JSON.stringify({ data: evPostToRow(payload.post) })
    }).then(r => r.json()).then(res => {
      // Baris belum ada di sheet -> buat baru.
      if(res && res.updated === 0){
        return fetch(evPostsUrl(''), {
          method: 'POST', headers: jsonHead,
          body: JSON.stringify({ data: [evPostToRow(payload.post)] })
        });
      }
      return res;
    }).catch(err => { console.error('Gagal update berita:', err); return null; });
  }
  if(payload.action === 'delete'){
    return fetch(evPostsUrl('/id/' + encodeURIComponent(payload.id)), { method: 'DELETE' })
      .catch(err => { console.error('Gagal hapus berita:', err); return null; });
  }
  return Promise.resolve(null);
}

// ---- Cabang & Layanan terpusat (tab "Cabang" dan "Layanan" di spreadsheet yang sama) ----
function evTabUrl(tab, path){
  return ERA_EMPLOYEES_BACKEND_URL + (path || '') + '?sheet=' + encodeURIComponent(tab);
}
function evTabList(tab){
  if(!evEmployeesBackendConfigured()) return Promise.resolve(null);
  return fetch(evTabUrl(tab, ''), { cache: 'no-store' })
    .then(r => r.json())
    .then(rows => Array.isArray(rows) ? rows : null)
    .catch(err => { console.error('Gagal ambil tab ' + tab + ':', err); return null; });
}
function evTabUpsert(tab, row){
  if(!evEmployeesBackendConfigured()) return Promise.resolve(null);
  const head = { 'Content-Type': 'application/json' };
  return fetch(evTabUrl(tab, '/id/' + encodeURIComponent(row.id)), {
    method: 'PATCH', headers: head, body: JSON.stringify({ data: row })
  }).then(r => r.json()).then(res => {
    if(res && res.updated === 0){
      return fetch(evTabUrl(tab, ''), { method: 'POST', headers: head, body: JSON.stringify({ data: [row] }) });
    }
    return res;
  }).catch(err => { console.error('Gagal simpan ke tab ' + tab + ':', err); return null; });
}
function evTabDelete(tab, id){
  if(!evEmployeesBackendConfigured()) return Promise.resolve(null);
  return fetch(evTabUrl(tab, '/id/' + encodeURIComponent(id)), { method: 'DELETE' })
    .catch(err => { console.error('Gagal hapus dari tab ' + tab + ':', err); return null; });
}
function evTabPushAll(tab, rows){
  if(!evEmployeesBackendConfigured() || rows.length === 0) return Promise.resolve(false);
  return fetch(evTabUrl(tab, ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: rows })
  }).then(r => r.ok).catch(err => { console.error('Gagal kirim awal ke tab ' + tab + ':', err); return false; });
}
function evBranchToRow(b){
  return { id: b.id, name: b.name || '', status: b.status || 'active', address: b.address || '' };
}
function evServiceToRow(s){
  return {
    id: s.id, name: s.name || '', icon: s.icon || '', status: s.status || 'active',
    short: s.short || '', description: s.description || '', isLocal: s.isLocal ? 'true' : 'false'
  };
}

function evRatingLabel(employeeId){
  const r = EraDB.getEmployeeRating(employeeId);
  if(r.count === 0) return '<span style="font-size:.78rem; color:var(--slate-light);">Belum ada rating</span>';
  return '<span style="font-size:.85rem; color:#B7791F; font-weight:600;">&#9733; ' + r.avg.toFixed(1) + '</span> ' +
         '<span style="font-size:.78rem; color:var(--slate-light);">(' + r.count + ' ulasan)</span>';
}

function evEmployeesBackendConfigured(){
  return typeof ERA_EMPLOYEES_BACKEND_URL === 'string' && !ERA_EMPLOYEES_BACKEND_URL.startsWith('GANTI_') && ERA_EMPLOYEES_BACKEND_URL.length > 0;
}

function evEmployeesBackendSend(payload){
  if(!evEmployeesBackendConfigured()) return Promise.resolve(null);

  if(payload.action === 'create'){
    return fetch(ERA_EMPLOYEES_BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: [payload.employee] })
    }).catch(err => { console.error('Gagal kirim karyawan ke SheetDB:', err); return null; });
  }

  if(payload.action === 'update'){
    return fetch(ERA_EMPLOYEES_BACKEND_URL + '/id/' + encodeURIComponent(payload.employee.id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: payload.employee })
    }).then(r => r.json()).then(res => {
      // Kalau baris belum ada di sheet (updated = 0), buat baris barunya.
      if(res && res.updated === 0){
        return fetch(ERA_EMPLOYEES_BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: [payload.employee] })
        });
      }
      return res;
    }).catch(err => { console.error('Gagal update karyawan di SheetDB:', err); return null; });
  }

  if(payload.action === 'delete'){
    return fetch(ERA_EMPLOYEES_BACKEND_URL + '/id/' + encodeURIComponent(payload.id), {
      method: 'DELETE'
    }).catch(err => { console.error('Gagal hapus karyawan di SheetDB:', err); return null; });
  }

  return Promise.resolve(null);
}

function evEmployeesBackendList(){
  if(!evEmployeesBackendConfigured()) return Promise.resolve(null);
  return fetch(ERA_EMPLOYEES_BACKEND_URL, { cache: 'no-store' })
    .then(r => r.json())
    .then(rows => Array.isArray(rows) ? rows : null)
    .catch(err => { console.error('Gagal ambil data karyawan dari SheetDB:', err); return null; });
}

function evLoadDB(){
  let raw = localStorage.getItem(EV_DB_KEY);
  if(!raw){
    localStorage.setItem(EV_DB_KEY, JSON.stringify(EV_SEED));
    return JSON.parse(JSON.stringify(EV_SEED));
  }
  try{
    const db = JSON.parse(raw);
    if(!Array.isArray(db.posts)) db.posts = []; // migrasi data lama yang belum punya "posts"
    if(!Array.isArray(db.ratings)) db.ratings = [];
    return db;
  }catch(e){
    localStorage.setItem(EV_DB_KEY, JSON.stringify(EV_SEED));
    return JSON.parse(JSON.stringify(EV_SEED));
  }
}

function evSaveDB(db){
  localStorage.setItem(EV_DB_KEY, JSON.stringify(db));
}

// Batasi seberapa sering situs ini bertanya ke Google Sheets. Setiap halaman
// (Cabang, Layanan, Karyawan, Rating, Berita) sebelumnya menghubungi Sheets
// sendiri-sendiri setiap kali dibuka, jadi satu orang buka beberapa halaman
// bisa memakai belasan permintaan sekaligus -- jatah bulanan SheetDB (gratis)
// jadi cepat habis. Sekarang: dalam jeda ini, cukup pakai data lokal yang
// sudah ada, tidak usah tanya ke Sheets lagi.
const EV_SYNC_COOLDOWN_MS = 10 * 60 * 1000; // 10 menit

function evThrottledSync(key, run){
  const storeKey = 'ev_sync_' + key;
  let last = 0;
  try{ last = parseInt(localStorage.getItem(storeKey) || '0', 10) || 0; }catch(e){}
  if(Date.now() - last < EV_SYNC_COOLDOWN_MS){
    return Promise.resolve(false);
  }
  try{ localStorage.setItem(storeKey, String(Date.now())); }catch(e){}
  return run();
}

const EraDB = {
  reset(){ localStorage.setItem(EV_DB_KEY, JSON.stringify(EV_SEED)); },

  // ---------- Contact ----------
  getContact(){ return evLoadDB().contact; },
  saveContact(contact){ const db = evLoadDB(); db.contact = contact; evSaveDB(db); },

  // ---------- Branches ----------
  getBranches(){ return evLoadDB().branches; },
  getBranch(id){ return evLoadDB().branches.find(b => b.id === id); },
  saveBranch(branch){
    const db = evLoadDB();
    const i = db.branches.findIndex(b => b.id === branch.id);
    if(i >= 0) db.branches[i] = branch; else db.branches.push(branch);
    evSaveDB(db);
    return evTabUpsert('Cabang', evBranchToRow(branch)).then(() => true);
  },
  deleteBranch(id){
    const db = evLoadDB();
    db.branches = db.branches.filter(b => b.id !== id);
    evSaveDB(db);
    return evTabDelete('Cabang', id).then(() => true);
  },

  // ---------- Services ----------
  getServices(){ return evLoadDB().services; },
  getService(id){ return evLoadDB().services.find(s => s.id === id); },
  saveService(service){
    const db = evLoadDB();
    const i = db.services.findIndex(s => s.id === service.id);
    if(i >= 0) db.services[i] = service; else db.services.push(service);
    evSaveDB(db);
    return evTabUpsert('Layanan', evServiceToRow(service)).then(() => true);
  },
  deleteService(id){
    const db = evLoadDB();
    db.services = db.services.filter(s => s.id !== id);
    evSaveDB(db);
    return evTabDelete('Layanan', id).then(() => true);
  },
  // ---------- Rating karyawan (tab "Rating") ----------
  getEmployeeRating(employeeId){
    const rs = (evLoadDB().ratings || []).filter(r => r.employeeId === employeeId);
    if(rs.length === 0) return { avg: 0, count: 0 };
    const sum = rs.reduce((a, r) => a + r.stars, 0);
    return { avg: sum / rs.length, count: rs.length };
  },
  syncRatingsFromRemote(){
    return evThrottledSync('ratings', () => {
    if(!evEmployeesBackendConfigured()) return Promise.resolve(false);
    return evTabList('Rating').then(remote => {
      if(!remote) return false; // gagal ambil / tab belum ada -> jangan timpa
      const db = evLoadDB();
      const before = JSON.stringify(db.ratings || []);
      db.ratings = remote.map(r => {
        const n = parseInt(r.stars, 10);
        return { id: r.id || '', orderNumber: r.orderNumber || '', employeeId: r.employeeId || '',
                 stars: n, comment: r.comment || '', createdAt: r.createdAt || '' };
      }).filter(r => r.employeeId && r.stars >= 1 && r.stars <= 5);
      evSaveDB(db);
      return before !== JSON.stringify(db.ratings);
    });
  });
  },
  // Ambil cabang & layanan terbaru dari sheet. Mengembalikan true kalau ada yang berubah.
  // opts.admin = true: kalau tab masih kosong, kirim data bawaan/lokal ke sheet (sekali di awal).
  syncCatalogFromRemote(opts){
    return evThrottledSync('catalog', () => {
    if(!evEmployeesBackendConfigured()) return Promise.resolve(false);
    const admin = !!(opts && opts.admin);
    return Promise.all([evTabList('Cabang'), evTabList('Layanan')]).then(res => {
      const rb = res[0], rs = res[1];
      const db = evLoadDB();
      const before = JSON.stringify([db.branches, db.services]);
      const pushes = [];
      if(rb){
        if(rb.length === 0){
          if(admin && db.branches.length) pushes.push(evTabPushAll('Cabang', db.branches.map(evBranchToRow)));
        } else {
          db.branches = rb.filter(r => r.id).map(r => ({
            id: r.id, name: r.name || '', status: r.status || 'active', address: r.address || ''
          }));
        }
      }
      if(rs){
        if(rs.length === 0){
          if(admin && db.services.length) pushes.push(evTabPushAll('Layanan', db.services.map(evServiceToRow)));
        } else {
          db.services = rs.filter(r => r.id).map(r => ({
            id: r.id, name: r.name || '', icon: r.icon || '', status: r.status || 'active',
            short: r.short || '', description: r.description || '', isLocal: evIsTrue(r.isLocal)
          }));
        }
      }
      evSaveDB(db);
      return Promise.all(pushes).then(() => before !== JSON.stringify([db.branches, db.services]));
    });
  });
  },

  // ---------- Employees ----------
  getEmployees(){ return evLoadDB().employees; },
  getEmployee(id){ return evLoadDB().employees.find(e => e.id === id); },
  getEmployeesFor(branchId, serviceId){
    return evLoadDB().employees.filter(e =>
      e.active && e.branchId === branchId && e.serviceIds.includes(serviceId)
    );
  },
  saveEmployee(emp){
    const db = evLoadDB();
    const i = db.employees.findIndex(e => e.id === emp.id);
    const isNew = i < 0;
    if(i >= 0) db.employees[i] = emp; else db.employees.push(emp);
    evSaveDB(db);
    // Kirim ke SheetDB (foto sengaja TIDAK ikut dikirim — tetap lokal per HP)
    evEmployeesBackendSend({
      action: isNew ? 'create' : 'update',
      employee: {
        id: emp.id,
        name: emp.name,
        role: emp.role,
        branchId: emp.branchId,
        serviceIds: (emp.serviceIds || []).join(','),
        whatsapp: emp.whatsapp || '',
        description: emp.description || '',
        active: emp.active ? 'true' : 'false'
      }
    });
  },
  deleteEmployee(id){
    const db = evLoadDB();
    db.employees = db.employees.filter(e => e.id !== id);
    evSaveDB(db);
    evEmployeesBackendSend({ action: 'delete', id });
  },
  // Ambil data karyawan terbaru dari SheetDB dan perbarui cache lokal.
  // Foto lokal yang sudah ada tetap dipertahankan (tidak ikut disinkron).
  syncEmployeesFromRemote(){
    return evThrottledSync('employees', () => {
    if(!evEmployeesBackendConfigured()) return Promise.resolve(false);
    return evEmployeesBackendList().then(remote => {
      // Kalau sheet masih kosong, jangan timpa data lokal (supaya karyawan
      // yang sudah ada tidak hilang sebelum sempat dikirim ke Sheets).
      if(!remote || remote.length === 0) return false;
      const db = evLoadDB();
      const localPhotoById = {};
      db.employees.forEach(e => { if(e.photo) localPhotoById[e.id] = e.photo; });
      db.employees = remote.map(r => ({
        id: r.id,
        name: r.name || '',
        role: r.role || '',
        branchId: r.branchId || '',
        serviceIds: (r.serviceIds || '').split(',').map(s => s.trim()).filter(Boolean),
        whatsapp: r.whatsapp || '',
        photo: localPhotoById[r.id] || '',
        description: r.description || '',
        active: evIsTrue(r.active)
      }));
      evSaveDB(db);
      return true;
    });
  });
  },
  // Kirim SEMUA karyawan yang ada di HP ini ke Google Sheets sekaligus.
  // Dipakai sekali di awal supaya karyawan bawaan/lama ikut masuk ke sheet
  // (karena mereka dibuat sebelum sheet-nya disambungkan).
  pushAllEmployeesToRemote(){
    if(!evEmployeesBackendConfigured()) return Promise.resolve(false);
    const employees = evLoadDB().employees;
    if(employees.length === 0) return Promise.resolve(true);
    const rows = employees.map(e => ({
      id: e.id,
      name: e.name,
      role: e.role,
      branchId: e.branchId,
      serviceIds: (e.serviceIds || []).join(','),
      whatsapp: e.whatsapp || '',
      description: e.description || '',
      active: e.active ? 'true' : 'false'
    }));
    return fetch(ERA_EMPLOYEES_BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: rows })
    }).then(r => r.ok).catch(err => { console.error('Gagal kirim semua karyawan:', err); return false;
    });
  },

  // ---------- Orders ----------
  getOrders(){ return evLoadDB().orders.slice().reverse(); },
  getOrder(id){ return evLoadDB().orders.find(o => o.id === id); },
  getOrdersRemote(){
    return evBackendList().then(remote => {
      if(!remote) return null;
      return remote.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    });
  },
  createOrder(order){
    const db = evLoadDB();
    const now = new Date();
    const orderNumber = 'EV-' + now.getFullYear().toString().slice(-2) +
      String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') +
      '-' + Math.floor(1000 + Math.random()*9000);
    const full = Object.assign({
      id: 'ord-' + Date.now(),
      orderNumber: orderNumber,
      status: 'Menunggu',
      createdAt: now.toISOString()
    }, order);
    db.orders.push(full);
    evSaveDB(db);
    evBackendSend({ action: 'create', order: full }); // kirim ke Google Sheets kalau sudah dikonfigurasi
    return full;
  },
  updateOrderStatus(id, status){
    const db = evLoadDB();
    const o = db.orders.find(o => o.id === id);
    if(o){ o.status = status; evSaveDB(db); }
    evBackendSend({ action: 'updateStatus', id, status });
  },

  // ---------- Posts (Berita / Info / Iklan) ----------
  getPosts(){
    return evLoadDB().posts.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  },
  getPost(id){ return evLoadDB().posts.find(p => p.id === id); },
  savePost(post){
    const db = evLoadDB();
    const i = db.posts.findIndex(p => p.id === post.id);
    const isNew = i < 0;
    if(i >= 0) db.posts[i] = post; else db.posts.push(post);
    evSaveDB(db);
    // Kembalikan promise supaya admin bisa menunggu sampai tersimpan di sheet.
    return evPostsBackendSend({ action: isNew ? 'create' : 'update', post }).then(() => true);
  },
  deletePost(id){
    const db = evLoadDB();
    db.posts = db.posts.filter(p => p.id !== id);
    evSaveDB(db);
    return evPostsBackendSend({ action: 'delete', id }).then(() => true);
  },
  // Ambil berita terbaru dari tab "Berita". Foto ikut tersimpan (sudah dikompres).
  // opts.admin = true: kalau sheet masih kosong tetapi HP admin punya berita,
  // kirim berita itu ke sheet (sekali di awal) alih-alih menimpanya.
  syncPostsFromRemote(opts){
    return evThrottledSync('posts', () => {
    if(!evEmployeesBackendConfigured()) return Promise.resolve(false);
    const admin = !!(opts && opts.admin);
    return evPostsBackendList().then(remote => {
      if(!remote) return false; // gagal ambil / tab belum ada -> jangan timpa data lokal
      const db = evLoadDB();
      if(remote.length === 0 && admin && db.posts.length > 0){
        return EraDB.pushAllPostsToRemote().then(() => false);
      }
      db.posts = remote.filter(r => r.id).map(r => ({
        id: r.id,
        title: r.title || '',
        excerpt: r.excerpt || '',
        body: r.body || '',
        date: r.date || '',
        image: r.image || ''
      }));
      evSaveDB(db);
      return true;
    });
  });
  },
  pushAllPostsToRemote(){
    if(!evEmployeesBackendConfigured()) return Promise.resolve(false);
    const posts = evLoadDB().posts;
    if(posts.length === 0) return Promise.resolve(true);
    return fetch(evPostsUrl(''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: posts.map(evPostToRow) })
    }).then(r => r.ok).catch(err => { console.error('Gagal kirim semua berita:', err); return false; });
  }
};

function evDecodeJwt(token){
  try{
    const payload = token.split('.')[1];
    const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(json);
  }catch(e){
    return null;
  }
}

  if(!payload || !payload.email){

  const allowed = ADMIN_ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(email);

    errorEl.textContent = `Akun ${payload.email} belum terdaftar sebagai admin.`;

// Baca file gambar yang diupload dan ubah jadi data URL (base64) supaya bisa
// disimpan langsung di localStorage tanpa perlu server penyimpanan file.
function evFileToDataURL(fileInput, callback){
  const file = fileInput.files[0];
  if(!file){ callback(null); return; }
  const reader = new FileReader();
  reader.onload = () => callback(reader.result);
  reader.onerror = () => callback(null);
  reader.readAsDataURL(file);
}

// Kecilkan foto berita supaya muat di satu sel Google Sheets (batas 50.000 karakter).
function evCompressImage(fileInput, callback){
  const file = fileInput.files[0];
  if(!file){ callback(null); return; }
  const MAX_CHARS = 40000;
  const reader = new FileReader();
  reader.onerror = () => callback(null);
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => callback(null);
    img.onload = () => {
      let maxSide = 720, quality = 0.75, best = null;
      for(let attempt = 0; attempt < 30; attempt++){
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        best = c.toDataURL('image/jpeg', quality);
        if(best.length <= MAX_CHARS) break;
        if(quality > 0.4){ quality -= 0.1; } else { maxSide = Math.round(maxSide * 0.8); quality = 0.7; }
        if(maxSide < 160) break;
      }
      callback(best);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function evCompressToBlob(file, maxDim, quality){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b); }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

      <h3 id="ne-form-title">${editing ? 'Edit Karyawan' : 'Tambah Karyawan'}</h3>
      <div class="form-row">
        <div class="form-field"><label>Nama</label><input id="ne-name" placeholder="Nama karyawan" value="${editing ? evEscape(editing.name) : ''}"></div>
        <div class="form-field"><label>Jabatan</label><input id="ne-role" placeholder="Contoh: Divisi Editor" value="${editing ? evEscape(editing.role) : ''}"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Cabang</label>
          <select id="ne-branch">${branches.map(b=>`<option value="${b.id}" ${editing && editing.branchId===b.id ? 'selected':''}>${evEscape(b.name)}</option>`).join('')}</select>
        </div>
        <div class="form-field"><label>Nomor WhatsApp</label><input id="ne-wa" placeholder="62xxxxxxxxxx" value="${editing ? evEscape(editing.whatsapp) : ''}"></div>
      </div>
      <div class="form-field">
        <label>Layanan / Divisi</label>
        <div id="ne-services" style="display:flex; gap:14px; flex-wrap:wrap;">
          ${services.map(s => `<label style="font-weight:400; font-size:.88rem; display:flex; gap:6px; align-items:center;"><input type="checkbox" value="${s.id}" ${editing && editing.serviceIds.includes(s.id) ? 'checked':''}> ${evEscape(s.name)}</label>`).join('')}
        </div>
      </div>
      <div class="form-field"><label>Foto (URL)</label><input id="ne-photo" placeholder="https://... (opsional)" value="${editing ? evEscape(editing.photo) : ''}"></div>
      <div class="form-field"><label>Deskripsi Singkat</label><input id="ne-desc" placeholder="Opsional" value="${editing ? evEscape(editing.description) : ''}"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary btn-sm" id="ne-add">${editing ? 'Simpan Perubahan' : 'Tambah Karyawan'}</button>
        ${editing ? `<button class="btn btn-ghost btn-sm" id="ne-cancel">Batal</button>` : ''}
      </div>
    </div>
    <p class="hint" id="employees-source-note" style="margin-bottom:10px;"></p>
    <button class="btn btn-outline btn-sm" id="push-all-employees" style="margin-bottom:14px; display:none;">Kirim Semua Karyawan (HP ini) ke Google Sheets</button>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nama</th><th>Jabatan</th><th>Cabang</th><th>Layanan</th><th>WhatsApp</th><th>Aktif</th><th></th></tr></thead>
        <tbody id="employees-tbody"></tbody>
      </table>
    </div>
  `;

  function draw(){
    const employees = EraDB.getEmployees();
    document.getElementById('employees-tbody').innerHTML = employees.map(e => {
      const svcNames = e.serviceIds.map(id => (EraDB.getService(id)||{}).name).filter(Boolean).join(', ');
      const branchName = (EraDB.getBranch(e.branchId)||{}).name || '-';
      return `
        <tr>
          <td>${evEscape(e.name)}</td>
          <td>${evEscape(e.role)}</td>
          <td>${evEscape(branchName)}</td>
          <td>${evEscape(svcNames)}</td>
          <td>${evEscape(e.whatsapp || '-')}</td>
          <td><input type="checkbox" class="edit-active" data-id="${e.id}" ${e.active ? 'checked' : ''}></td>
          <td class="actions-cell">
            <button class="btn btn-ghost btn-sm edit-emp" data-id="${e.id}">Edit</button>
            <button class="btn btn-ghost btn-sm del-emp" data-id="${e.id}">Hapus</button>
          </td>
        </tr>
      `;
    }).join('');

    document.querySelectorAll('.edit-active').forEach(cb => cb.addEventListener('change', () => {
      const emp = EraDB.getEmployee(cb.dataset.id); emp.active = cb.checked; EraDB.saveEmployee(emp);
      evShowToastAdmin('Status aktif karyawan diperbarui.');
    }));
    document.querySelectorAll('.edit-emp').forEach(btn => btn.addEventListener('click', () => {
      evRenderEmployeesPanel(btn.dataset.id);
    }));
    document.querySelectorAll('.del-emp').forEach(btn => btn.addEventListener('click', () => {
      if(confirm('Hapus karyawan ini?')){ EraDB.deleteEmployee(btn.dataset.id); draw(); }
    }));
  }

  if(editing && document.getElementById('ne-cancel')){
    document.getElementById('ne-cancel').addEventListener('click', () => evRenderEmployeesPanel());
  }

  document.getElementById('ne-add').addEventListener('click', () => {
    const name = document.getElementById('ne-name').value.trim();
    const role = document.getElementById('ne-role').value.trim();
    const branchId = document.getElementById('ne-branch').value;
    const whatsapp = document.getElementById('ne-wa').value.trim();
    const photo = document.getElementById('ne-photo').value.trim();
    const description = document.getElementById('ne-desc').value.trim();
    const serviceIds = Array.from(document.querySelectorAll('#ne-services input:checked')).map(i => i.value);

    if(!name || !role || serviceIds.length === 0){
      evShowToastAdmin('Nama, jabatan, dan minimal satu layanan wajib diisi.'); return;
    }

    if(editing){
      EraDB.saveEmployee(Object.assign({}, editing, {
        name, role, branchId, serviceIds, whatsapp, photo, description
      }));
      evShowToastAdmin('Perubahan karyawan disimpan.');
      evRenderEmployeesPanel();
    } else {
      EraDB.saveEmployee({
        id: 'emp-' + Date.now(), name, role, branchId, serviceIds, whatsapp, photo, description, active: true
      });
      ['ne-name','ne-role','ne-wa','ne-photo','ne-desc'].forEach(id => document.getElementById(id).value = '');
      document.querySelectorAll('#ne-services input').forEach(i => i.checked = false);
      draw();
      evShowToastAdmin('Karyawan ditambahkan.');
    }
  });

  draw();

  const empNoteEl = document.getElementById('employees-source-note');
  const pushBtn = document.getElementById('push-all-employees');

  pushBtn.addEventListener('click', () => {
    pushBtn.disabled = true;
    pushBtn.textContent = 'Mengirim...';
    EraDB.pushAllEmployeesToRemote().then(ok => {
      evShowToastAdmin(ok ? 'Semua karyawan berhasil dikirim ke Google Sheets.' : 'Gagal mengirim ke Google Sheets.');
      pushBtn.disabled = false;
      pushBtn.textContent = 'Kirim Semua Karyawan (HP ini) ke Google Sheets';
      if(ok){
        EraDB.syncEmployeesFromRemote().then(() => draw());
      }
    });
  });

  if(evEmployeesBackendConfigured()){
    pushBtn.style.display = '';
    empNoteEl.textContent = 'Memuat data karyawan dari Google Sheets...';
    EraDB.syncEmployeesFromRemote().then(ok => {
      empNoteEl.textContent = ok
        ? 'Karyawan terpusat dari Google Sheets — bisa dilihat & diubah dari HP mana saja (foto tetap tersimpan per HP).'
        : 'Google Sheets belum berisi data karyawan (atau gagal dimuat) — menampilkan data di HP ini. Kalau ini pertama kali disambungkan, tap tombol di bawah untuk mengirim karyawan yang sudah ada.';
      draw();
    });
  } else {
    empNoteEl.textContent = 'Data karyawan lokal saja (belum disambungkan ke Google Sheets).';
  }
}

/* ==================== SERVICES ==================== */
function evRenderServicesPanel(){
  const el = document.getElementById('panel-services');
  el.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Layanan</th><th>Status</th><th>Deskripsi Singkat</th></tr></thead>
    <tbody id="services-tbody"></tbody>
  </table></div>`;

  function draw(){
    const services = EraDB.getServices();
    document.getElementById('services-tbody').innerHTML = services.map(s => `
      <tr>
        <td>${s.icon} ${evEscape(s.name)}</td>
        <td>
          <select class="edit-svc-status" data-id="${s.id}">
            <option value="active" ${s.status==='active'?'selected':''}>Aktif</option>
            <option value="dev" ${s.status==='dev'?'selected':''}>Tahap Pengembangan</option>
            <option value="coming_soon" ${s.status==='coming_soon'?'selected':''}>Segera Hadir</option>
          </select>
        </td>
        <td><input class="edit-svc-short" data-id="${s.id}" value="${evEscape(s.short)}" style="border:none; background:transparent; width:100%; font:inherit;"></td>
      </tr>
    `).join('');

    document.querySelectorAll('.edit-svc-status').forEach(sel => sel.addEventListener('change', () => {
      const s = EraDB.getService(sel.dataset.id); s.status = sel.value; EraDB.saveService(s);
      evShowToastAdmin('Status layanan diperbarui.');
    }));
    document.querySelectorAll('.edit-svc-short').forEach(inp => inp.addEventListener('change', () => {
      const s = EraDB.getService(inp.dataset.id); s.short = inp.value; EraDB.saveService(s);
      evShowToastAdmin('Deskripsi layanan diperbarui.');
    }));
  }
  draw();
  EraDB.syncCatalogFromRemote({ admin: true }).then(changed => { if(changed) draw(); });
}

/* ==================== POSTS (Berita / Info / Iklan) ==================== */
function evRenderPostsPanel(editingId){
  const el = document.getElementById('panel-posts');
  const editing = editingId ? EraDB.getPost(editingId) : null;
  const todayStr = new Date().toISOString().slice(0,10);

  el.innerHTML = `
    <div class="inline-form">
      <h3>${editing ? 'Edit Berita/Info' : 'Tambah Berita/Info/Iklan'}</h3>
      <div class="form-field">
        <label>Judul</label>
        <input id="np-title" placeholder="Contoh: Promo Instalasi Listrik Bulan Ini" value="${editing ? evEscape(editing.title) : ''}">
      </div>
      <div class="form-field">
        <label>Cuplikan Singkat</label>
        <input id="np-excerpt" placeholder="Ringkasan 1-2 kalimat yang tampil di daftar" value="${editing ? evEscape(editing.excerpt) : ''}">
      </div>
      <div class="form-field">
        <label>Isi Lengkap <span style="font-weight:400; color:var(--slate-light);">(opsional — muncul saat "Baca Selengkapnya" ditekan)</span></label>
        <textarea id="np-body" rows="4" placeholder="Isi lengkap berita/info, opsional">${editing ? evEscape(editing.body) : ''}</textarea>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Tanggal</label>
          <input type="date" id="np-date" value="${editing ? editing.date.slice(0,10) : todayStr}">
        </div>
        <div class="form-field">
          <label>Foto <span style="font-weight:400; color:var(--slate-light);">(${editing ? 'kosongkan jika tidak diganti' : 'opsional'})</span></label>
          <input type="file" id="np-photo" accept="image/*">
        </div>
      </div>
      ${editing && editing.image ? `<img src="${editing.image}" alt="Foto saat ini" style="max-width:160px; border-radius:8px; margin-bottom:14px; display:block;">` : ''}
      <div class="hint" style="margin-bottom:14px;">${evImgbbConfigured()
        ? 'Foto diunggah ke ImgBB dalam ukuran besar, jadi tulisan di poster tetap terbaca di semua HP.'
        : 'Foto dikecilkan otomatis supaya muat di Google Sheets, jadi poster penuh tulisan bisa kurang jelas. Isi API key ImgBB di admin.html untuk foto beresolusi tinggi.'}</div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary btn-sm" id="np-save">${editing ? 'Simpan Perubahan' : 'Publikasikan'}</button>
        ${editing ? `<button class="btn btn-ghost btn-sm" id="np-cancel">Batal</button>` : ''}
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Foto</th><th>Judul</th><th>Tanggal</th><th></th></tr></thead>
        <tbody id="posts-tbody"></tbody>
      </table>
    </div>
  `;

  function draw(){
    const posts = EraDB.getPosts();
    const tbody = document.getElementById('posts-tbody');
    if(posts.length === 0){
      tbody.innerHTML = `<tr><td colspan="4" class="empty-state">Belum ada berita/info yang dipublikasikan.</td></tr>`;
      return;
    }
    tbody.innerHTML = posts.map(p => `
      <tr>
        <td>${p.image ? `<img src="${p.image}" alt="" style="width:56px; height:40px; object-fit:cover; border-radius:6px;">` : '-'}</td>
        <td>${evEscape(p.title)}</td>
        <td>${new Date(p.date).toLocaleDateString('id-ID')}</td>
        <td class="actions-cell">
          <button class="btn btn-ghost btn-sm edit-post" data-id="${p.id}">Edit</button>
          <button class="btn btn-ghost btn-sm del-post" data-id="${p.id}">Hapus</button>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('.edit-post').forEach(btn => btn.addEventListener('click', () => {
      evRenderPostsPanel(btn.dataset.id);
    }));
    document.querySelectorAll('.del-post').forEach(btn => btn.addEventListener('click', () => {
      if(confirm('Hapus berita/info ini?')){ EraDB.deletePost(btn.dataset.id); draw(); }
    }));
  }

  if(editing && document.getElementById('np-cancel')){
    document.getElementById('np-cancel').addEventListener('click', () => evRenderPostsPanel());
  }

  document.getElementById('np-save').addEventListener('click', () => {
    const title = document.getElementById('np-title').value.trim();
    const excerpt = document.getElementById('np-excerpt').value.trim();
    const body = document.getElementById('np-body').value.trim();
    const date = document.getElementById('np-date').value || todayStr;
    const photoInput = document.getElementById('np-photo');

    if(!title || !excerpt){
      evShowToastAdmin('Judul dan cuplikan singkat wajib diisi.'); return;
    }

    const saveBtn = document.getElementById('np-save');
    saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan...';
    const finish = (dataUrl, note) => {
      const image = dataUrl || (editing ? editing.image : '');
      const post = editing
        ? Object.assign({}, editing, { title, excerpt, body, date, image })
        : { id: 'post-' + Date.now(), title, excerpt, body, date, image };
      EraDB.savePost(post).then(() => {
        evShowToastAdmin(note || (editing ? 'Perubahan berita/info disimpan.' : 'Berita/info dipublikasikan.'));
        evRenderPostsPanel();
      });
    };
    const file = photoInput.files[0];
    if(file && evImgbbConfigured()){
      evCompressToBlob(file, 1600, 0.85)
        .then(blob => blob ? evUploadImage(blob) : null)
        .then(url => {
          if(url){ finish(url); return; }
          evCompressImage(photoInput, d => finish(d, 'Tersimpan, tapi foto gagal diunggah ke ImgBB sehingga dikecilkan (kualitas lebih rendah).'));
        });
    } else {
      evCompressImage(photoInput, d => finish(d));
    }
  });

  draw();
  EraDB.syncPostsFromRemote({ admin: true }).then(changed => { if(changed) draw(); });
}

/* ==================== CONTACT ==================== */
function evRenderContactPanel(){
  const el = document.getElementById('panel-contact');
  const c = EraDB.getContact();
  el.innerHTML = `
    <div class="inline-form" style="max-width:480px;">
      <div class="form-field"><label>Email</label><input id="c-email" value="${evEscape(c.email)}"></div>
      <div class="form-field"><label>WhatsApp (format 62xxxxxxxxxx)</label><input id="c-wa" value="${evEscape(c.whatsapp)}"></div>
      <div class="form-field"><label>WhatsApp (tampilan, contoh 08xxxxxxxxxx)</label><input id="c-wa-display" value="${evEscape(c.whatsapp_display)}"></div>
      <div class="form-field"><label>Instagram</label><input id="c-ig" value="${evEscape(c.instagram)}"></div>
      <button class="btn btn-primary btn-sm" id="c-save">Simpan Kontak</button>
    </div>
  `;
  document.getElementById('c-save').addEventListener('click', () => {
    EraDB.saveContact({
      email: document.getElementById('c-email').value.trim(),
      whatsapp: document.getElementById('c-wa').value.trim(),
      whatsapp_display: document.getElementById('c-wa-display').value.trim(),
      instagram: document.getElementById('c-ig').value.trim()
    });
    evShowToastAdmin('Kontak diperbarui.');
  });
}

/* ==================== Toast (admin, tanpa app.js) ==================== */
function evShowToastAdmin(msg){
  let t = document.getElementById('admin-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'admin-toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

</script>
