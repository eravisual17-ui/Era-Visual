<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Era Visual</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui}</style>
</head>
<body class="bg-[#0f0f0f] text-white">
<div id="login" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4">
  <div class="bg-[#1a1a1a] border border-yellow-600/30 p-8 rounded-2xl w-full max-w-sm text-center">
    <h1 class="text-2xl font-bold mb-1"><span class="text-yellow-500">ERA</span> VISUAL</h1>
    <p class="text-zinc-500 text-sm mb-6">Admin Dashboard</p>
    <input id="keyInput" type="password" placeholder="Masukkan Key" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl outline-none mb-4 text-center">
    <button id="btnMasuk" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Masuk</button>
    <p id="err" class="text-red-500 text-sm mt-3 hidden">Key salah!</p>
  </div>
</div>

<div id="main" class="hidden">
  <div class="p-4 border-b border-zinc-800 flex justify-between items-center sticky top-0 bg-[#0f0f0f]">
    <h1 class="font-bold text-sm"><span class="text-yellow-500">ERA</span> VISUAL</h1>
    <div class="flex gap-2">
      <button onclick="showTab('dashboard')" id="btnTabDash" class="bg-yellow-500 text-black px-4 py-1.5 rounded-full text-[11px] font-bold">DASHBOARD</button>
      <button onclick="showTab('berita')" id="btnTabBerita" class="bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full text-[11px] font-bold">BERITA</button>
    </div>
  </div>

  <div id="viewDashboard" class="p-4">
    <h1 class="font-bold text-xl mb-6"><span class="text-yellow-500">ERA</span> VISUAL - DASHBOARD</h1>
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-zinc-900 p-5 rounded-2xl"><p class="text-xs text-zinc-500">Total Order</p><p id="totalOrder" class="text-2xl font-bold">0</p></div>
      <div class="bg-zinc-900 p-5 rounded-2xl"><p class="text-xs text-zinc-500">Cabang Top</p><p id="topCabang" class="font-bold">-</p></div>
    </div>
    <div class="bg-zinc-900 p-4 rounded-2xl">
      <div class="flex justify-between mb-3"><h3>Order Terbaru</h3><button onclick="loadData()" class="text-xs bg-zinc-800 px-2 py-1 rounded">Refresh</button></div>
      <div id="orderBody" class="text-sm space-y-2"></div>
    </div>
  </div>

  <div id="viewBerita" class="hidden p-4">
    <h1 class="font-bold text-xl mb-6">Upload Berita + Foto Iklan</h1>
    <div class="bg-zinc-900 p-5 rounded-2xl border border-yellow-500/20">
      <label class="text-xs text-zinc-400">Judul Berita</label>
      <input id="bJudul" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mt-1 mb-3 outline-none text-sm" placeholder="Promo Ende!">
      <label class="text-xs text-zinc-400">Tesk Berita</label>
      <textarea id="bIsi" rows="4" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mt-1 mb-3 outline-none text-sm" placeholder="Tulis isi berita disini..."></textarea>
      <label class="text-xs text-zinc-400">Foto Iklan (Link Foto https://...)</label>
      <input id="bFoto" class="w-full bg-black border border-zinc-700 p-3 rounded-xl mt-1 mb-4 outline-none text-sm" placeholder="https://drive.google.com/...">
      <button onclick="simpanBerita()" id="btnSimpan" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Simpan Berita</button>
      <p id="statusBerita" class="text-xs text-center mt-3 text-zinc-500"></p>
    </div>
    <div class="bg-zinc-900 p-4 rounded-2xl mt-6">
      <h3 class="font-bold mb-3 text-sm">Berita Terakhir</h3>
      <div id="listBerita" class="text-sm space-y-2 text-zinc-400">Loading...</div>
    </div>
  </div>
</div>

<script>
const ADMIN_KEY = 'eravisual2023';
const SHEET_ID = '1pHNzeZAtq_tWVayftkTsd0aS-Ol_mOytKdAQW5vQB6s';
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3uG3A/exec';

const loginDiv = document.getElementById('login');
const mainDiv = document.getElementById('main');
function doLogin(){
  const val = document.getElementById('keyInput').value;
  if(val === ADMIN_KEY){ loginDiv.style.display='none'; mainDiv.classList.remove('hidden'); loadData(); }
  else { document.getElementById('err').classList.remove('hidden'); }
}
document.getElementById('btnMasuk').addEventListener('click', doLogin);
document.getElementById('keyInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });

function showTab(tab){
  document.getElementById('viewDashboard').classList.toggle('hidden', tab!=='dashboard');
  document.getElementById('viewBerita').classList.toggle('hidden', tab!=='berita');
  document.getElementById('btnTabDash').className = tab==='dashboard' ? 'bg-yellow-500 text-black px-4 py-1.5 rounded-full text-[11px] font-bold' : 'bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full text-[11px] font-bold';
  document.getElementById('btnTabBerita').className = tab==='berita' ? 'bg-yellow-500 text-black px-4 py-1.5 rounded-full text-[11px] font-bold' : 'bg-zinc-800 text-zinc-400 px-4 py-1.5 rounded-full text-[11px] font-bold';
  if(tab==='berita') loadBeritaList();
}
async function loadData(){
  try{
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=order`;
    const res = await fetch(url); const txt = await res.text();
    const json = JSON.parse(txt.substr(47).slice(0,-2)); const rows = json.table.rows || [];
    const data = rows.map(r=>({ no: r.c[1]?.v||'', nama: r.c[11]?.v||'', cabang: r.c[5]?.v||'', wa: r.c[12]?.v||'' })).filter(d=>d.no);
    document.getElementById('totalOrder').innerText = data.length;
    const cabangCount = {}; data.forEach(d=>cabangCount[d.cabang]=(cabangCount[d.cabang]||0)+1);
    const top = Object.entries(cabangCount).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('topCabang').innerText = top ? top[0] : '-';
    document.getElementById('orderBody').innerHTML = data.slice(-15).reverse().map(d=>`
      <div class="flex justify-between bg-black/30 p-2 rounded"><span class="text-yellow-500">${d.no}</span><span>${d.nama}</span><span class="text-xs">${d.cabang}</span><a href="https://wa.me/${String(d.wa).replace(/[^0-9]/g,'')}" target="_blank" class="bg-green-600 px-2 rounded text-xs">WA</a></div>
    `).join('');
  }catch(e){ document.getElementById('orderBody').innerText='Gagal load'; }
}
async function loadBeritaList(){
  try{
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Berita`;
    const res = await fetch(url); const txt = await res.text();
    const json = JSON.parse(txt.substr(47).slice(0,-2)); const rows = json.table.rows || [];
    if(rows.length==0){ document.getElementById('listBerita').innerText='Belum ada berita'; return; }
    document.getElementById('listBerita').innerHTML = rows.slice(-10).reverse().map(r=>{
      const j = r.c[2]?.v || ''; const tgl = r.c[1]?.f || r.c[1]?.v || '';
      return `<div class="bg-black/40 p-2 rounded flex justify-between text-xs"><span>${j}</span><span class="text-[10px] text-zinc-500">${tgl}</span></div>`;
    }).join('');
  }catch(e){ document.getElementById('listBerita').innerText='Gagal load berita'; }
}
async function simpanBerita(){
  const judul=document.getElementById('bJudul').value.trim();
  const isi=document.getElementById('bIsi').value.trim();
  const foto=document.getElementById('bFoto').value.trim();
  if(!judul || !isi){ alert('Judul & Tesk wajib!'); return; }
  document.getElementById('btnSimpan').innerText='Menyimpan...';
  document.getElementById('statusBerita').innerText='Mengirim...';
  try{
    const payload={ action:'tambahBerita', id: 'B'+Date.now(), tanggal: new Date().toLocaleDateString('id-ID'), judul: judul, isi: isi, foto: foto };
    await fetch(WEB_APP_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(payload) });
    document.getElementById('statusBerita').innerText='✅ Berhasil! Cek Sheet & index.html';
    document.getElementById('bJudul').value=''; document.getElementById('bIsi').value=''; document.getElementById('bFoto').value='';
    document.getElementById('btnSimpan').innerText='Simpan Berita';
    setTimeout(loadBeritaList, 2500);
  }catch(e){
    document.getElementById('statusBerita').innerText='Gagal'; document.getElementById('btnSimpan').innerText='Simpan Berita';
  }
}
</script>
</body>
</html>
