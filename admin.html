<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Era Visual Admin</title>
<link rel="manifest" href="admin-manifest.webmanifest">
<meta name="theme-color" content="#0a7bf2">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Poppins,sans-serif;background:#eef6ff}</style><style>@media print{body *{visibility:hidden!important}#notaIsi,#notaIsi *{visibility:visible!important}#notaIsi{position:absolute;left:0;top:0;width:100%;box-shadow:none!important}}</style>
</head><body>
<div id="login" class="fixed inset-0 bg-[#0a192f] z-50 flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm p-8 rounded-[28px] text-center">
<div class="w-12 h-12 bg-[#0a7bf2] rounded-2xl mx-auto flex items-center justify-center text-white font-bold">EV</div>
<h1 class="font-bold mt-3">Era Visual Admin</h1>
<input id="keyInput" type="password" placeholder="Kunci admin" class="w-full bg-[#f6faff] border p-3 rounded-xl mt-5 text-center">
<p id="loginErr" class="hidden text-xs text-red-600 mt-3"></p>
<button id="btnMasuk" onclick="doLogin()" class="w-full bg-[#0a7bf2] text-white font-bold p-3 rounded-xl mt-3">Masuk</button></div></div>

<div id="app" class="hidden">
<div class="bg-white border-b sticky top-0 z-10"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
<div><p class="font-bold text-sm">Era Visual Admin</p><p id="info" class="text-[11px] text-gray-400"></p></div>
<button onclick="loadData()" class="bg-[#eef6ff] text-[#0a7bf2] px-4 py-2 rounded-full text-[11px] font-bold">Muat ulang</button></div></div>
<div class="max-w-6xl mx-auto p-4">
<div class="flex gap-2 mb-4"><button id="tOrder" onclick="showTab('order')" class="px-5 py-2 rounded-full text-[12px] font-bold border bg-[#0a7bf2] text-white border-[#0a7bf2]">Order</button><button id="tBerita" onclick="showTab('berita')" class="px-5 py-2 rounded-full text-[12px] font-bold border bg-white">Berita</button><button id="tRingkas" onclick="showTab('ringkas')" class="px-5 py-2 rounded-full text-[12px] font-bold border bg-white">Ringkasan</button></div>
<div id="viewOrder">
<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
<div class="bg-white p-4 rounded-2xl border"><p class="text-[11px] text-gray-400 font-bold">Total order</p><p id="total" class="text-2xl font-bold">0</p></div>
<div class="bg-yellow-50 p-4 rounded-2xl border"><p class="text-[11px] text-yellow-700 font-bold">Menunggu</p><p id="menunggu" class="text-2xl font-bold text-yellow-600">0</p></div>
<div class="bg-blue-50 p-4 rounded-2xl border"><p class="text-[11px] text-blue-700 font-bold">Dikonfirmasi</p><p id="konf" class="text-2xl font-bold text-blue-600">0</p></div>
<div class="bg-green-50 p-4 rounded-2xl border"><p class="text-[11px] text-green-700 font-bold">Selesai</p><p id="selesai" class="text-2xl font-bold text-green-600">0</p></div>
<div class="bg-white p-4 rounded-2xl border"><p class="text-[11px] text-gray-400 font-bold">Omzet hari ini</p><p id="omHari" class="text-lg font-bold text-[#0a7bf2]">Rp0</p></div>
<div class="bg-white p-4 rounded-2xl border"><select id="bulan" onchange="render()" class="text-[11px] text-gray-400 font-bold bg-transparent -ml-1 max-w-full"></select><p id="omBulan" class="text-lg font-bold text-[#0a7bf2]">Rp0</p></div>
<div class="col-span-2 md:col-span-1 bg-white p-4 rounded-2xl border"><p class="text-[11px] text-gray-400 font-bold">Omzet total</p><p id="omTotal" class="text-lg font-bold text-[#0a7bf2]">Rp0</p></div></div>
<div id="lamaBar" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-[13px] font-semibold rounded-2xl px-4 py-3 mb-3"></div>
<div id="baruBar" class="hidden flex justify-between items-center gap-3 bg-red-50 border border-red-200 text-red-700 text-[13px] font-semibold rounded-2xl px-4 py-3 mb-3"></div>
<div class="flex justify-end mb-3"><button onclick="unduhRekap()" class="bg-white border border-blue-100 text-[#0a7bf2] text-[12px] font-bold px-4 py-2 rounded-full">⬇️ Unduh rekap bulan yang dipilih</button></div>
<input id="q" oninput="render()" placeholder="Cari nama, no order, cabang, layanan, WA" class="w-full bg-white border p-3 rounded-2xl text-sm mb-3">
<div id="chips" class="flex gap-2 mb-4 overflow-x-auto"></div>
<div id="list" class="space-y-3"></div></div>
<div id="viewRingkas" class="hidden">
<div class="bg-white p-5 rounded-2xl border mb-4"><p class="font-bold text-sm">Omzet 6 bulan terakhir</p><p id="rkTotal" class="text-[12px] text-gray-400 mb-4"></p><div id="rkGrafik"></div></div>
<div class="bg-white p-5 rounded-2xl border"><p class="font-bold text-sm">Layanan terlaris</p><p class="text-[12px] text-gray-400 mb-4">6 bulan terakhir, tanpa order yang dibatalkan</p><div id="rkLayanan" class="space-y-4"></div></div></div>
<div id="viewBerita" class="hidden"><div class="bg-white p-5 rounded-2xl border">
<p id="editInfo" class="hidden text-[12px] text-yellow-700 mb-3">Sedang mengedit berita. <button onclick="batalEdit()" class="underline ml-1">Batal</button></p>
<input id="bJudul" class="w-full bg-[#f6faff] border p-3 rounded-xl mb-3 text-sm" placeholder="Judul berita">
<textarea id="bIsi" rows="6" oninput="updB()" class="w-full bg-[#f6faff] border p-3 rounded-xl mb-1 text-sm" placeholder="Isi berita"></textarea><p id="cnt" class="text-[11px] text-gray-400 text-right mb-3"></p>
<input id="bFoto" oninput="updB()" class="w-full bg-[#f6faff] border p-3 rounded-xl mb-2 text-sm" placeholder="Link foto (https://...)"><img id="bPrev" alt="Pratinjau foto" onerror="this.classList.add('hidden')" class="hidden w-full h-40 object-cover rounded-xl mb-4">
<button id="btnSimpan" onclick="simpanBerita()" class="w-full bg-[#0a7bf2] text-white font-bold p-3 rounded-xl">Terbitkan berita</button></div>
<div class="bg-white p-4 rounded-2xl border mt-4"><p class="font-bold text-sm mb-3">Berita terbaru</p><div id="listBerita" class="space-y-2"></div></div></div>
</div></div>

<div id="notaBox" class="hidden fixed inset-0 z-[60] bg-black/50 overflow-y-auto p-4">
  <div class="max-w-md mx-auto">
    <div id="notaIsi" class="bg-white rounded-2xl p-6 shadow-xl text-[#0a192f]"></div>
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button onclick="window.print()" class="bg-[#0a7bf2] text-white font-bold text-[13px] p-3 rounded-xl">🖨️ Cetak / Simpan PDF</button>
      <button onclick="notaWA()" class="bg-[#25D366] text-white font-bold text-[13px] p-3 rounded-xl">💬 Kirim lewat WA</button>
    </div>
    <button onclick="tutupNota()" class="w-full mt-2 bg-white text-[#0a192f] font-bold text-[13px] p-3 rounded-xl">Tutup</button>
  </div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3uG3A/exec';
let KUNCI=sessionStorage.getItem('ev_key')||'';
const FILTERS=['Semua','Menunggu','Dikonfirmasi','Selesai','Dibatalkan'];
let all=[],filter='Semua';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const is=(x,s)=>String(x.status).trim().toLowerCase()===s.toLowerCase();
const fmt=t=>{const d=new Date(t);return isNaN(d)?t:d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};
const wa=n=>{n=String(n).replace(/\D/g,'');return !n?'':n.startsWith('0')?'62'+n.slice(1):n.startsWith('62')?n:'62'+n};

const num=v=>Number(String(v??'').replace(/\D/g,''))||0;
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
function hitung(no){$('o-'+no).value=num($('h-'+no).value)+num($('t-'+no).value)}
function simpanOmzet(no){
  const harga=num($('h-'+no).value),tip=num($('t-'+no).value),omzet=num($('o-'+no).value);
  const d=all.find(x=>x.no===no);if(d){d.harga=harga;d.tip=tip;d.omzet=omzet;render();}
  kirim({action:'updateOmzet',no,harga,tip,omzet}).then(done);
}
async function doLogin(){
  const v=$('keyInput').value.trim();if(!v)return;
  const b=$('btnMasuk');b.disabled=true;b.textContent='Memeriksa...';
  KUNCI=v;
  const j=await kirim({action:'cek'});
  b.disabled=false;b.textContent='Masuk';
  if(j.ok===true){sessionStorage.setItem('ev_key',KUNCI);$('keyInput').value='';masuk();}
  else{KUNCI='';tampilLogin(j.error||'Tidak bisa terhubung ke server. Coba lagi.');}
}
function masuk(){$('login').style.display='none';$('app').classList.remove('hidden');loadData();}
function tampilLogin(m){$('login').style.display='flex';$('app').classList.add('hidden');const e=$('loginErr');e.textContent=m||'';e.classList.toggle('hidden',!m);}
function keluar(m){sessionStorage.removeItem('ev_key');KUNCI='';tampilLogin(m);}
$('keyInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

async function loadData(silent){
  if(!silent)$('list').textContent='Memuat...';
  try{
    const j=await kirim({action:'daftar'});
    if(j.ok!==true) throw new Error(j.error||'Tidak bisa terhubung ke server');
    all=j.data.reverse(); render();
  }catch(e){
    if(silent)return;$('list').innerHTML=`<div class="bg-red-50 text-red-700 p-4 rounded-2xl text-xs">Gagal memuat data: ${esc(e.message)}. Cek deploy Apps Script (akses: Siapa saja) dan SHEET_ID.</div>`;
  }
}

function render(){
  const q=$('q').value.toLowerCase();
  $('total').textContent=all.length;
  $('menunggu').textContent=all.filter(x=>is(x,'Menunggu')).length;
  $('konf').textContent=all.filter(x=>is(x,'Dikonfirmasi')).length;
  $('selesai').textContent=all.filter(x=>is(x,'Selesai')).length;
  $('info').textContent='Terbaca '+all.length+' order dari sheet';
  updBaru();
  const now=new Date(),sum=f=>all.filter(x=>!is(x,'Dibatalkan')).filter(x=>{const d=new Date(x.tgl);return !isNaN(d)&&f(d)}).reduce((a,x)=>a+num(x.omzet),0);
  $('omHari').textContent=rp(sum(d=>d.toDateString()===now.toDateString()));
  const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const months=[...new Set(all.map(x=>new Date(x.tgl)).filter(d=>!isNaN(d)).map(ym).concat(ym(now)))].sort().reverse();
  const sel=$('bulan'),cur=sel.value||ym(now);
  sel.innerHTML=months.map(m=>`<option value="${m}">Omzet ${new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`).join('');
  sel.value=months.includes(cur)?cur:ym(now);
  $('omBulan').textContent=rp(sum(d=>ym(d)===sel.value));
  $('omTotal').textContent=rp(sum(()=>true));
  $('chips').innerHTML=FILTERS.map(f=>`<button onclick="setFilter('${f}')" class="px-4 py-2 rounded-full text-[12px] font-bold border ${f===filter?'bg-[#0a7bf2] text-white border-[#0a7bf2]':'bg-white'}">${f}</button>`).join('');
  const rows=all.filter(x=>(filter==='Semua'||is(x,filter))&&Object.values(x).join(' ').toLowerCase().includes(q));
  $('list').innerHTML=rows.length?rows.map(d=>{
    const done=is(d,'Selesai'),conf=is(d,'Dikonfirmasi');
    const badge=is(d,'Dibatalkan')?'bg-red-100 text-red-700':done?'bg-green-100 text-green-700':conf?'bg-blue-100 text-blue-700':'bg-yellow-100 text-yellow-700';
    return `<div class="bg-white p-4 rounded-[20px] border shadow-sm">
      <div class="flex justify-between gap-2"><div>
        <p class="font-bold text-[13px]">${esc(d.no)}${isLama(d)?' <span class="ml-1 text-[10px] bg-yellow-400 text-yellow-900 px-2 py-0.5 rounded-full">Menunggu lama</span>':''}${isBaru(d)?' <span class="ml-1 text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full">BARU</span>':''}</p>
        <p class="text-[11px] text-gray-400 mt-1">${esc(fmt(d.tgl))}</p>
        <p class="font-bold text-[14px] mt-2">${esc(d.nama)} <span class="text-[11px] font-normal text-gray-500">${esc(d.cabang)}</span></p>
        <p class="text-[11px] text-gray-500 mt-1">${esc(d.layanan)}${d.detail?' - '+esc(d.detail):''}</p>
        <p class="text-[11px] text-[#0a7bf2] font-bold mt-2">${d.wa?esc(d.wa):'Nomor WA kosong'}</p></div>
        <span class="text-[10px] font-bold px-3 py-1 rounded-full h-fit ${badge}">${esc(d.status)}</span></div>
      <div class="flex gap-2 mt-4">
        <select onchange="ubah('${esc(d.no)}',this.value)" class="flex-1 bg-[#f6faff] border text-[11px] p-3 rounded-full font-bold">
          <option value="">Ubah status</option><option>Menunggu</option><option>Dikonfirmasi</option><option>Selesai</option><option>Dibatalkan</option></select>
        ${wa(d.wa)?`<a href="https://wa.me/${wa(d.wa)}" target="_blank" rel="noopener" class="bg-[#25D366] text-white px-6 py-3 rounded-full text-[11px] font-bold">WA</a>`:''}
      </div>
      ${tombolWA(d)}${tombolNota(d)}
      <details class="mt-3"><summary class="text-[12px] font-bold text-[#0a7bf2] cursor-pointer">Harga, tip, omzet${num(d.omzet)?' - '+rp(num(d.omzet)):''}</summary>
        <div class="grid grid-cols-3 gap-2 mt-2">
          <label class="text-[10px] text-gray-400">Harga<input id="h-${esc(d.no)}" value="${num(d.harga)||''}" inputmode="numeric" oninput="hitung('${esc(d.no)}')" class="w-full bg-[#f6faff] border p-2 rounded-xl text-sm text-black"></label>
          <label class="text-[10px] text-gray-400">Tip<input id="t-${esc(d.no)}" value="${num(d.tip)||''}" inputmode="numeric" oninput="hitung('${esc(d.no)}')" class="w-full bg-[#f6faff] border p-2 rounded-xl text-sm text-black"></label>
          <label class="text-[10px] text-gray-400">Omzet<input id="o-${esc(d.no)}" value="${num(d.omzet)||''}" inputmode="numeric" class="w-full bg-[#f6faff] border p-2 rounded-xl text-sm text-black"></label></div>
        <button onclick="simpanOmzet('${esc(d.no)}')" class="w-full mt-2 bg-[#0a7bf2] text-white text-[12px] font-bold p-2 rounded-xl">Simpan</button></details></div>`;}).join(''):'<p class="text-sm text-gray-400 text-center py-8">Tidak ada order yang cocok.</p>';
}

function setFilter(f){filter=f;render()}

/* ===== Berita ===== */
let berita=[],editId=null,busy=false;
const tabCls=a=>'px-5 py-2 rounded-full text-[12px] font-bold border '+(a?'bg-[#0a7bf2] text-white border-[#0a7bf2]':'bg-white');
function showTab(t){
  $('viewOrder').classList.toggle('hidden',t!=='order');
  $('viewBerita').classList.toggle('hidden',t!=='berita');
  $('viewRingkas').classList.toggle('hidden',t!=='ringkas');
  $('tOrder').className=tabCls(t==='order');$('tBerita').className=tabCls(t==='berita');$('tRingkas').className=tabCls(t==='ringkas');
  if(t==='berita')loadBerita();
  if(t==='ringkas')renderRingkas();
}
async function loadBerita(){
  $('listBerita').textContent='Memuat...';
  try{
    const j=await kirim({action:'daftarBerita'});
    if(j.ok!==true) throw new Error(j.error||'Tidak bisa terhubung ke server');
    berita=j.data.reverse();renderBerita();
  }catch(e){$('listBerita').innerHTML=`<p class="text-xs text-red-600">Gagal memuat berita: ${esc(e.message)}</p>`}
}
function renderBerita(){
  $('listBerita').innerHTML=berita.length?berita.slice(0,10).map(b=>`<div class="bg-[#f6faff] p-3 rounded-2xl border flex justify-between items-center gap-2"><div class="min-w-0"><p class="font-bold text-[13px] truncate">${esc(b.judul)}</p><p class="text-[11px] text-gray-400 truncate">${esc(b.tgl)} - ${esc(String(b.teks||'').slice(0,50))}</p></div><div class="flex gap-1"><button onclick="editBerita('${esc(b.id)}')" class="bg-yellow-100 text-yellow-800 text-[11px] px-3 py-2 rounded-full font-bold">Edit</button><button onclick="hapusBerita('${esc(b.id)}')" class="bg-red-100 text-red-700 text-[11px] px-3 py-2 rounded-full font-bold">Hapus</button></div></div>`).join(''):'<p class="text-sm text-gray-400">Belum ada berita.</p>';
}
function editBerita(id){
  const b=berita.find(x=>x.id===id);if(!b)return;
  editId=id;$('bJudul').value=b.judul;$('bIsi').value=b.teks;$('bFoto').value=b.foto;
  $('btnSimpan').textContent='Simpan perubahan';$('editInfo').classList.remove('hidden');scrollTo(0,0);updB();
}
function batalEdit(){editId=null;['bJudul','bIsi','bFoto'].forEach(i=>$(i).value='');$('btnSimpan').textContent='Terbitkan berita';$('editInfo').classList.add('hidden');updB()}
function updB(){
  $('cnt').textContent=$('bIsi').value.length+' karakter';
  const f=$('bFoto').value.trim(),im=$('bPrev');
  if(/^https?:\/\//.test(f)){im.src=f;im.classList.remove('hidden')}else{im.removeAttribute('src');im.classList.add('hidden')}
}
const kirim=p=>fetch(API,{method:'POST',body:JSON.stringify({...p,key:KUNCI})}).then(r=>r.json()).then(j=>{if(j&&j.ok===false&&/kunci|percobaan/i.test(j.error||''))keluar(j.error);return j;}).catch(()=>({ok:null}));
const done=r=>{if(r.ok===false)alert('Gagal menyimpan: '+(r.error||'tidak diketahui'));setTimeout(loadData,r.ok?200:3000)};
async function simpanBerita(){
  const judul=$('bJudul').value.trim(),teks=$('bIsi').value.trim(),foto=$('bFoto').value.trim();
  if(!judul||!teks) return alert('Judul dan isi berita wajib diisi.');
  if(busy) return;busy=true;$('btnSimpan').textContent='Menyimpan...';
  await kirim(editId?{action:'editBerita',id:editId,judul,teks,foto}:{action:'tambahBerita',id:'B'+Date.now(),tanggal:new Date().toLocaleDateString('id-ID'),judul,teks,foto});
  setTimeout(()=>{busy=false;batalEdit();loadBerita()},1500);
}
async function hapusBerita(id){
  if(busy||!confirm('Yakin hapus berita ini?')) return;busy=true;
  berita=berita.filter(x=>x.id!==id);renderBerita();
  await kirim({action:'hapusBerita',id});
  setTimeout(()=>{busy=false;loadBerita()},1500);
}

function ubah(no,status){
  if(!status) return;
  const d=all.find(x=>x.no===no); if(d){d.status=status;render();}
  kirim({action:'updateStatus',no,status}).then(done);
}

/* ===== Penanda order baru, muat ulang otomatis, unduh rekap ===== */
let seen=null;
try{const t=JSON.parse(localStorage.getItem('ev_seen')||'null');if(Array.isArray(t))seen=new Set(t);}catch(e){}
function simpanSeen(){try{localStorage.setItem('ev_seen',JSON.stringify([...seen]));}catch(e){}}
function isBaru(d){return !!seen&&!seen.has(d.no);}
function tandaiDibaca(){all.forEach(d=>seen.add(d.no));simpanSeen();render();}
function updBaru(){
  if(seen===null){seen=new Set(all.map(d=>d.no));simpanSeen();} // pertama kali: semua dianggap sudah dibaca
  const n=all.filter(isBaru).length,b=$('baruBar');
  b.classList.toggle('hidden',!n);
  b.innerHTML=n?'<span>🔔 '+n+' order baru</span><button onclick="tandaiDibaca()" class="underline font-bold">Tandai dibaca</button>':'';
  document.title=(n?'('+n+') ':'')+'Era Visual Admin';
  updLama();
}
// muat ulang tiap 60 detik, kecuali sedang mengetik atau ada form harga yang terbuka
setInterval(()=>{
  if(document.hidden||!KUNCI||$('app').classList.contains('hidden')||$('viewOrder').classList.contains('hidden'))return;
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if(document.querySelector('details[open]'))return;
  loadData(true);
},60000);
function unduhRekap(){
  const bln=$('bulan').value;if(!bln){alert('Pilih bulan dulu.');return;}
  const ymOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const rows=all.filter(x=>{const d=new Date(x.tgl);return !isNaN(d)&&ymOf(d)===bln}).sort((a,b)=>new Date(a.tgl)-new Date(b.tgl));
  if(!rows.length){alert('Tidak ada order di bulan itu.');return;}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  let tH=0,tT=0,tO=0;
  const lines=rows.map(x=>{
    const batal=is(x,'Dibatalkan'),h=num(x.harga),t=num(x.tip),o=num(x.omzet);
    if(!batal){tH+=h;tT+=t;tO+=o;}
    let w=String(x.wa).replace(/\D/g,'');if(w.startsWith('62'))w='0'+w.slice(2);else if(w&&!w.startsWith('0'))w='0'+w;
    return [q(x.no),q(new Date(x.tgl).toLocaleDateString('id-ID')),q(x.nama),q(x.layanan),q(x.cabang),q(x.detail),'="'+w+'"',q(x.status),h,t,o].join(';');
  });
  const head=['No Order','Tanggal','Nama','Layanan','Cabang','Detail','WA','Status','Harga','Tip','Omzet'].map(q).join(';');
  const total=[q('TOTAL (tanpa yang dibatalkan)'),'','','','','','','',tH,tT,tO].join(';');
  const blob=new Blob(['\ufeff'+[head].concat(lines,[total]).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rekap-omzet-'+bln+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

const angkaSingkat=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+'jt':n>=1e3?Math.round(n/1e3)+'rb':String(n);
function renderRingkas(){
  const now=new Date(),ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const bln=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);bln.push({k:ym(d),label:d.toLocaleDateString('id-ID',{month:'short'}),om:0,n:0});}
  const lay={};
  all.filter(x=>!is(x,'Dibatalkan')).forEach(x=>{
    const d=new Date(x.tgl);if(isNaN(d))return;
    const b=bln.find(m=>m.k===ym(d));if(!b)return;
    const o=num(x.omzet);b.om+=o;b.n++;
    const k=String(x.layanan||'Lainnya').toLowerCase();
    const L=lay[k]||(lay[k]={nama:k.replace(/^./,c=>c.toUpperCase()),n:0,om:0});L.n++;L.om+=o;
  });
  const max=Math.max(1,...bln.map(m=>m.om));
  $('rkTotal').textContent='Total 6 bulan: '+rp(bln.reduce((a,m)=>a+m.om,0));
  $('rkGrafik').innerHTML='<div class="flex items-end gap-2 h-40">'+bln.map((m,i)=>'<div class="flex-1 flex flex-col items-center justify-end h-full"><span class="text-[10px] text-gray-500 mb-1">'+(m.om?angkaSingkat(m.om):'')+'</span><div class="w-full rounded-t-lg '+(i===5?'bg-[#0a7bf2]':'bg-blue-200')+'" style="height:'+Math.max(2,Math.round(m.om/max*80))+'%"></div></div>').join('')+'</div><div class="flex gap-2 mt-2">'+bln.map(m=>'<div class="flex-1 text-center text-[11px] text-gray-500">'+esc(m.label)+'<br><span class="text-[10px] text-gray-400">'+m.n+' order</span></div>').join('')+'</div>';
  const arr=Object.values(lay).sort((a,b)=>b.n-a.n),maxN=Math.max(1,...arr.map(l=>l.n));
  $('rkLayanan').innerHTML=arr.length?arr.map(l=>'<div><div class="flex justify-between gap-2 text-[13px]"><b>'+esc(l.nama)+'</b><span class="text-gray-500">'+l.n+' order · '+rp(l.om)+'</span></div><div class="h-2.5 bg-blue-50 rounded-full mt-1.5"><div class="h-2.5 rounded-full bg-[#0a7bf2]" style="width:'+Math.round(l.n/maxN*100)+'%"></div></div></div>').join(''):'<p class="text-sm text-gray-400">Belum ada data.</p>';
}
