<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Era Visual</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<!-- LOGIN -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-2">Era Visual Admin</h1>
    <p class="text-center text-gray-500 mb-6 text-sm">Dual-Sheet System (Utama + Backup)</p>
    <input id="passInput" type="password" placeholder="Masukkan sandi" class="w-full border-2 p-3 rounded-xl mb-4">
    <button onclick="doLogin()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Masuk</button>
    <p id="loginError" class="text-red-500 text-sm mt-3 hidden text-center"></p>
  </div>
</div>

<!-- ADMIN -->
<div id="adminPage" class="hidden">
  <header class="bg-white shadow p-4 flex justify-between items-center sticky top-0 z-10">
    <h1 class="font-bold text-lg">Era Visual Admin</h1>
    <div class="flex gap-2">
      <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">Dual-Sheet: Utama + Backup</span>
      <button onclick="doLogout()" class="text-sm text-red-600">Keluar</button>
    </div>
  </header>

  <div class="p-3">
    <div class="flex gap-2 overflow-x-auto pb-2">
      <button onclick="switchTab('orders')" class="tab-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm whitespace-nowrap" data-tab="orders">Pesanan</button>
      <button onclick="switchTab('karyawan')" class="tab-btn bg-white px-4 py-2 rounded-full text-sm whitespace-nowrap" data-tab="karyawan">Karyawan</button>
      <button onclick="switchTab('cabang')" class="tab-btn bg-white px-4 py-2 rounded-full text-sm whitespace-nowrap" data-tab="cabang">Cabang</button>
      <button onclick="switchTab('layanan')" class="tab-btn bg-white px-4 py-2 rounded-full text-sm whitespace-nowrap" data-tab="layanan">Layanan</button>
      <button onclick="switchTab('Berita')" class="tab-btn bg-white px-4 py-2 rounded-full text-sm whitespace-nowrap" data-tab="Berita">Berita</button>
    </div>

    <div class="bg-white rounded-2xl shadow p-4 mt-3">
      <div class="flex justify-between items-center mb-4">
        <h2 id="tabTitle" class="font-bold">Pesanan</h2>
        <div class="flex gap-2">
          <input id="searchInput" oninput="doSearch()" placeholder="Cari..." class="border p-2 rounded-xl text-sm w-32">
          <button onclick="loadData()" class="bg-gray-100 px-3 py-2 rounded-xl text-sm">↻ Refresh</button>
        </div>
      </div>
      <div id="statusBox" class="text-sm text-gray-500 mb-3">Memuat data dari Google Sheets...</div>
      <div id="tableWrap" class="overflow-x-auto"></div>
    </div>
  </div>
</div>

<script>
const SANDI = 'eravisual2023';
const ERA_API = 'https://script.google.com/macros/s/AKfycbyvHf0yK5PTk0qsLcCH_FeYh20IB-HHxmuNN9JBxdGZoU1XZLhW6UlxKu08-qnwcoAHhw/exec';
let currentTab = 'orders';
let allData = [];

function doLogin(){
  const v = document.getElementById('passInput').value;
  if(v === SANDI){
    localStorage.setItem('eravisual_admin','ok');
    showAdmin();
  } else {
    document.getElementById('loginError').innerText = 'Sandi salah! pakai eravisual2023';
    document.getElementById('loginError').classList.remove('hidden');
  }
}
function doLogout(){ localStorage.removeItem('eravisual_admin'); location.reload(); }
function showAdmin(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('adminPage').classList.remove('hidden');
  loadData();
}
if(localStorage.getItem('eravisual_admin')==='ok'){ showAdmin(); }

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.className = b.dataset.tab === tab ? 'tab-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm whitespace-nowrap' : 'tab-btn bg-white px-4 py-2 rounded-full text-sm whitespace-nowrap';
  });
  document.getElementById('tabTitle').innerText = tab;
  document.getElementById('searchInput').value = '';
  loadData();
}

async function loadData(){
  const status = document.getElementById('statusBox');
  const wrap = document.getElementById('tableWrap');
  status.innerText = 'Menghubungkan ke Google Sheets...';
  
  try{
    const url = `${ERA_API}?sheet=${currentTab}`;
    console.log('FETCH:', url);
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    const txt = await res.text();
    console.log('RAW TEXT:', txt.substring(0, 500));
    
    let data = [];
    try {
      const j = JSON.parse(txt);
      data = Array.isArray(j) ? j : (j.data || j.rows || j.result || []);
    } catch(e){
      console.log('Bukan JSON:', txt);
      throw new Error('Response bukan JSON: ' + txt.substring(0,100));
    }
    
    allData = data;
    status.innerHTML = `Total data di <b>${currentTab}</b>: ${allData.length} order ✓<br>Kalau masih 0, coba buka manual: <a href="${url}" target="_blank" style="color:blue;text-decoration:underline">buka ${currentTab}</a>`;
    renderTable(allData);
    
    // Simpan ke local biar tidak hilang
    if(allData.length > 0){
      localStorage.setItem('eravisual_'+currentTab, JSON.stringify(allData));
    }
    
  }catch(e){
    status.innerText = 'Error fetch: ' + e.message + '. Coba data lokal...';
    const local = localStorage.getItem('eravisual_'+currentTab);
    if(local){
      allData = JSON.parse(local);
      renderTable(allData);
      status.innerText += ` (Menampilkan ${allData.length} data lokal)`;
    }
  }
}

function renderTable(data){
  if(!data || data.length===0){
    document.getElementById('tableWrap').innerHTML = '<p class="text-center py-10 text-gray-400">Tidak ada data di sheet '+currentTab+'</p>';
    return;
  }
  // Untuk orders tampilkan yang penting aja
  let html = '<table class="w-full text-sm"><thead><tr class="bg-gray-50">';
  if(currentTab==='orders' || currentTab==='Orders'){
    html += '<th class="p-2 text-left border-b">No Order</th><th class="p-2 text-left border-b">Pelanggan</th><th class="p-2 text-left border-b">Deskripsi</th><th class="p-2 text-left border-b">Status</th><th class="p-2 border-b">Aksi</th>';
    html += '</tr></thead><tbody>';
    data.forEach(row=>{
      html += `<tr class="border-b">
        <td class="p-2 font-mono text-xs">${row.orderNumber||row.id}</td>
        <td class="p-2"><div class="font-bold">${row.customerName||''}</div><div class="text-xs text-gray-500">${row.customerWhatsapp||''}</div></td>
        <td class="p-2">${row.description||''}</td>
        <td class="p-2"><span class="px-2 py-1 rounded-full text-xs ${row.status==='Selesai'?'bg-green-100 text-green-700': row.status==='Menunggu'?'bg-yellow-100':'bg-blue-100'}">${row.status||''}</span></td>
        <td class="p-2"><button onclick="hapusData('${row.id}')" class="bg-red-50 text-red-600 px-2 py-1 rounded text-xs">Hapus</button></td>
      </tr>`;
    });
  } else {
    const keys = Object.keys(data[0]).slice(0,5);
    html += keys.map(k=>`<th class="p-2 text-left border-b">${k}</th>`).join('') + '<th class="p-2 border-b">Aksi</th></tr></thead><tbody>';
    data.forEach(row=>{
      html += '<tr class="border-b">' + keys.map(k=>`<td class="p-2">${row[k]||''}</td>`).join('') + `<td class="p-2"><button onclick="hapusData('${row.id||row.ID||''}')" class="text-red-600 text-xs">Hapus</button></td></tr>`;
    });
  }
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;
    }

function doSearch(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  if(!q){ renderTable(allData); return; }
  const filtered = allData.filter(r=> JSON.stringify(r).toLowerCase().includes(q));
  renderTable(filtered);
}

async function hapusData(id){
  if(!confirm('Hapus data ID '+id+'? Akan hapus di Utama & Backup')) return;
  try{
    await fetch(ERA_API,{
      method:'POST',
      body: JSON.stringify({sheet:currentTab, db:'utama', action:'delete', id:id})
    });
    alert('Berhasil hapus, akan terhapus di 2 sheet');
    loadData();
  }catch(e){ alert('Gagal hapus: '+e.message); }
}
</script>
</body>
</html>
