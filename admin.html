<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Final Fix</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:Poppins}</style></head><body class="bg-[#eef6ff]">
<div id="login" class="fixed inset-0 bg-[#0a192f]/90 z-50 flex items-center justify-center p-4"><div class="bg-white p-8 rounded-[24px] w-full max-w-sm text-center"><div class="w-16 h-16 border rounded-2xl mx-auto p-1"><img src="logo.jpg" class="w-full h-full object-contain"></div><h1 class="font-bold mt-3">ADMIN FINAL FIX</h1><input id="keyInput" type="password" placeholder="eravisual2023" class="w-full bg-[#f6faff] border p-3 rounded-xl mt-5 text-center"><button id="btnMasuk" class="w-full bg-[#0a7bf2] text-white font-bold p-3 rounded-xl mt-3">Masuk</button></div></div>

<div id="main" class="hidden"><div class="bg-white border-b sticky top-0 z-10"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between"><p class="font-bold text-sm">Admin Fixed - Nama Balik</p><button onclick="loadData()" class="bg-[#eef6ff] text-[#0a7bf2] px-4 py-2 rounded-full text-[11px] font-bold">🔄 Refresh</button></div></div>
<div class="max-w-6xl mx-auto p-4">
<div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-white p-4 rounded-2xl border"><p class="text-[10px] text-gray-400 font-bold">TOTAL</p><p id="totalOrder" class="text-xl font-bold">0</p></div><div class="bg-[#0a7bf2] p-4 rounded-2xl text-white"><p class="text-[10px] font-bold">OMZET</p><p id="omzetTotal" class="text-lg font-bold">Rp 0</p></div></div>
<div id="orderBody" class="space-y-3">Loading...</div>
</div></div>

<script>
const ADMIN_KEY='eravisual2023';
const SHEET_ID='1pHNzeZAtq_tWVayftkTsd0aS-Ol_mOytKdAQW5vQB6s';
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbx_YIQAUUm7MsxMNWijk5Rg9rdfMvlAtMlPS_zzPjBpQrXJzXpxQPj3OEhdjMuxo3u3G3A/exec';

function doLogin(){if(document.getElementById('keyInput').value===ADMIN_KEY){document.getElementById('login').style.display='none';document.getElementById('main').classList.remove('hidden');loadData();}else alert('salah');}
document.getElementById('btnMasuk').addEventListener('click',doLogin);
function formatRp(n){return 'Rp '+(Number(n||0)).toLocaleString('id-ID');}

async function loadData(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&t=${Date.now()}`;
  const res=await fetch(url); const txt=await res.text(); const json=JSON.parse(txt.substr(47).slice(0,-2));
  const rows=json.table.rows;

  // KUNCI MATI SESUAI SCREENSHOT LU:
  // C=2 Nama, D=3 Layanan, E=4 Cabang, F=5 Detail, G=6 WA, I=8 Status, J=9 harga, K=10 tip, L=11 omzet
  // Baris 1 dan 2 adalah header, data mulai baris 3
  let dataRows = rows.slice(2); // skip 2 baris header

  let all = dataRows.map((r,i)=>{
    let c=r.c;
    return {
      rowNumber: i+3+1, // +1 karena sheet mulai 1, +2 header
      nama: c[2]?.v || '',      // C
      layanan: c[3]?.v || '',   // D
      cabang: c[4]?.v || '',    // E
      detail: c[5]?.v || '',    // F
      wa: c[6]?.v || '',        // G
      status: c[8]?.v || 'Menunggu', // I
      harga: Number(c[9]?.v || 0),    // J
      tip: Number(c[10]?.v || 0),     // K
      omzet: Number(c[11]?.v || 0),   // L
    };
  }).filter(d=>d.nama || d.wa);

  document.getElementById('totalOrder').innerText=all.length;
  let selesai=all.filter(o=>String(o.status).toLowerCase().includes('selesai'));
  document.getElementById('omzetTotal').innerText=formatRp(selesai.reduce((a,b)=>a+(b.omzet||b.harga+b.tip),0));

  document.getElementById('orderBody').innerHTML=all.slice(-50).reverse().map(d=>`
  <div class="bg-white p-4 rounded-2xl border shadow-sm">
    <div class="flex justify-between"><div><p class="font-bold text-[14px]">${d.nama} <span class="text-[12px] font-normal text-gray-400">• ${d.layanan}</span></p><p class="text-[12px] text-gray-500 mt-1">${d.cabang} • ${d.detail}</p><p class="text-[12px] text-[#0a7bf2] mt-1 font-bold">WA: ${d.wa}</p></div><span class="text-[10px] bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full font-bold h-fit">${d.status}</span></div>
    <div class="grid grid-cols-3 gap-2 mt-4 bg-[#f6faff] p-3 rounded-xl border">
      <div><label class="text-[9px] font-bold text-gray-500">J HARGA</label><input id="harga-${d.rowNumber}" type="number" value="${d.harga||''}" class="w-full bg-white border rounded-lg p-2 text-[12px] mt-1"></div>
      <div><label class="text-[9px] font-bold text-gray-500">K TIP</label><input id="tip-${d.rowNumber}" type="number" value="${d.tip||''}" class="w-full bg-white border rounded-lg p-2 text-[12px] mt-1"></div>
      <div><label class="text-[9px] font-bold text-gray-500">L OMZET</label><div class="bg-[#0a7bf2] text-white rounded-lg p-2.5 text-[12px] mt-1 font-bold text-center">${formatRp(d.omzet||d.harga+d.tip)}</div></div>
    </div>
    <div class="flex gap-2 mt-3">
      <select onchange="updateStatus(${d.rowNumber},this.value)" class="flex-1 bg-white border text-[11px] p-2.5 rounded-full font-bold"><option>Ubah Status</option><option value="Menunggu">Menunggu</option><option value="Dikonfirmasi">Dikonfirmasi</option><option value="Selesai">Selesai</option></select>
      <button onclick="simpanOmzet(${d.rowNumber})" class="flex-1 bg-[#12223d] text-white text-[11px] p-2.5 rounded-full font-bold">💾 Simpan JKL</button>
      <a href="https://wa.me/${String(d.wa).replace(/[^0-9]/g,'')}" target="_blank" class="bg-[#25D366] text-white px-5 py-2.5 rounded-full text-[11px] font-bold">WA</a>
    </div>
  </div>`).join('');
}

function updateStatus(row,status){if(status.includes('Ubah'))return; fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateStatus',row:row,status:status})}); setTimeout(loadData,1000);}
function simpanOmzet(row){let h=Number(document.getElementById('harga-'+row).value||0); let t=Number(document.getElementById('tip-'+row).value||0); let tot=h+t; if(h==0){alert('Isi J HARGA dulu ka!');return;} fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateOmzet',row:row,harga:h,tip:t,omzet:tot})}); alert('Simpan: '+formatRp(tot)); setTimeout(loadData,1000);}
</script></body></html>
